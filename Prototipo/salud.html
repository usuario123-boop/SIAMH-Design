<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salud y Vulnerabilidad · SIAMH</title>
<link rel="icon" href="assets/img/simh-isotipo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  .g-maestro{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  @media (max-width:1180px){ .g-maestro{grid-template-columns:1fr} }

  /* ---------- Lista de trabajo: lo que exige acción se lee sin color ---- */
  .pers-item{display:block;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--linea-suave);padding:11px 12px;cursor:pointer;
    font-family:var(--f-texto);position:relative}
  .pers-item:hover{background:var(--hueso-claro)}
  .pers-item.activo{background:var(--jade-050)}
  .pers-item.activo::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    background:var(--jade);border-radius:0 3px 3px 0}
  .pers-item .p-nom{display:block;font-size:13.5px;font-weight:700;color:var(--tinta);line-height:1.3;margin:6px 0 2px}
  .pers-item .p-folio{display:block;font-size:11.5px;color:var(--gris-claro);font-variant-numeric:tabular-nums}
  .pers-item .p-motivo{display:block;font-size:11.5px;color:var(--gris);line-height:1.4;margin-top:3px}

  .chips-filtro{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chips-filtro .chip{cursor:pointer;border:0;font-family:var(--f-texto)}

  /* ---------- Nivel de atención: dos dimensiones, no un solo semáforo --- */
  .nivel{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    border:1px solid var(--linea-suave);border-radius:var(--radio);padding:11px 14px;
    background:var(--hueso-claro);margin-bottom:16px}
  .nivel .n-col{display:block}
  .nivel .n-lab{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--gris-claro);font-weight:700;margin-bottom:2px}
  .nivel .n-val{display:block;font-size:15px;font-weight:700;line-height:1.2}
  .nivel .n-sep{display:block;width:1px;align-self:stretch;background:var(--linea);flex:none}
  .nivel .n-num{display:block;font-size:19px;font-weight:600;line-height:1.2}
  .n-inmediata{color:var(--critico)}
  .n-prioritaria{color:var(--rosa)}
  .n-estandar{color:var(--tinta)}

  /* ---------- Marcadores de vulnerabilidad ------------------------------ */
  .vuln-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  @media (max-width:1000px){ .vuln-grid{grid-template-columns:1fr} }
  .vuln-g{margin-bottom:16px}
  .vuln-g > h4{margin:0 0 8px;font-family:var(--f-texto);font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--gris-claro);font-weight:700}
  .vuln-item{display:flex;gap:9px;align-items:flex-start;padding:6px 0;cursor:pointer}
  .vuln-item input{width:17px;height:17px;accent-color:var(--jade);margin-top:1px;flex:none}
  .vuln-item .v-t{display:block;font-size:13.5px;line-height:1.35;color:var(--tinta)}
  .vuln-item .v-n{display:block;font-size:11.5px;color:var(--gris-claro);line-height:1.4;margin-top:1px}
  .vuln-item .v-ruta{display:block;font-size:11.5px;line-height:1.4;margin-top:3px;
    color:var(--gris);padding-left:9px;border-left:2px solid var(--linea)}
  .vuln-item.marcado .v-ruta{color:var(--jade-900);border-left-color:var(--jade)}
  .vuln-item.marcado.obliga .v-ruta{color:var(--guinda-900);border-left-color:var(--guinda);font-weight:700}
  .vuln-item .v-marca{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    font-weight:700;color:var(--gris-claro);border:1px solid var(--linea);border-radius:999px;
    padding:1px 6px;margin-left:6px;vertical-align:1px}
  .vuln-item.obliga .v-marca{color:var(--guinda);border-color:rgba(174,25,45,.35)}

  /* ---------- Catálogo OMS ---------------------------------------------- */
  .cat-buscar{position:relative;margin-bottom:12px}
  .cat-buscar input{width:100%;height:38px;border:1px solid var(--linea);border-radius:var(--radio-s);
    padding:0 12px 0 38px;font-family:var(--f-texto);font-size:13.5px;background:var(--blanco)}
  .cat-buscar input:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-050)}
  .cat-buscar .lupa{position:absolute;left:12px;top:50%;transform:translateY(-50%);line-height:0;color:var(--gris-claro)}

  details.cat-g{border:1px solid var(--linea-suave);border-radius:var(--radio);margin-bottom:8px}
  details.cat-g > summary{cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:700;
    color:var(--tinta);list-style:none;display:flex;align-items:center;gap:9px}
  details.cat-g > summary::-webkit-details-marker{display:none}
  details.cat-g > summary::before{content:"+";font-size:15px;line-height:1;color:var(--jade);width:10px}
  details.cat-g[open] > summary::before{content:"−"}
  details.cat-g > summary .c-cuenta{margin-left:auto;font-size:11px;font-weight:700;color:var(--gris-claro)}
  details.cat-g > summary .c-cuenta.hay{color:var(--jade-900)}
  .cat-lista{padding:2px 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media (max-width:1000px){ .cat-lista{grid-template-columns:1fr} }
  .cat-op{display:flex;gap:9px;align-items:center;padding:5px 0;cursor:pointer;font-size:13.5px}
  .cat-op input{width:16px;height:16px;accent-color:var(--jade);flex:none}
  .cat-op .c-cod{display:inline-block;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--gris-claro);
    background:var(--hueso);border-radius:4px;padding:1px 5px;margin-left:auto;flex:none}
  .cat-vacio{font-size:12.5px;color:var(--gris-claro);padding:10px 2px}

  .otra-cond{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:6px}
  .otra-cond input{flex:1;min-width:200px;height:36px;border:1px solid var(--linea);
    border-radius:var(--radio-s);padding:0 11px;font-family:var(--f-texto);font-size:13.5px}
  .otra-cond input:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-050)}

  .fila-nueva{background:var(--jade-020)}
  .sel-estado{height:30px;border:1px solid var(--linea);border-radius:var(--radio-s);
    font-family:var(--f-texto);font-size:12.5px;padding:0 8px;background:var(--blanco)}

  /* ---------- Barra de guardado ----------------------------------------- */
  .barra-guardar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
    padding:12px 16px;margin-bottom:16px}
  .barra-guardar .b-est{font-size:12.5px;color:var(--gris);display:flex;align-items:center;gap:7px}
  .barra-guardar .b-est svg{width:14px;height:14px;flex:none;stroke-width:2}

  /* ---------- Canalización y vista previa del oficio -------------------- */
  .g-canaliza{display:grid;grid-template-columns:1fr 306px;gap:22px;align-items:start}
  @media (max-width:1100px){ .g-canaliza{grid-template-columns:1fr} }

  /* .oficio-hoja y .oficio-cap viven ahora en simh.css §22: la hoja
     membretada la comparten esta canalización y la emisión de oficios. */

  /* Acción dentro del texto de un aviso: debe fluir con la frase, no ser un
     bloque flex que la parta en dos líneas. */
  .enlace-inline{display:inline;background:none;border:0;padding:0;font:inherit;
    font-weight:700;color:var(--jade-900);cursor:pointer;text-decoration:underline}
</style>
</head>

<script>
(function () {
  "use strict";
  SIMH.chrome("salud");
  var ico = SIMH.icono, esc = SIMH.esc;
  var $ = function (s) { return document.querySelector(s); };

  $("#btnXls").innerHTML    = ico("excel") + "Exportar valoraciones";
  $("#btnBuscar").innerHTML = ico("buscar") + "Buscar otro expediente";
  $("#avisoSensible").innerHTML = ico("candado") +
    "<span><strong>Información sensible</strong>Los datos de salud y vulnerabilidad solo son visibles para los " +
    "perfiles autorizados de esta dirección y en los reportes agregados se usan siempre de forma anonimizada " +
    "(RNF01). Ninguna condición se elimina: se marca como resuelta y conserva su historial (RNF03).</span>";

  /* ======================================================================
     1. Catálogo de marcadores de vulnerabilidad
     Marcar una casilla aquí no es informativo: activa una ruta con plazo.
     Por eso cada marcador declara su consecuencia junto a la casilla.
     ================================================================== */
  var VULN = [
    { g: "Edad y desarrollo", items: [
      { id:"nna",     t:"Niña, niño o adolescente (NNA)", n:"Persona menor de 18 años" },
      { id:"nnasep",  t:"NNA separado o no acompañado", obliga:true,
        ruta:"Oficio a la Procuraduría Regional de Protección dentro de 24 h (RF06). Se emite desde el expediente familiar.",
        link:{ href:"familiar.html?g=1", txt:"Ir al expediente familiar" } },
      { id:"mayor",   t:"Persona adulta mayor", n:"60 años o más" }
    ]},
    { g: "Salud y maternidad", items: [
      { id:"emb",     t:"Embarazo o periodo de lactancia",
        ruta:"Canalización a control prenatal en la primera cita disponible.",
        canaliza:{ inst:"IMSS-Bienestar", motivo:"Control prenatal y valoración obstétrica" } },
      { id:"disc",    t:"Persona con discapacidad", n:"Motriz, visual, auditiva, intelectual o psicosocial",
        ruta:"Requiere ajustes razonables en ventanilla y en el traslado." },
      { id:"cronica", t:"Enfermedad crónica o grave sin tratamiento",
        ruta:"Canalización a primer nivel de atención para continuidad del tratamiento.",
        canaliza:{ inst:"Centro de Salud Municipal", motivo:"Continuidad de tratamiento de enfermedad crónica" } }
    ]},
    { g: "Violencia y delito", items: [
      { id:"victima", t:"Víctima o testigo de delito", obliga:true,
        ruta:"Aviso a la Fiscalía y a la Comisión Ejecutiva de Atención a Víctimas dentro de 24 h.",
        canaliza:{ inst:"Jurisdicción Sanitaria VII · atención a víctimas", motivo:"Valoración médica y psicológica por hecho victimizante" } },
      { id:"trata",   t:"Indicios de trata de personas", obliga:true,
        ruta:"Activa el protocolo especial: resguardo inmediato y notificación a la unidad especializada.",
        canaliza:{ inst:"Jurisdicción Sanitaria VII · atención a víctimas", motivo:"Protocolo de atención a posible víctima de trata" } },
      { id:"violen",  t:"Violencia familiar o de género",
        ruta:"Canalización a refugio y acompañamiento jurídico.",
        canaliza:{ inst:"Jurisdicción Sanitaria VII · atención a víctimas", motivo:"Valoración por violencia familiar o de género" } }
    ]},
    { g: "Situación social", items: [
      { id:"asilo",   t:"Solicitante de asilo o refugio", n:"Trámite ante COMAR en curso" },
      { id:"indig",   t:"Persona indígena o afromexicana",
        ruta:"Requiere intérprete en su lengua para la valoración." },
      { id:"lgbt",    t:"Población LGBTTTIQ+" },
      { id:"calle",   t:"Sin red de apoyo o en situación de calle",
        ruta:"Valorar alojamiento temporal antes de la canalización." }
    ]}
  ];

  var VULN_IDX = {};
  VULN.forEach(function (g) { g.items.forEach(function (v) { VULN_IDX[v.id] = v; }); });

  /* ======================================================================
     2. Catálogo de condiciones de salud (OMS / CIE-10)
     Se agrupa y se pliega: 30 casillas abiertas a la vez son ilegibles,
     pero el buscador recorre los seis grupos y abre los que coinciden.
     ================================================================== */
  var CATALOGO = [
    { g:"Enfermedades crónicas no transmisibles", abierto:true, items:[
      ["E11","Diabetes mellitus tipo 2"], ["I10","Hipertensión arterial"],
      ["C80","Cáncer, sitio no especificado"], ["N18","Enfermedad renal crónica"],
      ["J45","Asma"], ["E78","Dislipidemia"] ]},
    { g:"Enfermedades infecciosas", abierto:true, items:[
      ["B24","VIH / sida"], ["A15","Tuberculosis pulmonar"], ["A90","Dengue"],
      ["B16","Hepatitis B"], ["J06","Infección respiratoria aguda"],
      ["A09","Enfermedad diarreica aguda"] ]},
    { g:"Salud materna y perinatal", items:[
      ["Z34","Embarazo de bajo riesgo"], ["O09","Embarazo de alto riesgo"],
      ["Z39","Puerperio"], ["Z39.1","Lactancia materna"] ]},
    { g:"Salud mental y consumo de sustancias", items:[
      ["F32","Episodio depresivo"], ["F41","Trastorno de ansiedad"],
      ["F43.1","Estrés postraumático"], ["F19","Consumo de sustancias"] ]},
    { g:"Discapacidad", items:[
      ["Z73.6","Discapacidad motriz"], ["H54","Discapacidad visual"],
      ["H91","Discapacidad auditiva"], ["F79","Discapacidad intelectual"],
      ["F99","Discapacidad psicosocial"] ]},
    { g:"Lesiones y condiciones del trayecto", items:[
      ["E46","Desnutrición"], ["E86","Deshidratación"],
      ["L98","Lesiones en pies por trayecto"], ["T14","Herida o traumatismo"] ]}
  ];

  var INSTITUCIONES = [
    "IMSS-Bienestar",
    "Hospital General de Tapachula",
    "Hospital Regional de Alta Especialidad Ciudad Salud",
    "Centro de Salud Municipal",
    "Jurisdicción Sanitaria VII · atención a víctimas",
    "Otra institución"
  ];

  var ESTADOS_COND = ["Activa", "En tratamiento", "Controlada", "Resuelta"];

  /* ======================================================================
     3. Cartera de trabajo del módulo
     Ordenada por urgencia, no por fecha: primero lo que tiene plazo legal,
     después la cita vencida, después lo pendiente y al final el seguimiento.
     ================================================================== */
  var URG = {
    inm:      { txt:"Atención inmediata", chip:"chip-guinda", ico:"alerta" },
    vencida:  { txt:"Cita vencida",       chip:"chip-rosa",   ico:"reloj"  },
    pend:     { txt:"Pendiente de valoración", chip:"chip-neutro", ico:"reloj" },
    seg:      { txt:"En seguimiento",     chip:"chip-jade",   ico:"check"  },
    fin:      { txt:"Valoración concluida", chip:"chip-neutro", ico:"check" }
  };

  var P = [
    { f:"SIAMH-2026-TAP-0410", n:"Keiner Alexander Rojas Mora", ini:"KR", ed:16, pais:"Venezuela",
      mun:"Tapachula", curp:"ROMK100722HNEXXX03", grupo:"SIAMH-FAM-2026-0338", grupoHref:"familiar.html?g=1",
      urg:"inm", motivo:"NNA separado detectado en ventanilla · 2 días sin valorar",
      resp:"Sin asignar", ultima:"Sin valoración clínica",
      vuln:["nna","nnasep","calle"],
      cond:[ {cod:"E46", t:"Desnutrición", grupo:"Lesiones y condiciones del trayecto",
              est:"Activa", fecha:"24/08/2026", por:"Ventanilla · M. Gómez"} ],
      can:[] },

    { f:"SIAMH-2026-SUC-0177", n:"Marta Lucía Xicoténcatl Pérez", ini:"MX", ed:41, pais:"Guatemala",
      mun:"Suchiate", curp:"XIPM850214MNEXXX07", grupo:"SIAMH-FAM-2026-0332", grupoHref:"familiar.html?g=2",
      urg:"vencida", motivo:"No acudió a la cita del 20/08 · requiere reprogramación",
      resp:"Luis A. Ramírez", ultima:"12/08/2026",
      vuln:["cronica","indig"],
      cond:[ {cod:"E11", t:"Diabetes mellitus tipo 2", grupo:"Enfermedades crónicas no transmisibles",
              est:"En tratamiento", fecha:"12/08/2026", por:"Salud · L. Ramírez"},
             {cod:"I10", t:"Hipertensión arterial", grupo:"Enfermedades crónicas no transmisibles",
              est:"Controlada", fecha:"12/08/2026", por:"Salud · L. Ramírez"} ],
      can:[ {fecha:"12/08/2026", inst:"Centro de Salud Municipal", motivo:"Control metabólico y surtido de metformina",
             of:"SFS/0874/2026", cita:"20/08/2026", est:"No acudió"} ] },

    { f:"SIAMH-2026-TAP-0409", n:"Óscar Danilo Hernández Reyes", ini:"OH", ed:35, pais:"El Salvador",
      mun:"Tapachula", curp:"HERO910930HNEXXX01", grupo:"—", grupoHref:"",
      urg:"inm", motivo:"Víctima de delito en tránsito · marcado en ventanilla ayer",
      resp:"Sin asignar", ultima:"Sin valoración clínica",
      vuln:["victima"],
      cond:[], can:[] },

    { f:"SIAMH-2026-MOT-0061", n:"Rosalinda Gómez Vázquez", ini:"RG", ed:63, pais:"Guatemala",
      mun:"Motozintla", curp:"GOVR630405MNEXXX09", grupo:"SIAMH-FAM-2026-0327", grupoHref:"familiar.html?g=3",
      urg:"pend", motivo:"Adulta mayor · sin valoración desde el registro del 12/08",
      resp:"Sin asignar", ultima:"Sin valoración clínica",
      vuln:["mayor"],
      cond:[], can:[] },

    { f:"SIAMH-2026-TAP-0411", n:"Jean-Baptiste Pierre Louis", ini:"JP", ed:27, pais:"Haití",
      mun:"Tapachula", curp:"PILJ990118HNEXXX05", grupo:"—", grupoHref:"",
      urg:"pend", motivo:"Lesiones en pies por el trayecto · requiere intérprete de creole",
      resp:"Sin asignar", ultima:"Sin valoración clínica",
      vuln:["indig"],
      cond:[], can:[] },

    { f:"SIAMH-2026-TAP-0412", n:"Yolanda Esperanza Martínez Cruz", ini:"YM", ed:32, pais:"Honduras",
      mun:"Tapachula", curp:"MACY940318MNEXXX01", grupo:"SIAMH-FAM-2026-0341", grupoHref:"familiar.html?g=0",
      urg:"seg", motivo:"Embarazo de 22 semanas e hipertensión · próxima cita 12/09",
      resp:"Luis A. Ramírez", ultima:"18/08/2026",
      vuln:["emb","asilo"],
      cond:[ {cod:"Z34", t:"Embarazo de bajo riesgo", grupo:"Salud materna y perinatal",
              est:"En tratamiento", fecha:"18/08/2026", por:"Salud · L. Ramírez"},
             {cod:"I10", t:"Hipertensión arterial", grupo:"Enfermedades crónicas no transmisibles",
              est:"Controlada", fecha:"18/08/2026", por:"Salud · L. Ramírez"} ],
      can:[ {fecha:"18/08/2026", inst:"IMSS-Bienestar", motivo:"Control prenatal",
             of:"SFS/0912/2026", cita:"12/09/2026", est:"Atendida"},
            {fecha:"24/08/2026", inst:"Hospital General de Tapachula", motivo:"Valoración por hipertensión",
             of:"SFS/0947/2026", cita:"03/09/2026", est:"Cita programada"} ] },

    { f:"SIAMH-2026-FCO-0094", n:"Yamilé Rodríguez Betancourt", ini:"YR", ed:29, pais:"Cuba",
      mun:"F. Comalapa", curp:"ROBY970712MNEXXX04", grupo:"—", grupoHref:"",
      urg:"seg", motivo:"Trastorno de ansiedad en tratamiento · cita de control 05/09",
      resp:"Luis A. Ramírez", ultima:"20/08/2026",
      vuln:["violen"],
      cond:[ {cod:"F41", t:"Trastorno de ansiedad", grupo:"Salud mental y consumo de sustancias",
              est:"En tratamiento", fecha:"20/08/2026", por:"Salud · L. Ramírez"} ],
      can:[ {fecha:"20/08/2026", inst:"Jurisdicción Sanitaria VII · atención a víctimas",
             motivo:"Atención psicológica por violencia de género", of:"SFS/0931/2026",
             cita:"05/09/2026", est:"Cita programada"} ] },

    { f:"SIAMH-2026-TAP-0408", n:"Wilmer Josué Aguilar Paz", ini:"WA", ed:9, pais:"Honduras",
      mun:"Tapachula", curp:"AUPW170203HNEXXX06", grupo:"SIAMH-FAM-2026-0341", grupoHref:"familiar.html?g=0",
      urg:"fin", motivo:"NNA acompañado · valoración sin hallazgos el 22/08",
      resp:"Luis A. Ramírez", ultima:"22/08/2026",
      vuln:["nna"],
      cond:[], can:[] }
  ];

  var FILTROS = [
    { id:"accion", txt:"Requieren acción", test:function (p) { return p.urg === "inm" || p.urg === "vencida"; } },
    { id:"pend",   txt:"Sin valorar",      test:function (p) { return p.urg === "pend" || p.urg === "inm"; } },
    { id:"seg",    txt:"En seguimiento",   test:function (p) { return p.urg === "seg"; } },
    { id:"todas",  txt:"Todas",            test:function () { return true; } }
  ];

  var sel = 0, filtro = "todas", busca = "";
  var oficioSec = 947;                       /* último folio emitido en la ficción */

  /* ------------------------------------------------------- Utilidades --- */
  function hoy() {
    var d = new Date(2026, 7, 25);            /* fecha fija del prototipo */
    return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear();
  }
  function nuevoFolio() {
    oficioSec += 1;
    return "SFS/" + ("000" + oficioSec).slice(-4) + "/2026";
  }
  function chipUrg(p) {
    var u = URG[p.urg];
    return '<span class="chip ' + u.chip + '">' + ico(u.ico) + esc(u.txt) + "</span>";
  }
  /* Nivel de atención: lo decide el marcador con plazo legal, no el conteo. */
  function nivel(p) {
    var obliga = p.vuln.filter(function (id) { return VULN_IDX[id] && VULN_IDX[id].obliga; });
    if (obliga.length) return { k:"inmediata", txt:"Atención inmediata (24 h)", cls:"n-inmediata" };
    if (p.vuln.length) return { k:"prioritaria", txt:"Atención prioritaria", cls:"n-prioritaria" };
    return { k:"estandar", txt:"Atención estándar", cls:"n-estandar" };
  }
  function rutasObligadas(p) {
    return p.vuln.map(function (id) { return VULN_IDX[id]; })
      .filter(function (v) { return v && v.ruta; });
  }

  /* ====================================================== Lista ========= */
  function visibles() {
    var ft = FILTROS.filter(function (f) { return f.id === filtro; })[0];
    var q = busca.trim().toLowerCase();
    return P.filter(function (p) {
      if (!ft.test(p)) return false;
      if (!q) return true;
      return (p.n + " " + p.f + " " + p.curp).toLowerCase().indexOf(q) >= 0;
    });
  }

  function pintarChips() {
    $("#chipsFiltro").innerHTML = FILTROS.map(function (f) {
      var c = P.filter(f.test).length;
      return '<button class="chip ' + (f.id === filtro ? "chip-jade" : "chip-neutro") +
        '" type="button" data-f="' + f.id + '" aria-pressed="' + (f.id === filtro) + '">' +
        esc(f.txt) + " " + c + "</button>";
    }).join("");
  }

  function pintarLista() {}
  function pintarChips() {}

    var nuevas = p.cond.filter(function (c) { return c.nuevo; }).length;

        (obliga.length ? obliga.map(linea).join("") : derivadas.map(linea).join("")) +

          ? '<span style="display:block;margin-top:9px;padding-top:7px;border-top:1px solid rgba(174,25,45,.2)">' +

    /* ---------------- Marcadores de vulnerabilidad ------------------- */
    h += '<article class="tarjeta" style="margin-bottom:16px">' +
      '<div class="grafica-enc"><h3>Valoración de vulnerabilidad</h3>' +

    /* ---------------- Condiciones registradas ------------------------ */

      '<div class="grafica-enc"><h3>Condiciones registradas</h3>' +
        '<span class="txt-min">' + p.cond.length + (p.cond.length === 1 ? " condición" : " condiciones") + "</span></div>" +
      (p.cond.length
        ? '<table class="tabla" style="font-size:13px"><thead><tr>' +
            "<th>Condición</th><th>Código</th><th>Grupo</th><th>Detectada</th><th>Registró</th>" +
            "<th>Estado</th><th></th></tr></thead><tbody>" +
          p.cond.map(function (c, i) {
            return '<tr' + (c.nuevo ? ' class="fila-nueva"' : "") + "><td>" + esc(c.t) +
              (c.nuevo ? ' <span class="chip chip-jade" style="margin-left:4px">Sin guardar</span>' : "") + "</td>" +
              '<td class="mono">' + esc(c.cod) + "</td>" +

        "fecha y su responsable (RNF03). Solo las condiciones aún sin guardar pueden quitarse.</div>" +

          '<div class="campo"><label for="cCita">Fecha de cita <span class="opc">(si ya está agendada)</span></label>' +
            '<input type="date" id="cCita"></div>' +
          '<div class="campo"><label for="cAcomp">Requiere acompañamiento</label>' +

        "</div>" +

          "Indique el motivo de la canalización antes de generar el oficio.</span></div>" +
        '<button class="btn btn-primario btn-grande" type="button" id="btnOficio">' +
          ico("oficios") + "Generar oficio de canalización</button>" +

          "Se descarga en PDF y se adjunta al expediente. El documento no incluye código QR: se valida por folio " +
          "y sello de la Secretaría.</div>" +
      "</div>" +
      '<div><div class="etiqueta" style="margin-bottom:6px">Vista previa del oficio</div>' +
        '<div class="oficio-hoja" id="hojaOficio"></div>' +

      '<div class="grafica-enc mt-20"><h3>Canalizaciones de la persona</h3></div>' +

        ? '<table class="tabla" style="font-size:13px"><thead><tr>' +
            "<th>Fecha</th><th>Institución</th><th>Motivo</th><th>Oficio</th><th>Cita</th><th>Estado</th>" +
            "</tr></thead><tbody>" +
          p.can.slice().reverse().map(function (c) {
            var chip = c.est === "No acudió" ? "chip-rosa"
                     : c.est === "Atendida" ? "chip-jade"
                     : "chip-neutro";
            return '<tr><td class="mono">' + esc(c.fecha) + "</td><td>" + esc(c.inst) + "</td>" +
              "<td>" + esc(c.motivo) + '</td><td class="mono">' + esc(c.of) + "</td>" +
              '<td class="mono">' + esc(c.cita || "Por agendar") + "</td>" +
              '<td><span class="chip ' + chip + '">' + esc(c.est) + "</span></td></tr>";
          }).join("") + "</tbody></table>"
        : '<div class="cat-vacio">Sin canalizaciones. La primera se genera con el formulario de arriba.</div>') +
    "</article>";

    $("#detalle").innerHTML = h;
    pintarCatalogo("");
    pintarOficio();
    enlazarDetalle();
  }

  /* --------------------------------------------- Catálogo plegable ----- */
  function pintarCatalogo(q) {
    var p = P[sel];
    q = (q || "").trim().toLowerCase();
    var puestas = {};
    p.cond.forEach(function (c) { puestas[c.cod] = true; });

    var html = CATALOGO.map(function (g) {
      var items = g.items.filter(function (it) {
        return !q || (it[1] + " " + it[0] + " " + g.g).toLowerCase().indexOf(q) >= 0;
      });
      if (!items.length) return "";
      var marcadas = items.filter(function (it) { return puestas[it[0]]; }).length;
      var abierto = q ? true : !!g.abierto;
      return '<details class="cat-g"' + (abierto ? " open" : "") + "><summary>" + esc(g.g) +
        '<span class="c-cuenta' + (marcadas ? " hay" : "") + '">' +
          (marcadas ? marcadas + " marcadas" : items.length + " opciones") + "</span></summary>" +
        '<div class="cat-lista">' + items.map(function (it) {
          var on = !!puestas[it[0]];
          return '<label class="cat-op"><input type="checkbox" data-c="' + esc(it[0]) +
            '" data-g="' + esc(g.g) + '" data-t="' + esc(it[1]) + '"' + (on ? " checked" : "") + ">" +
            "<span>" + esc(it[1]) + '</span><span class="c-cod">' + esc(it[0]) + "</span></label>";
        }).join("") + "</div></details>";
    }).join("");

    document.getElementById("catGrupos").innerHTML =
      html || '<div class="cat-vacio">Ninguna condición del catálogo coincide con la búsqueda. ' +
              "Puede registrarla en <em>Condición no incluida en el catálogo</em>.</div>";
  }

    var inst = document.getElementById("cInst").value;
    var mot  = document.getElementById("cMotivo").value.trim();
    var cita = document.getElementById("cCita").value;
    var acomp = document.getElementById("cAcomp").value;
    var citaTxt = cita ? cita.split("-").reverse().join("/") : "por agendar";

    document.getElementById("hojaOficio").innerHTML =
      '<div class="o-membrete">' +
        '<span class="o-inst">Gobierno del Estado de Chiapas</span>' +
        '<span class="o-inst">Secretaría de la Frontera Sur</span>' +
        '<span class="o-inst" style="color:var(--gris-claro)">Dirección de Atención a Personas en Movilidad</span>' +
        '<div class="cenefa-fina" style="margin-top:7px"></div>' +
      "</div>" +
      '<div class="o-cuerpo">' +
        '<span class="o-folio">Oficio ' + ("SFS/" + ("000" + (oficioSec + 1)).slice(-4) + "/2026") +
          "<br>Tapachula, Chiapas, a " + hoy() + "</span>" +
        '<span class="o-dest">' + esc(inst) + "<br>P R E S E N T E</span>" +
        "<p>Por medio del presente y con fundamento en el artículo 8 de la Ley de Migración, me permito " +
          "canalizar a la persona <b>" + esc(p.n) + "</b>, de " + p.ed + " años, registrada en el Sistema " +
          "Integral de Movilidad Humana con folio <b>" + esc(p.f) + "</b>, para su atención por el motivo " +
          "siguiente:</p>" +
        "<p><b>" + (mot ? esc(mot) : "— motivo pendiente de capturar —") + "</b></p>" +
        "<p>Fecha de cita: <b>" + esc(citaTxt) + "</b>. Acompañamiento: <b>" + esc(acomp) + "</b>.</p>" +
        "<p>Sin otro particular, agradezco las atenciones brindadas.</p>" +
        '<div class="o-firma"><span class="o-raya"></span>Director de Área<br>' +
          "Secretaría de la Frontera Sur</div>" +
      "</div>" +
      '<div class="o-pie">Documento con datos personales sensibles. Su validación se realiza por folio y sello ' +
        "ante la Secretaría; no incluye código QR.</div>";

  /* -------------------------------------------------- Eventos ---------- */
  function enlazarDetalle() {
    var p = P[sel];
    var det = document.getElementById("detalle");

    /* Marcadores de vulnerabilidad */
    det.querySelectorAll("[data-v]").forEach(function (chk) {
      chk.addEventListener("change", function () {
        var id = chk.getAttribute("data-v");
        var i = p.vuln.indexOf(id);
        if (chk.checked && i < 0) p.vuln.push(id);
        if (!chk.checked && i >= 0) p.vuln.splice(i, 1);
        p.sucio = true;
        pintarDetalle();
      });
    });

    /* Catálogo: marcar agrega la condición; desmarcar solo retira lo no guardado */
    var catGr = det.querySelector("#catGrupos");
    if (catGr) {
      catGr.addEventListener("change", function (e) {
        var chk = e.target.closest("[data-c]");
        if (!chk) return;
        var cod = chk.getAttribute("data-c");
        var ya = p.cond.filter(function (c) { return c.cod === cod; })[0];
        if (chk.checked && !ya) {
          p.cond.push({ cod:cod, t:chk.getAttribute("data-t"), grupo:chk.getAttribute("data-g"),
                        est:"Activa", fecha:hoy(), por:"Salud · M. Gómez", nuevo:true });
        } else if (!chk.checked && ya) {
          if (!ya.nuevo) { chk.checked = true; return; }   /* lo guardado no se retira */
          p.cond.splice(p.cond.indexOf(ya), 1);
        }
        p.sucio = true;
        pintarDetalle();
      });
    }

    var bc = det.querySelector("#buscaCat");
    if (bc) bc.addEventListener("input", function () { pintarCatalogo(bc.value); });

    /* Condición fuera del catálogo */
    function agregarOtra() {
      var inp = det.querySelector("#otraCond");
      if (!inp) return;
      var v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      p.cond.push({ cod:"—", t:v, grupo:"Otra · pendiente de codificar", est:"Activa",
                    fecha:hoy(), por:"Salud · M. Gómez", nuevo:true });
      p.sucio = true;
      pintarDetalle();
    }
    var bOtra = det.querySelector("#btnOtra");
    if (bOtra) bOtra.addEventListener("click", agregarOtra);
    var inpOtra = det.querySelector("#otraCond");
    if (inpOtra) {
      inpOtra.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); agregarOtra(); }
      });
    }

    /* Estado y retiro de condiciones */
    det.querySelectorAll("[data-est]").forEach(function (s) {
      s.addEventListener("change", function () {
        p.cond[+s.getAttribute("data-est")].est = s.value;
        p.sucio = true;
        pintarDetalle();
      });
    });
    det.querySelectorAll("[data-quita]").forEach(function (b) {
      b.addEventListener("click", function () {
        p.cond.splice(+b.getAttribute("data-quita"), 1);
        p.sucio = true;
        pintarDetalle();
      });
    });

    /* Guardar / descartar */
    var bG = det.querySelector("#btnGuardar");
    if (bG) {
      bG.addEventListener("click", function () {
        p.cond.forEach(function (c) { delete c.nuevo; });
        p.sucio = false;
        p.ultima = hoy();
        if (p.resp === "Sin asignar") p.resp = "María Gómez Pérez";
        if (p.urg === "pend" || p.urg === "inm") p.urg = p.can.length ? "seg" : "pend";
        pintarLista(); pintarChips(); pintarDetalle();
        avisar("jade", "check", "Valoración guardada",
          "Se asentó en la bitácora del expediente " + p.f + " con su autor, área y fecha (RF08).");
      });
    }
    var bD = det.querySelector("#btnDescartar");
    if (bD) {
      bD.addEventListener("click", function () {
        p.cond = p.cond.filter(function (c) { return !c.nuevo; });
        p.sucio = false;
        pintarDetalle();
      });
    }

    /* Precargar la canalización desde una ruta obligada */
    det.querySelectorAll("[data-pre]").forEach(function (b) {
      b.addEventListener("click", function () {
        var v = VULN_IDX[b.getAttribute("data-pre")];
        if (!v || !v.canaliza) return;
        var ci = det.querySelector("#cInst"); if (ci) ci.value = v.canaliza.inst;
        var cm = det.querySelector("#cMotivo"); if (cm) cm.value = v.canaliza.motivo;
        pintarOficio();
        var cc = det.querySelector("#cCita");
        if (cc) { cc.focus(); cc.scrollIntoView({ behavior:"smooth", block:"center" }); }
      });
    });

    /* Vista previa en vivo */
    ["#cInst", "#cMotivo", "#cCita", "#cAcomp"].forEach(function (s) {
      var el = det.querySelector(s);
      if (el) {
        el.addEventListener("input", pintarOficio);
        el.addEventListener("change", pintarOficio);
      }
    });

    /* Generación del oficio */
    var bOf = det.querySelector("#btnOficio");
    if (bOf) {
      bOf.addEventListener("click", function () {
        var mot = det.querySelector("#cMotivo");
        if (!mot || !mot.value.trim()) {
          var err = det.querySelector("#cErr");
          if (err) err.style.display = "block";
          if (mot) { mot.closest(".campo").classList.add("error"); mot.focus(); }
          return;
        }
        var citaEl = det.querySelector("#cCita");
        var cita = citaEl ? citaEl.value : "";
        var folio = nuevoFolio();
        var instEl = det.querySelector("#cInst");
        p.can.push({ fecha:hoy(), inst:instEl ? instEl.value : "", motivo:mot.value.trim(),
                     of:folio, cita:cita ? cita.split("-").reverse().join("/") : "",
                     est:"Borrador · pendiente de firma" });
        if (p.urg !== "seg" && p.urg !== "fin") p.urg = "seg";
        p.ultima = hoy();
        pintarLista(); pintarChips(); pintarDetalle();
        avisar("jade", "oficios", "Oficio " + folio + " generado en borrador",
          "Queda pendiente de la firma del Director de Área. Se adjuntó al expediente " + p.f +
          " y se registró en la bitácora.");
      });
    }
  }

  /* Aviso efímero y Toast flotante */
  function avisar(tono, icono, titulo, texto) {
    var d = document.createElement("div");
    d.className = "aviso aviso-" + tono;
    d.innerHTML = ico(icono) + "<span><strong>" + esc(titulo) + "</strong>" + esc(texto) + "</span>";
    var det = document.getElementById("detalle");
    det.insertBefore(d, det.firstChild);
    if (SIMH.toast) SIMH.toast(titulo, tono === "jade" ? "ok" : "alerta");
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  /* --------------------------------------------------- Arranque -------- */
  /* Atajo de revisión: salud.html?exp=0412 abre ese expediente. */
  var q = new URLSearchParams(location.search).get("exp");
  if (q) {
    P.forEach(function (p, i) { if (p.f.indexOf(q) >= 0) sel = i; });
  }

  var gestor = SIMH.gestorCaso({
    items: P,
    indiceInicial: sel,
    titulo: "Seleccionar Persona para Valoración",
    placeholder: "Buscar por nombre, folio o CURP...",
    filtraItem: function(p, txt) {
      if (!txt) return true;
      var t = (p.n + " " + p.f + " " + p.curp + " " + p.pais + " " + p.mun).toLowerCase();
      return t.indexOf(txt.toLowerCase()) >= 0;
    },
    renderItem: function(p, esActivo, idx) {
      return '<button type="button" class="drawer-item' + (esActivo ? ' activo' : '') + '" data-idx="' + idx + '">' +
        '<div class="drawer-item-avatar">' + esc(p.n.charAt(0)) + '</div>' +
        '<div class="drawer-item-txt">' +
          '<span class="drawer-item-nom">' + esc(p.n) + '</span>' +
          '<span class="drawer-item-sub">Folio ' + esc(p.f) + ' · ' + p.ed + ' años · ' + esc(p.pais) + '</span>' +
        '</div>' +
        chipUrg(p) +
      '</button>';
    },
    onSelect: function(p, idx) {
      sel = idx;
      pintarDetalle();
      window.scrollTo({ top:0, behavior:"smooth" });
    }
  });

  pintarDetalle();

  /* Eventos de navegación y apertura del selector */
  document.addEventListener("click", function(e) {
    if (e.target.closest("#btnAbrirSelector") || e.target.closest("#btnBuscar")) {
      gestor.abrir();
    } else if (e.target.closest("#btnCasoAnt")) {
      gestor.anterior();
    } else if (e.target.closest("#btnCasoSig")) {
      gestor.siguiente();
    }
  });
})();
</script>
</body>
</html>
