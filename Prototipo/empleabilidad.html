<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empleabilidad · Vinculación laboral y seguimiento · SIAMH</title>
<link rel="icon" href="assets/img/simh-isotipo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/simh.css">
<style>
  /* ====================================================================
     Empleabilidad · RF12
     Aquí solo vive lo específico de esta pantalla. Todo lo demás son
     componentes de assets/css/simh.css: .tarjeta, .exp-cab, .ruta,
     .hero, .chip, .aviso, .tabla, .campo, .modulo, .resumen-dato.
     ================================================================== */
  .g-maestro{display:grid;grid-template-columns:308px minmax(0,1fr);gap:16px;align-items:start}
  .g-maestro > *{min-width:0}
  @media (max-width:1180px){ .g-maestro{grid-template-columns:1fr} }
  @media (max-width:1080px){ .rejilla.g-hero,.rejilla.g-2{grid-template-columns:1fr} }

  /* ---------- Cartera: ordenada por vencimiento, no por fecha de alta -- */
  .pers-item{display:block;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--linea-suave);padding:11px 12px;cursor:pointer;
    font-family:var(--f-texto);position:relative}
  .pers-item:hover{background:var(--hueso-claro)}
  .pers-item.activo{background:var(--jade-050)}
  .pers-item.activo::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    background:var(--jade);border-radius:0 3px 3px 0}
  .pers-item .p-nom{display:block;font-size:13.5px;font-weight:700;color:var(--tinta);line-height:1.3;margin:6px 0 2px}
  .pers-item .p-folio{display:block;font-size:11.5px;color:var(--gris-claro);font-variant-numeric:tabular-nums}
  .pers-item .p-donde{display:block;font-size:11.5px;color:var(--gris);line-height:1.4;margin-top:4px}
  .pers-item .p-alerta{display:flex;gap:5px;align-items:flex-start;font-size:11.5px;color:var(--guinda-900);
    font-weight:700;margin-top:5px;line-height:1.35}
  .pers-item .p-alerta svg{width:13px;height:13px;stroke:var(--guinda);stroke-width:2;fill:none;flex:none;margin-top:1px}
  .pers-item .p-alerta.tibia{color:var(--alerta)}
  .pers-item .p-alerta.tibia svg{stroke:var(--alerta)}

  .chips-filtro{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chips-filtro .chip{cursor:pointer;border:0;font-family:var(--f-texto)}

  /* El marcador .seg-mini (dos puntos de color) se retiró: el estado viajaba
     solo en el color y sin nombre accesible. Lo sustituye .seg2, más abajo. */

  /* ---------- Hitos de verificación: cada uno es un registro ----------- */
  .ruta-hito.vencido{color:var(--critico);font-weight:700}
  .ruta-hito.vencido .r-bolita{background:var(--critico);border-color:var(--critico)}
  .ruta-hito.porvencer{color:var(--alerta);font-weight:700}
  .ruta-hito.porvencer .r-bolita{background:var(--blanco);border-color:var(--alerta);
    box-shadow:0 0 0 3px var(--rosa-050)}
  .ruta-hito.nula .r-bolita{border-style:dashed}

  .hito{display:flex;gap:13px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--linea-suave)}
  .hito:last-child{border-bottom:0;padding-bottom:0}
  .hito .h-tx{flex:1;min-width:0}
  .hito .h-t{display:block;font-size:13.5px;font-weight:700;color:var(--tinta);line-height:1.3}
  .hito .h-n{display:block;font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.45}
  .hito .h-n.mal{color:var(--guinda-900);font-weight:700}
  .hito .h-n.pv{color:var(--alerta);font-weight:700}
  .hito .h-acc{flex:none}
  .hito .h-reg{display:block;font-size:12px;color:var(--gris);margin-top:6px;line-height:1.55;
    border-left:2px solid var(--linea);padding-left:9px}
  .hito .h-reg b{color:var(--tinta);font-weight:700}
  .hito .h-reg.fallido{border-left-color:var(--arena)}

  /* ---------- Requisitos para formalizar la contratación --------------- */
  .reqc{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--linea-suave)}
  .reqc:first-child{padding-top:0}
  .reqc:last-child{border-bottom:0;padding-bottom:0}
  .reqc > svg{width:17px;height:17px;stroke-width:2;fill:none;flex:none;margin-top:2px;stroke:var(--gris-claro)}
  .reqc.si > svg{stroke:var(--jade-900)}
  .reqc.no > svg{stroke:var(--critico)}
  .reqc.pv > svg{stroke:var(--alerta)}
  .reqc .rq-tx{flex:1;min-width:0}
  .reqc .rq-t{display:block;font-size:13.5px;font-weight:700;color:var(--tinta);line-height:1.3}
  .reqc .rq-n{display:block;font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.45}
  .reqc.no .rq-n{color:var(--guinda-900);font-weight:700}
  .reqc.pv .rq-n{color:var(--alerta);font-weight:700}
  .reqc .rq-et{display:inline-block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    font-weight:700;color:var(--gris-claro);border:1px solid var(--linea);border-radius:3px;
    padding:1px 5px;margin-left:7px;vertical-align:2px}

  /* ---------- Historial laboral ---------------------------------------- */
  /* table-layout:fixed y anchos declarados: es la única forma de que seis
     columnas no desborden y corten la de acciones, que es el defecto que
     ya apareció en el listado de expedientes y en capacitacion.html.      */
  table.tabla.t-hist{table-layout:fixed}
  table.tabla.t-hist tbody td{vertical-align:top;word-break:break-word}
  table.tabla.t-hist thead th{white-space:normal}
  .t-hist td,.t-hist th{padding-left:12px;padding-right:12px}
  .t-hist col.c-vac{width:27%}
  .t-hist col.c-eta{width:13%}
  .t-hist col.c-res{width:19%}
  .t-hist col.c-seg{width:15%}
  .t-hist col.c-rsp{width:13%}
  .t-hist col.c-acc{width:13%}
  /* .btn trae white-space:nowrap: en una celda estrecha eso vuelve a
     desbordar la tabla. Aquí el enlace de acción sí puede partirse. */
  .t-hist .btn-texto{white-space:normal;text-align:right;line-height:1.35;display:inline}
  .t-hist .v-vac{display:block;font-weight:700;font-size:13px;line-height:1.25}
  .t-hist .v-emp{display:block;font-size:11.5px;color:var(--gris);margin-top:2px;line-height:1.35}
  .t-hist .v-fec{display:block;font-size:11px;color:var(--gris-claro);margin-top:4px;
    font-variant-numeric:tabular-nums;line-height:1.4}
  .t-hist .v-res{display:block;font-size:12.5px;line-height:1.35}
  .t-hist .v-mot{display:block;font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.4}
  .t-hist .v-mot.mal{color:var(--guinda-900)}
  .t-hist tr.cerrada td{background:var(--hueso-claro)}
  .t-hist tr.cerrada .v-vac{color:var(--gris)}
  .t-hist .v-na{color:var(--gris-claro)}
  .t-hist .v-resp{font-size:12px;color:var(--gris);line-height:1.4}

  .filtros-tabla{display:flex;gap:6px;flex-wrap:wrap}
  .filtros-tabla .chip{cursor:pointer;border:0;font-family:var(--f-texto)}

  /* ---------- Paneles de captura --------------------------------------- */
  .panel{border:1px solid var(--jade);border-radius:var(--radio);background:var(--jade-020);
    padding:15px 16px;margin-top:16px}
  .panel > h3{margin:0 0 3px;font-family:var(--f-texto);font-size:14.5px;font-weight:700;
    color:var(--tinta);text-transform:none;letter-spacing:0}
  .panel > .p-int{font-size:12.5px;color:var(--gris);margin:0 0 13px;line-height:1.5}
  .panel.grave{border-color:var(--guinda);background:var(--guinda-050)}
  .panel.grave > h3{color:var(--guinda-900)}
  .panel .campo{margin-bottom:12px}

  /* La consecuencia se declara antes de confirmar, nunca después. */
  .conse{border-left:3px solid var(--jade);background:var(--blanco);padding:10px 12px;
    border-radius:0 var(--radio-s) var(--radio-s) 0;font-size:12.5px;color:var(--gris);
    margin:2px 0 13px;line-height:1.55}
  .conse.rompe{border-left-color:var(--guinda);color:var(--guinda-900)}
  .conse.tibia{border-left-color:var(--alerta);color:#7d0140}
  .conse b{color:var(--tinta);font-weight:700}
  .conse.rompe b{color:var(--guinda-900)}
  .conse svg{width:14px;height:14px;stroke-width:2;fill:none;vertical-align:-2px;margin-right:4px;stroke:var(--jade)}
  .conse.rompe svg{stroke:var(--guinda)}
  .conse.tibia svg{stroke:var(--alerta)}

  .opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-bottom:13px}
  /* Nombre de clase: NO usar .opc — el sistema ya la ocupa para el "(opcional)"
     de las etiquetas de campo, y ahí esta caja rompía la etiqueta en dos. */
  .opcion{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--linea);border-radius:var(--radio-s);
    background:var(--blanco);padding:10px 11px;cursor:pointer;font-family:var(--f-texto)}
  .opcion:hover{border-color:var(--arena)}
  .opcion input{width:17px;height:17px;accent-color:var(--jade);margin-top:1px;flex:none}
  .opcion.sel{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade-050)}
  .opcion.sel.grave{border-color:var(--guinda);box-shadow:0 0 0 2px var(--guinda-050)}
  .opcion .o-t{display:block;font-size:13px;font-weight:700;line-height:1.3;color:var(--tinta)}
  .opcion .o-n{display:block;font-size:11.5px;color:var(--gris);margin-top:2px;line-height:1.4}

  /* ---------- Aislamiento entre direcciones (RNF01) -------------------- */
  .mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}

  /* La cifra héroe no debe estirarse a la altura de la tarjeta vecina:
     centrada dentro de una caja alta deja un hueco que no dice nada.      */
  .rejilla.g-hero > .hero{align-self:start}
  /* Cuando no hay cifra se escribe "—", nunca un cero que mentiría. A 48 px
     un guion largo se lee como una barra negra, así que se compone tenue.  */
  .hero .h-num.sin{font-size:32px;color:var(--gris-claro);font-weight:400}

  .sec-tit{font-family:var(--f-texto);font-size:14.5px;font-weight:700;color:var(--tinta);
    text-transform:none;letter-spacing:0;margin:0}
  .vacio{padding:36px 20px;text-align:center;color:var(--gris-claro);font-size:13px;line-height:1.6}
  .vacio svg{width:34px;height:34px;stroke-width:1.2;stroke:var(--arena);fill:none;display:block;margin:0 auto 10px}
  .nac{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--gris);
    border:1px solid var(--linea);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}

  /* ======================================================================
     REVISIÓN DE ACCESIBILIDAD Y CARGA COGNITIVA (v3)
     --------------------------------------------------------------------
     La versión anterior era correcta de fondo y difícil de usar: mostraba
     los siete bloques de la persona a la vez (≈2 000 px de alto), repetía
     el mismo vencimiento en tres lugares y cifraba el estado de los hitos
     en dos puntos de color sin texto. Lo que sigue corrige eso sin tocar
     el sistema de diseño global: son reglas locales de esta pantalla.
     ================================================================== */

  /* --- 1. Piso de legibilidad ------------------------------------------
     El prompt de identidad exige contraste AA y no depender del color.
     Aquí nada baja de 12.5 px y el texto secundario usa --gris (#5F5F5F,
     7.1:1 sobre blanco) en vez de --gris-claro (#8C8C8C, 3.1:1), que no
     alcanza AA para texto pequeño. --gris-claro queda solo para texto
     desactivado y para el guion de "no aplica".                          */
  .pers-item .p-folio{font-size:12.5px;color:var(--gris)}
  .pers-item .p-donde,
  .pers-item .p-alerta{font-size:12.5px}
  .hito .h-n,.reqc .rq-n,.t-hist .v-emp,.t-hist .v-mot{font-size:12.5px}
  .t-hist .v-fec{font-size:12px;color:var(--gris)}
  .tarjeta-pie,.tabla-pie{font-size:12.5px;color:var(--gris)}
  .vacio{color:var(--gris);font-size:13px}

  /* --- 2. Área táctil de 44 px ------------------------------------------
     Requisito explícito del manual. Se aplica a los controles que se usan
     con el dedo o con prisa en ventanilla; los chips de filtro llegan a 36
     px y se separan 8 px, que es el mínimo con el que no se pulsan dos.   */
  .g-maestro .btn,#detalle .btn,#detalle .btn-s{min-height:44px}
  .t-hist .btn-texto{min-height:44px;padding:0 4px}
  .chips-filtro .chip,.filtros-tabla .chip{min-height:36px;padding:0 10px;font-size:12.5px;gap:6px}
  .chips-filtro{gap:8px}
  .filtros-tabla{gap:8px}
  .pestana{min-height:44px}

  /* --- 3. Foco visible --------------------------------------------------
     El detalle se repinta entero con innerHTML: sin un anillo de foco
     evidente el teclado se pierde. Un solo anillo para toda la pantalla.  */
  #detalle :focus-visible,.g-maestro :focus-visible,.pestana:focus-visible{
    outline:3px solid var(--jade);outline-offset:2px;border-radius:4px}
  #detalle h2[tabindex]:focus{outline:3px solid var(--jade);outline-offset:4px}

  /* --- 4. Estado de los hitos con forma y texto, no solo color ----------
     Antes: dos <i> de color, sin nombre accesible, con la leyenda "15 d ·
     30 d de seguimiento", que nombra los hitos pero no dice cómo están.
     Ahora cada hito es una pastilla con glifo + palabra + color, así que
     se lee igual en escala de grises y la lee un lector de pantalla.     */
  .seg2{display:flex;flex-wrap:wrap;gap:6px}
  .pers-item .seg2{margin-bottom:7px}
  .seg2 .s2{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    line-height:1.2;padding:3px 8px;border-radius:999px;border:1px solid var(--linea);
    background:var(--hueso-claro);color:var(--gris);white-space:nowrap}
  .seg2 .s2 .g{font-size:12px;line-height:1}
  .seg2 .s2.ok{background:var(--jade-050);border-color:rgba(0,152,135,.3);color:var(--jade-900)}
  .seg2 .s2.mal{background:var(--guinda-050);border-color:rgba(174,25,45,.3);color:var(--guinda-900)}
  .seg2 .s2.pv{background:var(--rosa-050);border-color:rgba(201,1,102,.3);color:#7d0140}
  .seg2 .s2.na{border-style:dashed;color:var(--gris)}

  /* --- 5. Pestañas del detalle -----------------------------------------
     Divulgación progresiva: seguimiento, historial y expediente laboral
     dejan de competir en una sola columna. Es el mismo componente de
     expediente-detalle.html, no uno nuevo.                                */
  .pest-det{margin:16px 0 16px}
  .pest-det .pestana{font-size:13.5px}
  .pest-det .pestana .cta{display:inline-flex;align-items:center;justify-content:center;
    min-width:19px;height:19px;padding:0 5px;margin-left:7px;border-radius:999px;
    font-size:11px;font-weight:700;background:var(--arena-050);color:var(--gris)}
  .pest-det .pestana.activa .cta{background:var(--jade-050);color:var(--jade-900)}
  .pest-det .pestana .cta.urge{background:var(--guinda-050);color:var(--guinda-900)}

  /* --- 6. Barra de acción única ----------------------------------------
     Un solo lugar dice qué hay que hacer con esta persona hoy. Antes el
     mismo vencimiento aparecía en el aviso rojo, en el pie de la cifra
     héroe y en la fila del hito, con dos botones idénticos. El componente
     `.accion` vive en simh.css §21: la regla vale para todas las pantallas.
     -------------------------------------------------------------------- */

  /* Marca de acompañamiento dentro de la ficha de requisitos, y la
     observación que la sostiene. La marca no viaja sola en el color: lleva
     glifo y palabra, como el resto de los estados del sistema. */
  .reqc .rq-ac{display:inline-flex;align-items:center;gap:4px;margin-left:8px;
    font-size:11px;font-weight:700;color:var(--rosa);text-transform:none;letter-spacing:0}
  .reqc .rq-ac svg{width:12px;height:12px;stroke:var(--rosa);stroke-width:2;fill:none}
  .reqc .rq-obs{display:block;font-size:12.5px;color:var(--gris);line-height:1.55;margin-top:6px;
    border-left:2px solid var(--rosa-050);padding-left:9px}
  .reqc .rq-obs b{color:var(--tinta)}

  /* --- 7. Historial: de seis columnas a cuatro -------------------------
     Con seis columnas el chip de etapa (que trae white-space:nowrap)
     desbordaba su 13% y se encimaba con la columna de resultado, y
     "Cerrar vinculación" se partía a mitad de palabra. Etapa y resultado
     cuentan lo mismo, así que van juntos; el responsable baja a la
     primera celda, que es donde ya viven las fechas.                      */
  .t-hist col.c-vac{width:38%}
  .t-hist col.c-eta{width:26%}
  .t-hist col.c-seg{width:20%}
  .t-hist col.c-acc{width:16%}
  .t-hist .btn-texto{white-space:normal;text-align:left;line-height:1.35;display:inline-block;
    word-break:normal;overflow-wrap:anywhere}
  .t-hist td .chip{white-space:normal;margin-bottom:5px}
  .t-hist .v-resp{display:block;font-size:12px;color:var(--gris);margin-top:4px;line-height:1.4}

  /* --- 8. La columna del maestro se queda pegada ------------------------
     Con el detalle en pestañas la página deja de medir 2 000 px, así que
     el hueco muerto bajo la cartera desaparece por sí solo.               */
  .g-maestro > .maestro{position:sticky;top:calc(var(--topbar-h) + 16px)}
  @media (max-width:1100px){
    .g-maestro{grid-template-columns:1fr}
    .g-maestro > .maestro{position:static}
  }
</style>
</head>
<body>

<main class="contenido">
  <div class="migas"><a href="index.html">Inicio</a> › Empleabilidad</div>

  <div class="enc">
    <div class="enc-txt">
      <h1>Empleabilidad</h1>
      <div class="enc-sub">Vinculación laboral y verificación a los 15 y 30 días de la colocación (RF12)</div>
    </div>
    <div class="enc-acc">
      <button class="btn btn-secundario btn-s" type="button" id="btnXls"></button>
      <button class="btn btn-secundario btn-s" type="button" id="btnPdf"></button>
    </div>
  </div>

  <!-- Las reglas del módulo (RNF01 y RNF02) son ciertas y permanentes, pero
       no se necesitan en cada visita: cuatro líneas de texto normativo fijas
       en la cabecera eran la primera cosa que leía quien abría la pantalla.
       Se pliegan, y el resumen deja a la vista lo único operativo.          -->
  <details class="plegable" id="avisoPermisos">
    <summary>Qué hace este módulo y qué no</summary>
    <div class="cuerpo" id="avisoPermisosCuerpo"></div>
  </details>

  <!-- ========================== Detalle a Pantalla Completa ============================= -->
  <div id="detalle" style="max-width:100%"></div>

  <!-- El repintado por innerHTML no avisa de nada a un lector de pantalla:
       este renglón anuncia a quién se seleccionó y qué está pendiente.     -->
  <p id="anuncio" class="sr-solo" role="status" aria-live="polite"></p>
</main>

<script src="assets/js/simh.js"></script>
<script>
(function () {
  "use strict";
  SIMH.chrome("empleo");
  var ico = SIMH.icono, esc = SIMH.esc;
  var $  = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  var HOY = "2026-08-27";

  $("#btnXls").innerHTML = ico("excel") + "Exportar cartera de seguimiento";
  $("#btnPdf").innerHTML = ico("pdf") + "Reporte de vinculación laboral";

  $("#avisoPermisosCuerpo").innerHTML =
    '<div class="resumen-lista">' +
    '<div class="resumen-dato"><span class="r-lab">Esta ventanilla sí puede</span>' +
      '<span class="r-val">Registrar vinculaciones, agendar entrevistas, capturar el resultado, ' +
      'el inicio de labores y las verificaciones de 15 y 30 días.</span></div>' +
    '<div class="resumen-dato"><span class="r-lab">Esta ventanilla no puede</span>' +
      '<span class="r-val">Emitir la constancia de colocación ni cerrar formalmente el seguimiento: ' +
      'los emite el Enlace de Vinculación Laboral (RNF02). Tampoco eliminar una vinculación (RNF03).</span></div>' +
    '<div class="resumen-dato"><span class="r-lab">Aislamiento entre direcciones</span>' +
      '<span class="r-val">Desde Empleabilidad no se consulta Salud ni Vulnerabilidad, y ninguna ' +
      'condición de salud puede usarse como criterio para vincular o descartar a una persona (RNF01).</span></div>' +
    "</div>";

  /* ======================================================================
     1. Lo que RF12 pide de verdad
     --------------------------------------------------------------------
     El guion original resolvía esta pantalla como una tabla de la persona
     más un panel lateral con dos chips ("15 días" / "30 días"). Eso falla
     en tres puntos que sí importan en operación:

       · El módulo no se abre desde una persona: se abre desde el menú. Lo
         que llega solo son los VENCIMIENTOS, no las personas. Por eso es

  function fecha(iso) { if (!iso) return "—"; var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
  function dias(desde, hasta) { return Math.round((new Date(hasta) - new Date(desde)) / 86400000); }
  function suma(iso, n) { var d = new Date(iso); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function hace(n) { return n === 1 ? "hace 1 día" : "hace " + n + " días"; }
  function dentro(n) { return n === 0 ? "hoy" : (n === 1 ? "mañana" : "en " + n + " días"); }

  /* La colocación vigente: contratada, ya inició labores y no ha concluido. */
  function vigente(p) {
    return p.v.filter(function (v) { return v.con === 1 && v.inicio && !v.fin; })[0] || null;
  }
  /* Contratada pero sin fecha de inicio: el reloj de 15/30 no puede arrancar. */
  function sinInicio(p) {
    return p.v.filter(function (v) { return v.con === 1 && !v.inicio && !v.fin; })[0] || null;
  }
  /* Vinculaciones abiertas que aún no se resuelven. */
  function enProceso(p) {
    return p.v.filter(function (v) { return v.con === null && !v.fin; });
  }
  /* Entrevista ya ocurrida sin resultado capturado. */

    })[0] || null;

    if (v.fin)               id = "concluida";
    else if (v.con === 0)    id = "nocontratada";
    else if (v.con === 1)    id = v.inicio ? "colocada" : "contratada";

  /* --------------------------------------------------------------------
     Estado de un hito de verificación. Estados posibles:
       hecho      · quedó registrada la verificación con su resultado
       vencido    · pasó la fecha programada y no hay registro
       porvencer  · vence hoy o dentro de los próximos 3 días
       programado · aún falta
       nula       · el hito no aplica (sin fecha de inicio, o la persona
                    causó baja antes de llegar a él). Se dibuja como "—",
                    nunca como un cero ni como un incumplimiento.
     Cada intento sin contacto reprograma la verificación 3 días; al tercer
     intento el caso se turna al Enlace de Vinculación.
     ------------------------------------------------------------------ */
  function hito(v, d) {
    var regs = v.seg[String(d)] || [];
    var fallidos = regs.filter(function (r) { return r.res === "sincontacto"; });
    var cerrado  = regs.filter(function (r) { return r.res !== "sincontacto"; });

    if (!v.inicio || v.con !== 1) {
      return { d:d, est:"nula", regs:regs, motivo:"La verificación arranca en la fecha de inicio de labores." };
    }
    var prog = suma(v.inicio, d);
    if (v.fin && dias(v.inicio, v.fin) < d) {
      return { d:d, est:"nula", prog:prog, regs:regs,
               motivo:"La vinculación concluyó el " + fecha(v.fin) + ", antes de cumplir " + d + " días." };
    }
    if (cerrado.length) {
      return { d:d, est:"hecho", prog:prog, regs:regs, reg:cerrado[cerrado.length - 1], fallidos:fallidos };
    }
    var venc = suma(prog, fallidos.length * REPROG);
    var dd = dias(HOY, venc);
    return { d:d, prog:prog, venc:venc, dd:dd, regs:regs, fallidos:fallidos,
             est: dd < 0 ? "vencido" : (dd <= 3 ? "porvencer" : "programado") };
  }

  function hitos(v) { return HITOS.map(function (d) { return hito(v, d); }); }

  function pendiente(p) {
    var vg = vigente(p), i, h;
    if (vg) {
      var hs = hitos(vg);
      for (i = 0; i < hs.length; i++) {
        h = hs[i];
        if (h.est === "vencido") {

        }
      }
      for (i = 0; i < hs.length; i++) {
        h = hs[i];
        if (h.est === "porvencer") {
          return { peso:2, tibia:true, txt:"La verificación de " + h.d + " días vence " + dentro(h.dd) };
        }
      }

    var ev = entrevistaSinResultado(p);
    if (ev) {
      return { peso:3, tibia:true,

    }
    if (!vg && !enProceso(p).length) {

      return { peso:5, txt:"Sin colocación vigente ni postulación en proceso desde el " +
               fecha(ult.fin || ult.ent || ult.post) };
    }
    return null;
  }

           (dv <= 60 ? ". Vence " + dentro(dv) + ": debe renovarse antes de que concluya el seguimiento." : ".") });
    }

    [["RFC", p.rfc, "rfc"], ["NSS", p.nss, "nss"]].forEach(function (par) {
      var c = par[1];
      r.push({ t:par[0], et:"Opcional al inicio", ac:acompDe(p, par[2]),
        est: c.est === "reg" ? "si" : "na",
        n: c.est === "reg" ? c.d
         : c.est === "tram" ? c.d
         : "Pendiente. Lo tramita el sector patronal una vez formalizada la contratación." });
    });

    /* El acompañamiento del documento migratorio cuelga de su propio
       requisito, no de una nota suelta al pie de la ficha. */
    var ae = acompDe(p, "estancia");
    if (ae) r.forEach(function (x) {
      if (x.t === "Documento que autoriza trabajar") x.ac = ae;
    });
    return r;
