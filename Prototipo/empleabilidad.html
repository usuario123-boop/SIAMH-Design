    if (!busca) return true;
    var t = busca.toLowerCase();
    if ((p.n + " " + p.e + " " + p.perfil).toLowerCase().indexOf(t) >= 0) return true;
    return p.v.some(function (v) { return (v.emp + " " + v.vac).toLowerCase().indexOf(t) >= 0; });
  }

  function pintaChips() {
    $("#chipsFiltro").innerHTML = FILTROS.map(function (f) {
      var n = PERSONAS.filter(function (p) { return pasa(p, f.id); }).length;
      return '<button type="button" class="chip ' + (f.id === filtro ? "chip-jade" : "chip-neutro") +
        '" data-f="' + f.id + '" aria-pressed="' + (f.id === filtro) + '">' +
        esc(f.t) + " " + n + "</button>";
    }).join("");
  }

  /* --------------------------------------------------------------------
     Marcador de los dos hitos. La versión anterior dibujaba dos puntos de
     color con la leyenda "15 d · 30 d de seguimiento": nombraba los hitos
     pero no su estado, así que el estado viajaba SOLO en el color y sin
     nombre accesible. Ahora cada hito es una pastilla con glifo, palabra y
     color — tres canales — y se entiende impresa en blanco y negro.      */
  var EST_HITO = {
    hecho:      { c:"ok",  g:"✓", t:"cumplida"   },
    vencido:    { c:"mal", g:"!", t:"vencida"    },
    porvencer:  { c:"pv",  g:"•", t:"por vencer" },
    programado: { c:"",    g:"·", t:"programada" },
    nula:       { c:"na",  g:"–", t:"no aplica"  }
  };

  function segHitos(v) {
    var hs = hitos(v);
    return '<span class="seg2">' + hs.map(function (h) {
      var e = EST_HITO[h.est];
      return '<span class="s2 ' + e.c + '"><span class="g" aria-hidden="true">' + e.g + "</span>" +
        h.d + " d: " + e.t + "</span>";
    }).join("") + "</span>";
  }

  function segMini(p) {
    var vg = vigente(p);
    return vg ? segHitos(vg) : "";
  }

  function pintaLista() {
    var vis = PERSONAS.filter(function (p) { return pasa(p, filtro) && pasaBusca(p); })
      .sort(function (a, b) {
        var pa = pendiente(a), pb = pendiente(b);
        var wa = pa ? pa.peso : 99, wb = pb ? pb.peso : 99;
        return wa !== wb ? wa - wb : a.n.localeCompare(b.n, "es");
      });

    $("#listaPers").innerHTML = vis.length ? vis.map(function (p) {
      var pe = pendiente(p), vg = vigente(p) || sinInicio(p);
      var donde = vg ? vg.vac + " · " + vg.emp
        : (enProceso(p).length ? "Postulada en " + enProceso(p)[0].emp : "Sin vinculación abierta");
      /* role="option" y no aria-pressed: es una lista de selección única,
         no cinco interruptores independientes. Un lector de pantalla
         anuncia "seleccionado 1 de 8" en vez de "no presionado".         */
      return '<button type="button" class="pers-item' + (p.e === sel ? " activo" : "") +
        '" data-p="' + p.e + '" role="option" aria-selected="' + (p.e === sel) + '">' +
        segMini(p) +
        '<span class="p-nom">' + esc(p.n) + '<span class="nac">' + p.nac + "</span></span>" +
        '<span class="p-folio">Expediente ' + p.e + "</span>" +
        '<span class="p-donde">' + esc(donde) + "</span>" +
        (pe ? '<span class="p-alerta' + (pe.tibia ? " tibia" : "") + '">' + ico("alerta") +
              "<span>" + esc(pe.txt) + "</span></span>" : "") +
        "</button>";
    }).join("") : '<div class="vacio">' + ico("buscar") + "Ningún resultado con este filtro.</div>";

    $("#conteoPers").textContent = plural(vis.length, "persona", "personas") + " de " + PERSONAS.length;
  }

  /* ======================================================================
     6. Detalle
     ================================================================== */
  function inic(n) {
    return n.split(" ").slice(0, 2).map(function (w) { return w.charAt(0); }).join("");
  }

  var ACOMP_TXT = { rfc:"RFC", nss:"NSS", curp:"CURP",
                    estancia:"documento migratorio" };

  function cabecera(p) {
    var vg = vigente(p), si = sinInicio(p), ep = enProceso(p);
    var chips = [];
    if (vg) chips.push('<span class="chip chip-jade">' + ico("check") + "Colocación vigente</span>");
    else if (si) chips.push('<span class="chip chip-jade">' + ico("check") + "Contratación registrada</span>");
    else if (ep.length) chips.push('<span class="chip chip-neutro">' + plural(ep.length, "vinculación en proceso", "vinculaciones en proceso") + "</span>");
    else chips.push('<span class="chip chip-neutro">Sin colocación vigente</span>');
    chips.push('<span class="chip chip-neutro">' + esc(PAIS[p.nac] || p.nac) + "</span>");
    chips.push('<span class="chip chip-neutro">' + p.edad + " años</span>");
    /* La marca de aviso que pidió la Dirección: si la Secretaría está
       acompañando un trámite del que depende la colocación, tiene que verse
       desde la cabecera, no dentro de la tercera pestaña. Si no se ve, en la
       ventanilla se vuelve a pedir el papel que ya se está gestionando. */
    acompAbiertos(p).forEach(function (a) {
      chips.push('<span class="chip chip-rosa">' + ico("info") + "Acompañamiento · " +
        esc(ACOMP_TXT[a.que] || a.que) + "</span>");
    });

    var idxActual = PERSONAS.indexOf(p);

    return '<div class="banner-caso-activo">' +
      '<div class="bca-superior">' +
        '<div class="bca-persona">' +
          '<div class="bca-foto" style="font-size:16px;font-weight:700">' + esc(inic(p.n)) + '</div>' +
          '<div class="bca-datos">' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
              '<span class="bca-nombre" id="tPersona" tabindex="-1">' + esc(p.n) + '</span>' +
              '<span class="folio-tag">Exp. ' + p.e + '</span>' +
              chips.join("") +
            '</div>' +
            '<div class="bca-meta">' +
              '<span>Perfil: <b>' + esc(p.perfil) + '</b></span>' +
              '<span>·</span>' +
              '<span>Municipio: <b>' + esc(p.mun) + '</b></span>' +
              '<span>·</span>' +
              '<span>Disponibilidad: <b>' + esc(p.disp) + '</b></span>' +
              '<span>·</span>' +
              '<span>Responsable: <b>' + esc(RESP) + '</b></span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-8">' +
          '<button class="btn btn-secundario btn-s" type="button" id="btnNueva">' + ico("mas") + 'Registrar vinculación</button>' +
          '<a class="btn btn-secundario btn-s" href="expediente-detalle.html">' + ico("expedientes") + 'Ver expediente</a>' +
        '</div>' +
      '</div>' +
      '<div class="bca-controles">' +
        '<div class="bca-nav">' +
          '<button type="button" class="bca-nav-btn" id="btnCasoAnt"' + (idxActual <= 0 ? ' disabled' : '') + '>' +
            ico("izq") + 'Anterior' +
          '</button>' +
          '<span class="bca-nav-pos">Persona ' + (idxActual + 1) + ' de ' + PERSONAS.length + ' en cartera</span>' +
          '<button type="button" class="bca-nav-btn" id="btnCasoSig"' + (idxActual >= PERSONAS.length - 1 ? ' disabled' : '') + '>' +
            'Siguiente ' + ico("der") +
          '</button>' +
        '</div>' +
        '<button type="button" class="btn-cambiar-caso" id="btnAbrirSelector">' +
          '<svg viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>' +
          'Cambiar persona / Buscar en cartera <kbd>Ctrl+K</kbd>' +
        '</button>' +
      '</div>' +
    '</div>';
  }

  /* --------------------------------------------------------------------
     Barra de acción: UN solo lugar que dice qué hacer con esta persona hoy.
     Antes el mismo vencimiento se enunciaba tres veces —aviso rojo, pie de
     la cifra héroe y fila del hito— con dos botones idénticos, y los
     pendientes que no eran vencimientos (peso 3, 4 y 5) no tenían aviso
     ninguno: había que descubrirlos leyendo la tabla. Ahora los cinco
     pesos de pendiente() producen la misma barra, con su botón, y cuando
     no hay nada pendiente lo dice en vez de callar.
     El texto responde a tres preguntas en este orden: qué pasa, por qué
     importa, qué botón resuelve.                                          */
  function accionBarra(p) {
    var pe = pendiente(p), vg = vigente(p);
    var tono = "", icono = "alerta", tit, nota, btn = "";

    if (!pe) {
      var hs = vg ? hitos(vg) : [];
      var prox = hs.filter(function (h) { return h.est === "programado"; })[0];
      return '<div class="accion ok">' + ico("check") +
        '<div class="a-tx"><span class="a-t">Sin pendientes de seguimiento hoy</span>' +
        '<span class="a-n">' +
        (prox ? "La siguiente verificación es la de " + prox.d + " días, el " + fecha(prox.venc) + "."
              : "El seguimiento de 15 y 30 días está concluido. El cierre formal y la constancia de " +
                "colocación los emite el Enlace de Vinculación Laboral.") +
        "</span></div></div>";
    }

    if (pe.peso === 1 || pe.peso === 2) {
      var h = hitos(vg).filter(function (x) {
        return x.est === "vencido" || x.est === "porvencer";
      })[0];
      tono = pe.peso === 1 ? "urge" : "tibia";
      tit  = pe.txt;
      nota = "Programada para el " + fecha(h.venc) + ". Confirma que la persona sigue laborando; " +
             "si ya no labora, la vinculación se cierra con motivo y vuelve a la cartera para revincular.";
      btn  = '<button class="btn ' + (pe.peso === 1 ? "btn-peligro" : "btn-primario") +
             ' btn-s" type="button" data-ver="' + h.d + '">' + ico("check") + "Registrar verificación</button>";

    } else if (pe.peso === 3) {
      tono = "tibia"; tit = pe.txt;
      nota = "Sin el resultado, la vinculación se queda detenida: no puede registrarse la contratación " +
             "ni el motivo por el que no se contrató.";
      btn  = '<button class="btn btn-primario btn-s" type="button" id="btnResultado">' +
             ico("editar") + "Registrar resultado</button>";

    } else if (pe.peso === 4) {
      var si = sinInicio(p);
      tono = "tibia"; tit = "Falta la fecha de inicio de labores";
      nota = "La contratación se registró el " + fecha(si.fcon) + " en " + si.emp +
             ", pero el reloj de 15 y 30 días arranca en la fecha de inicio: sin ella el " +
             "seguimiento no puede programarse.";
      btn  = '<button class="btn btn-primario btn-s" type="button" id="btnInicio">' +
             ico("reloj") + "Registrar inicio de labores</button>";

    } else {
      tono = ""; icono = "info"; tit = "Sin colocación vigente ni postulación en proceso";
      nota = pe.txt.replace("Sin colocación vigente ni postulación en proceso desde el ",
                            "La última vinculación se movió el ") + ". Requiere una nueva vinculación.";
      btn  = '<button class="btn btn-primario btn-s" type="button" id="btnNueva2">' +
             ico("mas") + "Registrar vinculación</button>";
    }

    /* Con el panel abierto, el botón que lo abrió deja de dibujarse: dos
       controles vivos para la misma acción, uno encima del otro, hacen
       dudar de cuál es el que guarda.                                    */
    return '<div class="accion ' + tono + '">' + ico(icono) +
      '<div class="a-tx"><span class="a-t">' + esc(tit) + "</span>" +
      '<span class="a-n">' + esc(nota) + "</span></div>" +
      (panel ? "" : '<div class="a-acc">' + btn + "</div>") + "</div>";
  }

  /* Una sola cifra héroe: los días que lleva la colocación en pie. Es la
     pregunta real del módulo, porque RF12 mide permanencia, no altas.    */
  function heroe(p) {
    var vg = vigente(p), si = sinInicio(p), ep = enProceso(p);
    var num, lab, sub;
    if (vg) {
      num = String(dias(vg.inicio, HOY));
      lab = "Días en el empleo actual";
      /* El estado del próximo hito ya lo dice la barra de acción y la fila
         del hito. Repetirlo aquí era la tercera vez en la misma pantalla,
         así que la cifra se queda solo con lo que nadie más cuenta.       */
      sub = "Inició el <b>" + fecha(vg.inicio) + "</b> en " + esc(vg.emp) + ".";
    } else if (si) {
      num = "—";
      lab = "Sin fecha de inicio de labores";
      sub = "Contratación registrada el <b>" + fecha(si.fcon) + "</b> en " + esc(si.emp) + ".";
    } else {
      num = "—";
      lab = "Sin colocación vigente";
      sub = ep.length
        ? plural(ep.length, "vinculación en proceso", "vinculaciones en proceso") + ". Sin seguimiento activo hasta que haya contratación."
        : "Sin postulación abierta. Requiere una nueva vinculación.";
    }
    return '<div class="hero">' +
      '<span class="h-lab">' + lab + "</span>" +
      '<div class="h-num' + (num === "—" ? " sin" : "") + '">' + num + "</div>" +
      '<div class="h-sub">' + sub + "</div></div>";
  }

  /* La línea de hitos usa el componente .ruta del sistema de diseño: es
     exactamente la misma idea que la ruta de atención del expediente.     */
  function rutaSeguimiento(vg) {
    if (!vg) return "";
    var hs = hitos(vg);
    var cls = { hecho:"hecho", vencido:"vencido", porvencer:"porvencer", programado:"", nula:"nula" };
    var nodos = [{ t:"Inicio de labores", f:fecha(vg.inicio), c:"hecho" }].concat(
      hs.map(function (h) {
        return { t:"Verificación " + h.d + " días",
                 f: h.est === "nula" ? "no aplica" : fecha(h.est === "hecho" ? h.reg.f : h.venc),
                 c: cls[h.est] };
      }));
    return '<div class="ruta">' + nodos.map(function (x) {
      return '<div class="ruta-hito ' + x.c + '"><span class="r-bolita"></span>' + esc(x.t) +
        '<span class="r-fecha">' + esc(x.f) + "</span></div>";
    }).join("") + "</div>";
  }

  var RES_TXT = {
    continua:    "Continúa laborando",
    nolabora:    "Ya no labora",
    sincontacto: "No se pudo contactar"
  };

  function bloqueHitos(p) {
    var vg = vigente(p), si = sinInicio(p);

    if (!vg) {
      return '<div class="tarjeta"><div class="tarjeta-enc"><h3>Seguimiento posterior a la colocación</h3></div>' +
        '<div class="vacio">' + ico("reloj") +
        (si ? "La contratación está registrada, pero el seguimiento de 15 y 30 días no puede programarse " +
              "sin la <b>fecha de inicio de labores</b>."
            : "El seguimiento de 15 y 30 días existe solo cuando hay una contratación con fecha de inicio de labores. " +
              "Una postulación no genera hitos.") +
        "</div></div>";
    }

    var hs = hitos(vg);
    var filas = hs.map(function (h) {
      var estChip, nota = "", acc = "", reg = "";

      if (h.est === "hecho") {
        estChip = '<span class="chip chip-jade">' + ico("check") + "Cumplida</span>";
        nota = '<span class="h-n">Programada para el ' + fecha(h.prog) + ".</span>";
        reg = '<span class="h-reg"><b>' + esc(RES_TXT[h.reg.res]) + "</b> · " + fecha(h.reg.f) +
          "<br>" + esc(h.reg.medio) + " · " + esc(h.reg.por) +
          (h.reg.nota ? "<br>" + esc(h.reg.nota) : "") + "</span>";
      } else if (h.est === "nula") {
        estChip = '<span class="chip chip-neutro">No aplica</span>';
        nota = '<span class="h-n">' + esc(h.motivo) + "</span>";
      } else {
        var etq = { vencido:["chip-guinda", "Vencida"], porvencer:["chip-rosa", "Por vencer"],
                    programado:["chip-neutro", "Programada"] }[h.est];
        estChip = '<span class="chip ' + etq[0] + '">' + etq[1] + "</span>";
        nota = '<span class="h-n' + (h.est === "vencido" ? " mal" : (h.est === "porvencer" ? " pv" : "")) + '">' +
          (h.est === "vencido" ? "Venció el " + fecha(h.venc) + ", " + hace(-h.dd) + "."
                               : "Vence el " + fecha(h.venc) + ", " + dentro(h.dd) + ".") +
          (h.fallidos.length ? " Reprogramada por " + plural(h.fallidos.length, "intento", "intentos") +
             " sin contacto." : "") + "</span>";
        acc = '<button class="btn ' + (h.est === "vencido" ? "btn-peligro" : "btn-secundario") +
          ' btn-s" type="button" data-ver="' + h.d + '">' + ico("check") + "Registrar</button>";
      }

      if (h.fallidos && h.fallidos.length) {
        reg += h.fallidos.map(function (r) {
          return '<span class="h-reg fallido">Intento sin contacto · ' + fecha(r.f) + " · " +
            esc(r.medio) + "</span>";
        }).join("");
      }

      return '<div class="hito"><div class="h-tx">' +
        '<span class="h-t">Verificación de ' + h.d + " días " + estChip + "</span>" +
        nota + reg + "</div>" +
        (acc ? '<div class="h-acc">' + acc + "</div>" : "") + "</div>";
    }).join("");

    var todos = hs.every(function (h) { return h.est === "hecho" || h.est === "nula"; });

    return '<div class="tarjeta">' +
      '<div class="tarjeta-enc"><h3>Seguimiento posterior a la colocación</h3>' +
        '<span class="txt-min">' + esc(vg.puesto || vg.vac) + " · " + esc(vg.emp) + "</span></div>" +
      rutaSeguimiento(vg) +
      '<div style="margin-top:14px">' + filas + "</div>" +
      '<div class="tarjeta-pie">' +
        (todos ? "Seguimiento concluido. El cierre formal lo emite el Enlace de Vinculación Laboral."
               : "Un intento sin contacto no cierra el hito: lo reprograma " + REPROG +
                 " días y al tercero se turna al Enlace de Vinculación.") +
      "</div></div>";
  }

  function bloqueRequisitos(p) {
    var ic = { si:"check", no:"alerta", pv:"reloj", na:"info" };
    return '<div class="tarjeta">' +
      '<div class="tarjeta-enc"><h3>Requisitos para formalizar la contratación</h3></div>' +
      requisitos(p).map(function (r) {
        return '<div class="reqc ' + r.est + '">' + ico(ic[r.est]) +
          '<span class="rq-tx"><span class="rq-t">' + esc(r.t) +
          '<span class="rq-et">' + esc(r.et) + "</span>" +
          (r.ac ? '<span class="rq-ac">' + ico("info") + "Acompañado</span>" : "") + "</span>" +
          '<span class="rq-n">' + esc(r.n) + "</span>" +
          (r.ac ? '<span class="rq-obs"><b>Acompañamiento desde el ' + fecha(r.ac.desde) + " · " +
                  esc(r.ac.quien) + ".</b> " + esc(r.ac.nota) + "</span>" : "") +
          "</span></div>";
      }).join("") +
      '<div class="tarjeta-pie">Ninguno impide postularse ni acudir a una entrevista: impiden <b>firmar</b>.' +
      "</div></div>";
  }

  function bloquePerfil(p) {
    var datos = [
      ["Escolaridad", p.esc],
      ["Experiencia declarada", p.exp],
      ["Perfil de vinculación", p.perfil],
      ["Disponibilidad", p.disp],
      ["Capacitación ICATECH", p.cursos],
      ["Municipio de residencia", p.mun]
    ];
    return '<div class="tarjeta" style="padding:18px 0 0">' +
      '<div class="tarjeta-enc" style="padding:0 18px"><h3>Perfil laboral</h3></div>' +
      '<div class="resumen-lista">' + datos.map(function (d) {
        return '<div class="resumen-dato"><span class="r-lab">' + esc(d[0]) + "</span>" +
          '<span class="r-val">' + esc(d[1]) + "</span></div>";
      }).join("") + "</div></div>";
  }

  /* ------------------------------------------------- Historial laboral -- */
  var FILAS = [
    { id:"todas",    t:"Todas" },
    { id:"abiertas", t:"Abiertas" },
    { id:"colocada", t:"Con contratación" },
    { id:"cerradas", t:"Cerradas" }
  ];

  function pasaFila(v, f) {
    var et = etapa(v).id;
    if (f === "abiertas") return et === "postulada" || et === "agendada" || et === "entrevistada" || et === "contratada";
    if (f === "colocada") return v.con === 1;
    if (f === "cerradas") return et === "concluida" || et === "nocontratada";
    return true;
  }

  function celdaSeg(v) {
    if (v.con !== 1 || !v.inicio) {
      return '<span class="v-na">—</span><span class="v-mot">' +
        (v.con === 1 ? "Sin fecha de inicio" : "No aplica sin contratación") + "</span>";
    }
    return segHitos(v);
  }

  function bloqueHistorial(p) {
    var vs = p.v.filter(function (v) { return pasaFila(v, filaFil); });
    var filas = vs.map(function (v) {
      var et = etapa(v);
      var fechas = ["Postulación " + fecha(v.post)];
      if (v.ent)    fechas.push("Entrevista " + fecha(v.ent));
      if (v.fcon)   fechas.push("Contratación " + fecha(v.fcon));
      if (v.inicio) fechas.push("Inicio de labores " + fecha(v.inicio));
      if (v.fin)    fechas.push("Conclusión " + fecha(v.fin));

      /* El resultado va en la misma celda que el chip de etapa, así que
         complementa al chip en vez de repetirlo: cuando el chip ya dice
         "Concluida", esta línea aporta el motivo, no la palabra otra vez.
         Y donde antes había un "—" de relleno ahora no va nada: un guion
         bajo un chip que ya explica el estado es ruido.                  */
      var resu;
      if (v.fin) {
        resu = '<span class="v-mot mal">' + esc(v.motFin) + "</span>";
      } else if (v.con === 0) {
        resu = '<span class="v-mot mal">' + esc(v.motNoCon) + "</span>";
      } else if (v.con === 1) {
        resu = '<span class="v-mot">' + esc(v.puesto || v.vac) +
          (v.inicio ? "" : " · falta la fecha de inicio de labores") + "</span>";
      } else if (v.ent && dias(v.ent, HOY) >= 0) {
        resu = '<span class="v-mot mal">La entrevista ya ocurrió: falta capturar el resultado.</span>';
      } else if (v.ent) {
        resu = '<span class="v-mot">Entrevista el ' + fecha(v.ent) + ".</span>";
      } else {
        resu = '<span class="v-mot">Sin entrevista agendada.</span>';
      }

      var acc = "";
      if (!v.fin && v.con === null && !v.ent) {
        acc = '<button class="btn btn-texto btn-s" type="button" data-ag="' + v.id + '">Agendar entrevista</button>';
      } else if (!v.fin && v.con === null && v.ent && dias(v.ent, HOY) >= 0) {
        acc = '<button class="btn btn-texto btn-s" type="button" data-res="' + v.id + '">Registrar resultado</button>';
      } else if (!v.fin && v.con === null && v.ent) {
        acc = '<button class="btn btn-texto btn-s" type="button" data-ag="' + v.id + '">Reagendar</button>';
      } else if (!v.fin && v.con === 1 && !v.inicio) {
        acc = '<button class="btn btn-texto btn-s" type="button" data-ini="' + v.id + '">Registrar inicio</button>';
      } else if (!v.fin && v.con === 1) {
        acc = '<button class="btn btn-texto btn-s" type="button" data-cierra="' + v.id + '">Cerrar vinculación</button>';
      }

      /* Cuatro columnas, no seis. Etapa y resultado cuentan lo mismo y van
         juntos; el responsable baja a la celda que ya lleva las fechas.
         Con seis columnas el chip de etapa (white-space:nowrap) desbordaba
         su 13% y se encimaba con el resultado, y "Cerrar vinculación" se
         partía a mitad de palabra.                                        */
      return "<tr" + (v.fin || v.con === 0 ? ' class="cerrada"' : "") + ">" +
        '<td><span class="v-vac">' + esc(v.vac) + "</span>" +
        '<span class="v-emp">' + esc(v.emp) + " · " + esc(v.sector) + "</span>" +
        '<span class="v-fec">' + fechas.join(" · ") + "</span>" +
        '<span class="v-resp">Responsable: ' + esc(v.resp) + "</span></td>" +
        '<td><span class="chip ' + et.c + '">' + et.t + "</span>" + resu + "</td>" +
        "<td>" + celdaSeg(v) + "</td>" +
        "<td>" + acc + "</td></tr>";
    }).join("");

    return '<div class="tarjeta" style="padding:0;overflow:hidden">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;' +
      'flex-wrap:wrap;padding:15px 16px 13px;border-bottom:1px solid var(--linea)">' +
        '<h3 class="sec-tit">Historial laboral</h3>' +
        '<div class="filtros-tabla" role="group" aria-label="Filtrar el historial">' +
          FILAS.map(function (f) {
            var n = p.v.filter(function (v) { return pasaFila(v, f.id); }).length;
            return '<button type="button" class="chip ' + (f.id === filaFil ? "chip-jade" : "chip-neutro") +
              '" data-ff="' + f.id + '" aria-pressed="' + (f.id === filaFil) + '">' + f.t + " " + n + "</button>";
          }).join("") +
        "</div></div>" +
      (vs.length
        ? '<div style="overflow-x:auto"><table class="tabla t-hist">' +
          '<colgroup><col class="c-vac"><col class="c-eta">' +
          '<col class="c-seg"><col class="c-acc"></colgroup><thead><tr>' +
          "<th>Vacante, empresa y fechas</th><th>Etapa y resultado</th>" +
          "<th>Seguimiento 15 / 30 días</th><th>Acción</th>" +
          "</tr></thead><tbody>" + filas + "</tbody></table></div>"
        : '<div class="vacio">' + ico("buscar") + "Ninguna vinculación con este filtro.</div>") +
      /* El porqué de la regla vive en el plegable de la cabecera; aquí basta
         la regla. Un párrafo de tres renglones al pie de cada tarjeta era
         lo que más hacía pesar la pantalla.                               */
      '<div class="tabla-pie" style="display:block">' +
        "Ninguna vinculación se elimina: las que no prosperan quedan como <b>No contratada</b> o " +
        "<b>Concluida</b>, con su motivo de catálogo." +
      "</div></div>";
  }

  /* ----------------------------------------------------------- Paneles -- */
  function selOpts(lista, sel) {
    return '<option value="">Selecciona…</option>' + lista.map(function (o) {
      return '<option value="' + esc(o) + '"' + (o === sel ? " selected" : "") + ">" + esc(o) + "</option>";
    }).join("");
  }

  function panelNueva(p) {
    var vg = vigente(p);
    var req = requisitos(p);
    var falta = req.filter(function (r) { return r.est === "no"; });

    var conse = "";
    if (vg) {
      conse += '<div class="conse tibia">' + ico("info") +
        "Esta persona tiene una <b>colocación vigente</b> en " + esc(vg.emp) +
        ". Registrar otra vinculación <b>no cierra</b> la anterior: si ya no labora ahí, primero registra la " +
        "verificación con resultado <b>Ya no labora</b>, para que el motivo quede documentado.</div>";
    }
    if (falta.length) {
      conse += '<div class="conse rompe">' + ico("alerta") +
        "Le falta <b>" + esc(falta[0].t.toLowerCase()) + "</b>. La vinculación puede registrarse y la persona " +
        "puede entrevistarse, pero <b>la contratación no podrá formalizarse</b> hasta acreditarlo. " +
        "El sistema no lo bloquea: lo declara.</div>";
    }
    if (!conse) {
      conse = '<div class="conse">' + ico("check") +
        "Requisitos completos: si la entrevista resulta favorable, la contratación puede formalizarse " +
        "y el seguimiento de 15 y 30 días arrancará en la fecha de inicio de labores.</div>";
    }

    return '<div class="panel" id="panelNueva">' +
      "<h3>Registrar vinculación</h3>" +
      '<p class="p-int">Alta de una postulación de <b>' + esc(p.n) + "</b>. El nombre de la empresa o patrón " +
      "es de captura libre porque una parte del empleo en la región no está en el padrón (RF12).</p>" +
      conse +
      '<div class="fila">' +
        '<div class="campo"><label for="nvVac">Vacante o actividad <span class="req">*</span></label>' +
          '<input type="text" id="nvVac" placeholder="Ej. Auxiliar de producción">' +
          '<span class="msg-error">Captura la vacante o la actividad.</span></div>' +
        '<div class="campo"><label for="nvEmp">Empresa o patrón <span class="req">*</span></label>' +
          '<input type="text" id="nvEmp" placeholder="Razón social o nombre del patrón">' +
          '<span class="msg-error">Captura la empresa o el patrón.</span></div>' +
      "</div>" +
      '<div class="fila-3">' +
        '<div class="campo"><label for="nvSec">Sector <span class="req">*</span></label>' +
          '<select id="nvSec">' + selOpts(SECTORES) + "</select>" +
          '<span class="msg-error">Elige el sector.</span></div>' +
        '<div class="campo"><label for="nvMun">Municipio del centro de trabajo</label>' +
          '<input type="text" id="nvMun" value="' + esc(p.mun) + '"></div>' +
        '<div class="campo"><label for="nvFec">Fecha de postulación <span class="req">*</span></label>' +
          '<input type="date" id="nvFec" value="' + HOY + '">' +
          '<span class="msg-error">Captura la fecha.</span></div>' +
      "</div>" +
      '<div class="campo"><label for="nvResp">Responsable del seguimiento <span class="req">*</span></label>' +
        '<input type="text" id="nvResp" value="' + esc(RESP) + '">' +
        '<span class="msg-error">Captura quién dará seguimiento.</span></div>' +
      '<div class="flex gap-8">' +
        '<button class="btn btn-primario btn-s" type="button" id="okNueva">' + ico("guardar") + "Registrar vinculación</button>" +
        '<button class="btn btn-secundario btn-s" type="button" id="cancelaPanel">Cancelar</button>' +
      "</div></div>";
  }

  function panelVerifica(p) {
    var vg = vigente(p);
    if (!vg) return "";
    var h = hito(vg, pHito);
    var opciones = [
      { id:"continua",    t:"Continúa laborando",   n:"La colocación se sostiene. El hito queda cumplido." },
      { id:"nolabora",    t:"Ya no labora",         n:"Cierra la vinculación con motivo y regresa a revinculación.", grave:1 },
      { id:"sincontacto", t:"No se pudo contactar", n:"Registra el intento y reprograma " + REPROG + " días." }
    ];

    var conse = "";
    if (res === "nolabora") {
      conse = '<div class="conse rompe">' + ico("alerta") +
        "Al confirmar, la vinculación con <b>" + esc(vg.emp) + "</b> pasa a <b>Concluida</b> con el motivo que " +
        "elijas y " + esc(p.n) + " regresa a la cartera como caso a revincular. " +
        "<b>Nada se elimina</b>: la vinculación y sus verificaciones permanecen en el historial (RNF03).</div>";
    } else if (res === "sincontacto") {
      var n = (h.fallidos ? h.fallidos.length : 0) + 1;
      conse = '<div class="conse tibia">' + ico("reloj") +
        "Se registra el intento y la verificación se reprograma para el <b>" +
        fecha(suma(h.venc, REPROG)) + "</b>. Sería el " + plural(n, "intento", "intentos") + " sin contacto" +
        (n >= 3 ? "; al tercero el caso se turna al <b>Enlace de Vinculación Laboral</b>." : ".") + "</div>";
    } else if (res === "continua") {
      conse = '<div class="conse">' + ico("check") +
        "El hito de " + pHito + " días queda <b>cumplido</b>" +
        (pHito === 15 ? ". Quedará pendiente la verificación de 30 días, programada para el <b>" +
           fecha(suma(vg.inicio, 30)) + "</b>."
         : " y con él concluye el seguimiento que exige RF12.") + "</div>";
    }

    return '<div class="panel' + (res === "nolabora" ? " grave" : "") + '" id="panelVerifica">' +
      "<h3>Registrar verificación de " + pHito + " días</h3>" +
      '<p class="p-int">' + esc(vg.puesto || vg.vac) + " · " + esc(vg.emp) +
      " · programada para el " + fecha(h.venc || h.prog) + ". " +
      "Una verificación es un registro con fecha, medio, resultado y responsable, no una casilla.</p>" +
      '<div class="etiqueta" style="margin-bottom:7px">Resultado de la verificación <span class="req">*</span></div>' +
      '<div class="opciones" id="opcRes" role="radiogroup" aria-label="Resultado de la verificación">' +
        opciones.map(function (o) {
          return '<label class="opcion' + (res === o.id ? " sel" : "") + (o.grave ? " grave" : "") + '">' +
            '<input type="radio" name="resVer" value="' + o.id + '"' + (res === o.id ? " checked" : "") + ">" +
            '<span><span class="o-t">' + esc(o.t) + '</span><span class="o-n">' + esc(o.n) + "</span></span></label>";
        }).join("") +
      "</div>" +
      conse +
      '<div class="fila">' +
        '<div class="campo"><label for="vfMedio">Medio de verificación <span class="req">*</span></label>' +
          '<select id="vfMedio">' + selOpts(MEDIOS) + "</select>" +
          '<span class="msg-error">Indica cómo se verificó.</span></div>' +
        '<div class="campo"><label for="vfFecha">Fecha de la verificación <span class="req">*</span></label>' +
          '<input type="date" id="vfFecha" value="' + HOY + '">' +
          '<span class="msg-error">Captura la fecha.</span></div>' +
      "</div>" +
      (res === "nolabora"
        ? '<div class="campo"><label for="vfMotivo">Motivo de la conclusión <span class="req">*</span></label>' +
          '<select id="vfMotivo">' + selOpts(MOT_FIN) + "</select>" +
          '<span class="msg-error">El motivo es obligatorio: es el dato que explica por qué no se sostienen las colocaciones.</span></div>'
        : "") +
      '<div class="campo"><label for="vfNota">Observación <span class="opc">(opcional)</span></label>' +
        '<textarea id="vfNota" rows="2" style="min-height:60px" placeholder="Lo que se constató en la verificación"></textarea></div>' +
      '<div class="flex gap-8">' +
        '<button class="btn ' + (res === "nolabora" ? "btn-peligro" : "btn-primario") +
          ' btn-s" type="button" id="okVerifica">' + ico("guardar") + "Guardar verificación</button>" +
        '<button class="btn btn-secundario btn-s" type="button" id="cancelaPanel">Cancelar</button>' +
      "</div></div>";
  }

  function panelResultado(p) {
    var v = pVinc;
    if (!v) return "";
    var falta = requisitos(p).filter(function (r) { return r.est === "no"; });
    var conse = res === "fav"
      ? (falta.length
          ? '<div class="conse rompe">' + ico("alerta") + "La entrevista fue favorable, pero le falta <b>" +
            esc(falta[0].t.toLowerCase()) + "</b>: la contratación <b>no puede formalizarse</b> hasta acreditarlo.</div>"
          : '<div class="conse">' + ico("check") + "Se registra la contratación. El seguimiento de 15 y 30 días " +
            "no arranca hasta capturar la <b>fecha de inicio de labores</b>.</div>")
      : (res === "nofav"
          ? '<div class="conse rompe">' + ico("alerta") + "La vinculación pasa a <b>No contratada</b> con su motivo " +
            "y permanece en el historial. El motivo alimenta el reporte de barreras de contratación.</div>"
          : "");

    return '<div class="panel' + (res === "nofav" ? " grave" : "") + '" id="panelResultado">' +
      "<h3>Resultado de la entrevista</h3>" +
      '<p class="p-int">' + esc(v.vac) + " · " + esc(v.emp) + " · entrevista del " + fecha(v.ent) + ".</p>" +
      '<div class="opciones" id="opcRes" role="radiogroup" aria-label="Resultado de la entrevista">' +
        [{ id:"fav", t:"Favorable: se contrata", n:"Registra la contratación y su fecha." },
         { id:"nofav", t:"No favorable", n:"Cierra la vinculación con motivo de catálogo.", grave:1 }
        ].map(function (o) {
          return '<label class="opcion' + (res === o.id ? " sel" : "") + (o.grave ? " grave" : "") + '">' +
            '<input type="radio" name="resEnt" value="' + o.id + '"' + (res === o.id ? " checked" : "") + ">" +
            '<span><span class="o-t">' + esc(o.t) + '</span><span class="o-n">' + esc(o.n) + "</span></span></label>";
        }).join("") +
      "</div>" + conse +
      (res === "fav"
        ? '<div class="fila"><div class="campo"><label for="reFcon">Fecha de contratación <span class="req">*</span></label>' +
          '<input type="date" id="reFcon" value="' + HOY + '"><span class="msg-error">Captura la fecha.</span></div>' +
          '<div class="campo"><label for="rePuesto">Puesto <span class="opc">(opcional)</span></label>' +
          '<input type="text" id="rePuesto" placeholder="Como aparece en el contrato"></div></div>'
        : "") +
      (res === "nofav"
        ? '<div class="campo"><label for="reMot">Motivo de no contratación <span class="req">*</span></label>' +
          '<select id="reMot">' + selOpts(MOT_NOCON) + "</select>" +
          '<span class="msg-error">El motivo es obligatorio.</span></div>'
        : "") +
      '<div class="flex gap-8">' +
        '<button class="btn ' + (res === "nofav" ? "btn-peligro" : "btn-primario") +
          ' btn-s" type="button" id="okResultado">' + ico("guardar") + "Guardar resultado</button>" +
        '<button class="btn btn-secundario btn-s" type="button" id="cancelaPanel">Cancelar</button>' +
      "</div></div>";
  }

  /* Sin este paso la postulación se queda sin salida: RF12 pide capturar la
     fecha de entrevista, y era el único eslabón que no tenía dónde hacerlo. */
  function panelAgenda(p) {
    var v = pVinc;
    if (!v) return "";
    return '<div class="panel" id="panelAgenda">' +
      "<h3>" + (v.ent ? "Reagendar entrevista" : "Agendar entrevista") + "</h3>" +
      '<p class="p-int">' + esc(v.vac) + " · " + esc(v.emp) +
      " · postulación del " + fecha(v.post) + ".</p>" +
      '<div class="conse">' + ico("reloj") +
        "Una vez pasada la fecha, la vinculación aparecerá en la cartera como <b>pendiente de capturar " +
        "el resultado</b>. La entrevista por sí sola no contrata a nadie: el resultado se registra aparte.</div>" +
      '<div class="campo" style="max-width:280px"><label for="agFec">Fecha de la entrevista <span class="req">*</span></label>' +
        '<input type="date" id="agFec" value="' + esc(v.ent || suma(HOY, 7)) + '">' +
        '<span class="msg-error">Captura la fecha de la entrevista.</span></div>' +
      '<div class="flex gap-8">' +
        '<button class="btn btn-primario btn-s" type="button" id="okAgenda">' + ico("guardar") + "Guardar</button>" +
        '<button class="btn btn-secundario btn-s" type="button" id="cancelaPanel">Cancelar</button>' +
      "</div></div>";
  }

  function panelInicio(p) {
    var v = pVinc;
    if (!v) return "";
    return '<div class="panel" id="panelInicio">' +
      "<h3>Registrar inicio de labores</h3>" +
      '<p class="p-int">' + esc(v.vac) + " · " + esc(v.emp) + " · contratada el " + fecha(v.fcon) + ".</p>" +
      '<div class="conse">' + ico("reloj") +
        "Esta fecha <b>arranca el reloj</b> de RF12: la verificación de 15 días y la de 30 días se programan " +
        "a partir de ella, no de la fecha de contratación.</div>" +
      '<div class="fila">' +
        '<div class="campo"><label for="inFec">Fecha de inicio de labores <span class="req">*</span></label>' +
          '<input type="date" id="inFec" value="' + HOY + '">' +
          '<span class="msg-error">Captura la fecha.</span></div>' +
        '<div class="campo"><label for="inPuesto">Puesto <span class="opc">(opcional)</span></label>' +
          '<input type="text" id="inPuesto" value="' + esc(v.puesto || "") + '"></div>' +
      "</div>" +
      '<div class="flex gap-8">' +
        '<button class="btn btn-primario btn-s" type="button" id="okInicio">' + ico("guardar") + "Guardar</button>" +
        '<button class="btn btn-secundario btn-s" type="button" id="cancelaPanel">Cancelar</button>' +
      "</div></div>";
  }

  function panelCierre(p) {
    var v = pVinc;
    if (!v) return "";
    return '<div class="panel grave" id="panelCierre">' +
      "<h3>Cerrar vinculación</h3>" +
      '<p class="p-int">' + esc(v.vac) + " · " + esc(v.emp) + " · inició el " + fecha(v.inicio) + ".</p>" +
      '<div class="conse rompe">' + ico("info") +
        "Cerrar <b>no elimina</b> nada (RNF03): la vinculación y sus verificaciones quedan en el historial. " +
        esc(p.n) + " regresa a la cartera como caso a revincular.</div>" +
      '<div class="fila">' +
        '<div class="campo"><label for="ciFec">Fecha de conclusión <span class="req">*</span></label>' +
          '<input type="date" id="ciFec" value="' + HOY + '">' +
          '<span class="msg-error">Captura la fecha.</span></div>' +
        '<div class="campo"><label for="ciMot">Motivo <span class="req">*</span></label>' +
          '<select id="ciMot">' + selOpts(MOT_FIN) + "</select>" +
          '<span class="msg-error">El motivo es obligatorio.</span></div>' +
      "</div>" +
      '<div class="flex gap-8">' +
        '<button class="btn btn-peligro btn-s" type="button" id="okCierre">' + ico("guardar") + "Cerrar vinculación</button>" +
        '<button class="btn btn-secundario btn-s" type="button" id="cancelaPanel">Cancelar</button>' +
      "</div></div>";
  }

  /* Aislamiento entre direcciones: se ve que el módulo existe, no su
     contenido. Es la contraparte exacta del candado que expediente-detalle
     pone sobre Empleabilidad.                                             */
  function bloqueModulos() {
    var mods = [
      { i:"expedientes", t:"Expediente único",  s:"Identidad, movilidad y bitácora", h:"expediente-detalle.html" },
      { i:"capacita",    t:"Capacitación",      s:"Misma dirección: cursos ICATECH", h:"capacitacion.html" },
      { i:"salud",       t:"Salud y Vulnerabilidad", s:"Sin acceso: dirección distinta", bloq:1 },
      { i:"constancia",  t:"Constancias",           s:"Constancia de colocación", h:"constancias.html" }
    ];
    return '<div class="tarjeta">' +
      '<div class="tarjeta-enc"><h3>Módulos vinculados</h3></div>' +
      '<div class="mods">' + mods.map(function (m) {
        return '<a class="modulo' + (m.bloq ? " bloqueado" : "") + '" href="' + (m.h || "#") + '">' +
          ico(m.bloq ? "candado" : m.i) + "<span><b>" + m.t + '</b><span class="txt-min">' + m.s +
          "</span></span></a>";
      }).join("") + "</div>" +
      '<div class="tarjeta-pie">Se muestra que el módulo existe, no su contenido: ninguna condición de ' +
      "salud puede usarse como criterio para vincular o descartar a una persona.</div></div>";
  }

  function acuse() {
    if (!acuses.length) return "";
    return '<div class="aviso aviso-jade" style="margin-bottom:16px">' + ico("check") +
      "<span><strong>" + plural(acuses.length, "movimiento registrado", "movimientos registrados") +
      " en esta sesión</strong>" + acuses.slice(-3).reverse().map(esc).join(" · ") + "</span></div>";
  }

  /* ======================================================================
     Pestañas del detalle
     --------------------------------------------------------------------
     El detalle mostraba siete bloques a la vez, unos 2 000 px de alto, en
     los que competían por la misma atención lo que hay que hacer hoy
     (seguimiento), el expediente laboral completo (historial) y la ficha de
     referencia (requisitos y perfil). Son tres tareas distintas y solo la
     primera es diaria, así que se separan en pestañas: es el componente
     .pestanas que ya usa expediente-detalle.html, no uno nuevo.
     La barra de acción y la cabecera quedan FUERA de las pestañas, de modo
     que el pendiente del día se ve siempre, sea cual sea la pestaña.
     ================================================================== */
  var PESTS = [
    { id:"seg",  t:"Seguimiento" },
    { id:"vinc", t:"Vinculaciones" },
    { id:"ficha", t:"Requisitos y perfil" }
  ];

  /* Por omisión se abre Seguimiento, salvo cuando no hay colocación: ahí
     esa pestaña sería un vacío y lo que importa es el historial.         */
  function pestPorOmision(p) {
    /* "Seguimiento" solo cuando hay un reloj corriendo. Si la contratación
       aún no tiene fecha de inicio, lo accionable está en el historial.  */
    return vigente(p) ? "seg" : "vinc";
  }

  function barraPestanas(p) {
    var pe = pendiente(p);
    /* El contador de la pestaña avisa de lo que hay dentro sin abrirla:
       eso es lo que permite cerrar las otras dos sin perder información. */
    var faltan = requisitos(p).filter(function (r) { return r.est === "no" || r.est === "pv"; }).length;
    /* Un número junto a "Seguimiento" y otro junto a "Vinculaciones" se ven
       iguales y no significan lo mismo: uno es una alerta y el otro un
       recuento. La alerta lleva glifo, no cifra.                          */
    var cta = { seg:  (pe && pe.peso <= 2)
                        ? '<span class="cta urge" title="Requiere acción">!</span>' : "",
                vinc: '<span class="cta">' + p.v.length + "</span>",
                ficha: faltan ? '<span class="cta urge" title="Requisitos por atender">!</span>' : "" };
    return '<div class="pestanas pest-det" role="tablist" aria-label="Secciones de la vinculación laboral">' +
      PESTS.map(function (t) {
        var act = t.id === pest;
        return '<button type="button" role="tab" class="pestana' + (act ? " activa" : "") +
          '" id="tab-' + t.id + '" data-tab="' + t.id + '" aria-selected="' + act +
          '" aria-controls="panel-' + t.id + '" tabindex="' + (act ? "0" : "-1") + '">' +
          t.t + (cta[t.id] || "") + "</button>";
      }).join("") + "</div>";
  }

  function cuerpoPestana(p) {
    if (pest === "seg") {
      /* Sin colocación en marcha no hay cifra que dar: la tarjeta héroe se
         quedaba con un "—" al lado de una tarjeta vacía que explicaba lo
         mismo que la barra de acción, tres veces el mismo dato. Con reloj
         corriendo sí van las dos, porque cuentan cosas distintas.        */
      return vigente(p)
        ? '<div class="rejilla g-hero">' + heroe(p) + bloqueHitos(p) + "</div>"
        : bloqueHitos(p);
    }
    if (pest === "vinc") {
      return (panel === "nueva" ? panelNueva(p) : "") +
             bloqueHistorial(p) +
             (panel === "cierre" ? panelCierre(p) : "");
    }
    return '<div class="rejilla g-2">' + bloqueRequisitos(p) + bloquePerfil(p) + "</div>" +
           '<div class="mt-16">' + bloqueModulos() + "</div>";
  }

  function pintaDetalle() {
    var p = persona();
    /* La pestaña activa NO se corrige aquí: pestPorOmision() ya elige la
       correcta al cambiar de persona, y forzarla en cada pintado hacía que
       un clic en "Seguimiento" sobre alguien sin colocación no hiciera
       nada visible. Esa pestaña tiene su propio estado vacío explicado.  */

    /* Los paneles de captura siempre aparecen en el mismo sitio —justo
       bajo la barra de acción— en vez de brotar en cuatro alturas
       distintas de la página según el modo. Salvo los dos que pertenecen
       a una fila del historial, que se quedan junto a su tabla.          */
    var arriba = (panel === "verifica"  ? panelVerifica(p)  : "") +
                 (panel === "resultado" ? panelResultado(p) : "") +
                 (panel === "agenda"    ? panelAgenda(p)    : "") +
                 (panel === "inicio"    ? panelInicio(p)    : "");

    $("#detalle").innerHTML =
      acuse() +
      cabecera(p) +
      '<div class="mt-16">' + accionBarra(p) + "</div>" +
      arriba +
      barraPestanas(p) +
      '<div role="tabpanel" id="panel-' + pest + '" aria-labelledby="tab-' + pest + '" tabindex="0">' +
        cuerpoPestana(p) +
      "</div>";
    eventosDetalle();
  }

  /* ======================================================================
     7. Eventos del detalle (se reenlazan tras cada repintado)
     ================================================================== */
  /* Los paneles de alta y de cierre viven dentro de la pestaña del
     historial: abrirlos desde fuera tiene que llevar ahí, o el panel se
     pintaría en una pestaña que no está a la vista.                      */
  var PANEL_PEST = { nueva:"vinc", cierre:"vinc" };

  function abre(modo, vinc, h) {
    panel = modo; pVinc = vinc || null; pHito = h || null; res = null;
    if (PANEL_PEST[modo]) pest = PANEL_PEST[modo];
    pintaDetalle();
    var el = $(".panel");
    if (el) {
      el.scrollIntoView({ behavior:"smooth", block:"center" });
      /* El foco entra al panel: abrir un formulario y dejar el foco en el
         botón que ya desapareció obliga a tabular toda la página.        */
      var primero = el.querySelector("input,select,textarea,button");
      if (primero) primero.focus({ preventScroll:true });
    }
  }

  function valida(ids) {
    var falta = null;
    ids.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var vacio = !el.value;
      el.closest(".campo").classList.toggle("error", vacio);
      if (vacio && !falta) falta = el;
    });
    if (falta) falta.focus();
    return !falta;
  }

  function cierra(msg) {
    if (msg) acuses.push(msg);
    panel = null; pVinc = null; pHito = null; res = null;
    pintaChips(); pintaLista(); pintaDetalle();
    if (msg) $("#anuncio").textContent = msg + ". " +
      (pendiente(persona()) ? "Queda un pendiente." : "Sin pendientes de seguimiento.");
    var h = $("#tPersona");
    if (h) h.focus({ preventScroll:true });
    window.scrollTo({ top:0, behavior:"smooth" });
  }

  function eventosDetalle() {
    var p = persona();

    /* Pestañas: clic y navegación con flechas, Inicio y Fin, como pide el
       patrón de tablist. El repintado devuelve el foco a la pestaña.     */
    $$("[data-tab]").forEach(function (b) {
      b.onclick = function () {
        pest = this.getAttribute("data-tab");
        panel = null; pVinc = null; pHito = null; res = null;
        pintaDetalle();
        var t = $("#tab-" + pest);
        if (t) t.focus({ preventScroll:true });
      };
      b.onkeydown = function (ev) {
        var ids = PESTS.map(function (t) { return t.id; });
        var i = ids.indexOf(this.getAttribute("data-tab")), n = null;
        if (ev.key === "ArrowRight") n = ids[(i + 1) % ids.length];
        else if (ev.key === "ArrowLeft") n = ids[(i - 1 + ids.length) % ids.length];
        else if (ev.key === "Home") n = ids[0];
        else if (ev.key === "End") n = ids[ids.length - 1];
        if (!n) return;
        ev.preventDefault();
        var d = $("#tab-" + n);
        if (d) d.click();
      };
    });

    var bn = $("#btnNueva");
    if (bn) bn.onclick = function () { abre("nueva"); };

    var bn2 = $("#btnNueva2");
    if (bn2) bn2.onclick = function () { abre("nueva"); };

    var br = $("#btnResultado");
    if (br) br.onclick = function () { abre("resultado", entrevistaSinResultado(p)); };

    var bi = $("#btnInicio");
    if (bi) bi.onclick = function () { abre("inicio", sinInicio(p)); };

    $$("[data-ver]").forEach(function (b) {
      b.onclick = function () { abre("verifica", null, parseInt(this.getAttribute("data-ver"), 10)); };
    });
    $$("[data-res]").forEach(function (b) {
      b.onclick = function () { abre("resultado", vinc(this.getAttribute("data-res"))); };
    });
    $$("[data-ag]").forEach(function (b) {
      b.onclick = function () { abre("agenda", vinc(this.getAttribute("data-ag"))); };
    });
    $$("[data-ini]").forEach(function (b) {
      b.onclick = function () { abre("inicio", vinc(this.getAttribute("data-ini"))); };
    });
    $$("[data-cierra]").forEach(function (b) {
      b.onclick = function () { abre("cierre", vinc(this.getAttribute("data-cierra"))); };
    });
    $$("[data-ff]").forEach(function (b) {
      b.onclick = function () { filaFil = this.getAttribute("data-ff"); pintaDetalle(); };
    });

    var op = $("#opcRes");
    if (op) op.addEventListener("change", function (ev) {
      res = ev.target.value;
      pintaDetalle();
      /* El repintado pierde el foco: se devuelve a la opción elegida. */
      var r = document.querySelector('#opcRes input[value="' + res + '"]');
      if (r) r.focus();
    });

    var cp = $("#cancelaPanel");
    if (cp) cp.onclick = function () { cierra(); };

    var on = $("#okNueva");
    if (on) on.onclick = function () {
      if (!valida(["nvVac", "nvEmp", "nvSec", "nvFec", "nvResp"])) return;
      p.v.unshift({
        id:"V-" + p.e + "-" + (p.v.length + 1), vac:$("#nvVac").value, emp:$("#nvEmp").value,
        sector:$("#nvSec").value, munEmp:$("#nvMun").value, resp:$("#nvResp").value,
        post:$("#nvFec").value, ent:null, entRes:null, con:null,
        inicio:null, fin:null, motFin:null, seg:{ "15":[], "30":[] }
      });
      cierra("Vinculación registrada en " + $("#nvEmp").value);
    };

    var ov = $("#okVerifica");
    if (ov) ov.onclick = function () {
      if (!res) { $("#opcRes").querySelector("input").focus(); return; }
      var campos = ["vfMedio", "vfFecha"];
      if (res === "nolabora") campos.push("vfMotivo");
      if (!valida(campos)) return;
      var vg = vigente(p);
      vg.seg[String(pHito)].push({
        f:$("#vfFecha").value, medio:$("#vfMedio").value, res:res, por:RESP,
        nota:$("#vfNota").value || ""
      });
      if (res === "nolabora") { vg.fin = $("#vfFecha").value; vg.motFin = $("#vfMotivo").value; }
      cierra("Verificación de " + pHito + " días: " + RES_TXT[res]);
    };

    var orr = $("#okResultado");
    if (orr) orr.onclick = function () {
      if (!res) { $("#opcRes").querySelector("input").focus(); return; }
      if (!valida(res === "fav" ? ["reFcon"] : ["reMot"])) return;
      if (res === "fav") {
        pVinc.entRes = "fav"; pVinc.con = 1; pVinc.fcon = $("#reFcon").value;
        if ($("#rePuesto").value) pVinc.puesto = $("#rePuesto").value;
        cierra("Contratación registrada en " + pVinc.emp);
      } else {
        pVinc.entRes = "nofav"; pVinc.con = 0; pVinc.motNoCon = $("#reMot").value;
        cierra("Vinculación no contratada en " + pVinc.emp);
      }
    };

    var oa = $("#okAgenda");
    if (oa) oa.onclick = function () {
      if (!valida(["agFec"])) return;
      pVinc.ent = $("#agFec").value;
      cierra("Entrevista agendada en " + pVinc.emp + " para el " + fecha(pVinc.ent));
    };

    var oi = $("#okInicio");
    if (oi) oi.onclick = function () {
      if (!valida(["inFec"])) return;
      pVinc.inicio = $("#inFec").value;
      if ($("#inPuesto").value) pVinc.puesto = $("#inPuesto").value;
      cierra("Inicio de labores registrado: " + fecha(pVinc.inicio));
    };

    var oc = $("#okCierre");
    if (oc) oc.onclick = function () {
      if (!valida(["ciFec", "ciMot"])) return;
      pVinc.fin = $("#ciFec").value; pVinc.motFin = $("#ciMot").value;
      cierra("Vinculación cerrada: " + pVinc.motFin);
    };

    function vinc(id) {
      return p.v.filter(function (v) { return v.id === id; })[0] || null;
    }
  }

  /* ======================================================================
     8. Eventos de la cartera (elementos fijos del HTML)
     ================================================================== */
  function pintaChips() {}
  function pintaLista() {}

  function anuncia() {
    var p = persona(), pe = pendiente(p);
    $("#anuncio").textContent = p.n + ", expediente " + p.e + ". " +
      (pe ? pe.txt + "." : "Sin pendientes de seguimiento.");
    var h = $("#tPersona");
    if (h) h.focus({ preventScroll:true });
  }

  var gestor = SIMH.gestorCaso({
    items: PERSONAS,
    indiceInicial: Math.max(0, PERSONAS.findIndex(function(p){ return p.e === sel; })),
    titulo: "Cartera de Seguimiento Laboral",
    placeholder: "Buscar persona, folio o empresa...",
    filtraItem: function(p, txt) {
      if (!txt) return true;
      var t = (p.n + " " + p.e + " " + p.perfil + " " + p.mun + " " + (p.v.map(function(v){return v.emp+" "+v.vac;}).join(" "))).toLowerCase();
      return t.indexOf(txt.toLowerCase()) >= 0;
    },
    renderItem: function(p, esActivo, idx) {
      var vg = vigente(p), si = sinInicio(p), ep = enProceso(p);
      var chip = vg ? '<span class="chip chip-jade">Colocada</span>'
        : (si ? '<span class="chip chip-jade">Contratada</span>'
        : (ep.length ? '<span class="chip chip-neutro">En proceso</span>'
        : '<span class="chip chip-rosa">Sin colocación</span>'));

      return '<button type="button" class="drawer-item' + (esActivo ? ' activo' : '') + '" data-idx="' + idx + '">' +
        '<div class="drawer-item-avatar">' + esc(inic(p.n)) + '</div>' +
        '<div class="drawer-item-txt">' +
          '<span class="drawer-item-nom">' + esc(p.n) + '</span>' +
          '<span class="drawer-item-sub">Exp. ' + p.e + ' · ' + esc(p.perfil) + '</span>' +
        '</div>' +
        chip +
      '</button>';
    },
    onSelect: function(p, idx) {
      sel = p.e;
      panel = null; pVinc = null; pHito = null; res = null; filaFil = "todas";
      pest = pestPorOmision(p);
      pintaDetalle();
      anuncia();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  pest = pestPorOmision(persona());
  if (qs.get("tab") && PESTS.some(function (t) { return t.id === qs.get("tab"); })) {
    pest = qs.get("tab");
  }
  if (panel && PANEL_PEST[panel]) pest = PANEL_PEST[panel];

  pintaDetalle();

  /* Eventos de navegación y apertura del selector */
  document.addEventListener("click", function(e) {
    if (e.target.closest("#btnAbrirSelector")) {
      gestor.abrir();
    } else if (e.target.closest("#btnCasoAnt")) {
      gestor.anterior();
    } else if (e.target.closest("#btnCasoSig")) {
      gestor.siguiente();
    }
  });
})();
</script>
</body>
</html>
