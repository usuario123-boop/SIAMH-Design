<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revalidación de Estudios · SIMH</title>
<link rel="icon" href="assets/img/simh-isotipo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/simh.css">
<style>
  /* ======================================================================
     REVALIDACIÓN DE ESTUDIOS
     Acompañamiento en el reconocimiento de estudios y registro de las
     negativas de atención de las autoridades educativas.
     Las piezas compartidas están en simh.css: `.filtros-fila` (§20),
     `.accion` (§21), `.oficio-hoja` (§22) y el bloque de módulo (§23) con
     `.sec-tit`, `.vacio`, `.cartera`, `.req-item` y el piso de foco.
     ================================================================== */
  /* --- Revalidación de estudios ------------------------------------------
     Misma forma que Salud y Vulnerabilidad, que es lo que pidió la Dirección:
     cartera a la izquierda ordenada por urgencia y el caso a la derecha.  */
  .g-reval{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
  @media (max-width:1100px){ .g-reval{grid-template-columns:1fr} }

  .req-item{display:flex;gap:11px;align-items:flex-start;padding:12px 0;
    border-bottom:1px solid var(--linea-suave)}
  .req-item:last-child{border-bottom:0;padding-bottom:0}
  .req-item > .r-ico{width:24px;height:24px;flex:none;border-radius:6px;display:grid;
    place-items:center;border:1px solid transparent;margin-top:1px}
  .req-item > .r-ico svg{width:14px;height:14px;stroke-width:2;fill:none}
  .req-item .r-ico.si{background:var(--jade-050);border-color:rgba(0,152,135,.28)}
  .req-item .r-ico.si svg{stroke:var(--jade-900)}
  .req-item .r-ico.tramite{background:var(--rosa-050);border-color:rgba(201,1,102,.3)}
  .req-item .r-ico.tramite svg{stroke:var(--rosa)}
  .req-item .r-ico.falta{background:var(--guinda-050);border-color:rgba(174,25,45,.3)}
  .req-item .r-ico.falta svg{stroke:var(--guinda)}
  .req-item .r-ico.na{background:var(--arena-050);border-color:var(--linea);color:var(--gris-claro);
    font-size:13px;line-height:1}
  .req-item .r-tx{flex:1;min-width:0}
  .req-item .r-t{display:block;font-size:13.5px;font-weight:700;color:var(--tinta);line-height:1.35}
  .req-item .r-est{display:block;font-size:12px;font-weight:700;margin-top:3px;line-height:1.4}
  .req-item .r-est.si{color:var(--jade-900)}
  .req-item .r-est.tramite{color:#7d0140}
  .req-item .r-est.falta{color:var(--guinda-900)}
  .req-item .r-est.na{color:var(--gris-claro)}
  /* Un requisito que no dice qué bloquea es una casilla más; lo que la
     ventanilla necesita saber es si puede seguir sin él. */
  .req-item .r-n{display:block;font-size:12.5px;color:var(--gris);margin-top:4px;line-height:1.5}

  .neg-item{display:flex;gap:11px;align-items:flex-start;padding:13px 0;
    border-bottom:1px solid var(--linea-suave)}
  .neg-item:last-child{border-bottom:0;padding-bottom:0}
  .neg-item > svg{width:18px;height:18px;flex:none;stroke-width:1.8;fill:none;margin-top:2px;
    stroke:var(--guinda)}
  .neg-item .n-tx{flex:1;min-width:0}
  .neg-item .n-t{display:block;font-size:13.5px;font-weight:700;color:var(--guinda-900);line-height:1.35}
  .neg-item .n-m{display:block;font-size:12.5px;color:var(--gris);margin-top:4px;line-height:1.5}
  .neg-item .n-m b{color:var(--tinta)}
  .neg-item .n-f{display:block;font-size:11.5px;color:var(--gris-claro);margin-top:4px;
    font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<main class="contenido">
  <div class="migas"><a href="index.html">Inicio</a> › Revalidación de Estudios</div>

  <div class="enc">
    <div class="enc-txt">
      <h1>Revalidación de Estudios</h1>
      <div class="enc-sub">Requisitos del trámite, acompañamiento y negativas de atención registradas</div>
    </div>
    <div class="enc-acc" id="encAcc"></div>
  </div>

  <details class="plegable" id="avisoMod">
    <summary>Cómo funciona el acompañamiento educativo</summary>
    <div class="cuerpo" id="avisoModCuerpo"></div>
  </details>

  <div id="panel"></div>

  <p id="anuncio" class="sr-solo" role="status" aria-live="polite"></p>
</main>

<script src="assets/js/simh.js"></script>
<script src="assets/js/simh-datos.js"></script>
<script>
(function () {
  "use strict";
  SIMH.chrome("revalida");
  var ico = SIMH.icono, esc = SIMH.esc;
  /* Reloj, permisos y catálogo de personas: assets/js/simh-datos.js, que
     comparten los cuatro módulos de documentos. */
  var D = window.DATOS;
  var HOY = D.HOY, fecha = D.fecha, hora = D.hora, fechaHora = D.fechaHora;
  var dias = D.dias, edad = D.edad, plural = D.plural, persona = D.persona;
  var PERS = D.PERS, YO = D.YO;
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  /* Fila de un bloque de resumen. */
  function rd(lab, val) {
    return '<div class="resumen-dato"><span class="r-lab">' + esc(lab) + "</span>" +
      '<span class="r-val">' + esc(val) + "</span></div>";
  }
  function anuncia(t) { $("#anuncio").textContent = t; }
  function noSimulado(q) {
    anuncia(q);
    window.alert(q + "\n\nEn el prototipo la acción no se ejecuta.");
  }

  var REVAL = D.REVAL, NIVELES = D.NIVELES, MOT_NEG = D.MOT_NEG;
  var negAbierta = D.negAbierta;

  function caso() {
    return REVAL.filter(function (x) { return x.id === rSel; })[0] || null;
  }

  /* ======================================================================
     El módulo de revalidación de estudios
     --------------------------------------------------------------------
     La Dirección lo pidió «que se parezca a la de salud y vulnerabilidad»:
     cartera ordenada por urgencia a la izquierda y el caso a la derecha. Y
     pidió tres cosas concretas: especificar qué requiere el trámite,
     acompañar cuando NO LOS QUIEREN ATENDER, y acompañar el trámite.

     De ahí sale la corrección de fondo de este módulo: **la educación
     básica no se revalida**. Una niña o un niño se inscribe aunque no
     traiga papeles, y la escuela regulariza después; el Acuerdo 286 y la
     normativa de inclusión impiden condicionar la inscripción. Casi todas
     las negativas que motivaron este módulo son de ese tipo, así que la
     pantalla no puede tratar la básica como un trámite con requisitos:
     tiene que decir que el requisito no existe y que lo que hay que
     registrar es la negativa.

     Y por eso la negativa es un REGISTRO, no una queja: sin fecha,
     institución, motivo de catálogo y qué se hizo, no hay nada que
  /* NIVELES, MOT_NEG, REVAL y negAbierta() viven en assets/js/simh-datos.js:
     el compositor de Canalizaciones los necesita para citar la negativa que
     el oficio reclama, así que son datos de dos módulos, no de este.  */

  /* Cada requisito dice QUIÉN lo expide y QUÉ BLOQUEA. Un requisito que no
     declara su consecuencia es una casilla más; lo que la ventanilla
     necesita saber es si puede seguir sin él.                            */
  var REQUISITOS = {
    basica: [
      { id:"valora",  t:"Valoración o examen de ubicación de la escuela",
        quien:"La escuela", bloq:"Determina el grado en que se inscribe. No condiciona la inscripción." },
      { id:"acta",    t:"Acta de nacimiento o documento de identidad",
        quien:"La persona o su consulado", bloq:"No impide inscribir: se regulariza después." },
      { id:"curp",    t:"CURP",
        quien:"RENAPO, con apoyo de la ventanilla",
        bloq:"No impide inscribir: la escuela la tramita junto con la familia." },
      { id:"boletas", t:"Boletas o constancia de estudios del país de origen",
        quien:"La persona", bloq:"Si no hay, la escuela ubica por examen. No impide inscribir." }
    ],
    media: [
      { id:"cert",  t:"Certificado o constancia de estudios del país de origen",
        quien:"La institución de origen", bloq:"Sin él no se abre el trámite." },
      { id:"apost", t:"Apostilla o legalización del certificado",
        quien:"Autoridad del país de origen o consulado",
        bloq:"Se exige para la revalidación total. Para la parcial la autoridad puede resolver con cotejo." },
      { id:"trad",  t:"Traducción por perito autorizado",
        quien:"Perito del Poder Judicial del Estado", bloq:"Solo si el documento no está en español." },
      { id:"ident", t:"Identificación oficial vigente",
        quien:"La persona", bloq:"Sin ella no se recibe la solicitud." },
      { id:"curp",  t:"CURP",
        quien:"RENAPO", bloq:"Sin ella no se emite la resolución." },
      { id:"pago",  t:"Pago de derechos",
        quien:"La persona",
        bloq:"Sin él no se dictamina. Hay exención para personas en situación de vulnerabilidad y debe informarse." }
    ],
    superior: [
      { id:"cert",  t:"Título, certificado o constancia de estudios",
        quien:"La institución de origen", bloq:"Sin él no se abre el trámite." },
      { id:"plan",  t:"Plan de estudios y calificaciones por materia",
        quien:"La institución de origen", bloq:"Sin él la revalidación no puede ser por materias." },
      { id:"apost", t:"Apostilla o legalización",
        quien:"Autoridad del país de origen o consulado", bloq:"Se exige para la resolución definitiva." },
      { id:"trad",  t:"Traducción por perito autorizado",
        quien:"Perito del Poder Judicial del Estado", bloq:"Solo si el documento no está en español." },
      { id:"ident", t:"Identificación oficial vigente",
        quien:"La persona", bloq:"Sin ella no se recibe la solicitud." },
      { id:"curp",  t:"CURP",
        quien:"RENAPO", bloq:"Sin ella no se emite la resolución." },
      { id:"pago",  t:"Pago de derechos",
        quien:"La persona", bloq:"Sin él no se dictamina. Hay exención que debe informarse." }
    ]
  };

  var EST_REQ = {
    si:      { t:"Reunido",               i:"check" },
    tramite: { t:"En trámite",            i:"reloj" },
    falta:   { t:"Falta",                 i:"alerta" },
    na:      { t:"No aplica a este caso", i:null }
  };
  function reqDe(c) { return REQUISITOS[c.nivel] || []; }
  function faltantes(c) {
    return reqDe(c).filter(function (r) { return c.req[r.id] === "falta"; });
  }
  function reunidos(c) {
    return reqDe(c).filter(function (r) {
      return c.req[r.id] === "si" || c.req[r.id] === "na";
    }).length;
  }
  /* Un faltante que no impide nada no es un pendiente. La frase de bloqueo
     es la que decide, para no tener el dato en dos sitios. */
  function detiene(r) {
    return r.bloq.indexOf("No impide") < 0 && r.bloq.indexOf("No condiciona") < 0;
  }

  /* Peso de lo pendiente, igual que en canalizaciones: menor es más urgente.
     Ordena la cartera y elige la única barra de acción.                   */
  function pesoR(c) {
    if (c.resuelto) return 9;
    if (negAbierta(c)) return 1;                    /* nadie la ha reclamado todavía */
    if (c.neg.length) return 2;                     /* reclamada, sin respuesta */
    if (c.limite && dias(c.limite) <= 7) return 3;
    if (faltantes(c).filter(detiene).length) return 4;
    return 5;
  }

  function estadoR(c) {
    if (c.resuelto) return { t:"Resuelta", c:"chip-jade", i:"check" };
    if (negAbierta(c)) return { t:"Negativa sin reclamar", c:"chip-guinda", i:"alerta" };
    if (c.neg.length) return { t:"Reclamada por oficio", c:"chip-rosa", i:"reloj" };
    if (faltantes(c).filter(detiene).length) return { t:"Faltan requisitos", c:"chip-rosa", i:"alerta" };
    return { t:"En trámite", c:"chip-neutro", i:"reloj" };
  }

  function carteraReval() {
    var ord = REVAL.slice().sort(function (a, b) { return pesoR(a) - pesoR(b); });
    return '<div class="cartera" role="listbox" aria-label="Casos de revalidación">' +
      ord.map(function (c) {
        var p = persona(c.per), e = estadoR(c), sl = c.id === rSel;
        return '<button class="cart-item" type="button" role="option" aria-selected="' + sl +
          '" data-r="' + c.id + '"><span class="avatar-mini">' + esc(p.ini) + "</span>" +
          '<span class="k-tx"><span class="k-n">' + esc(p.n) + "</span>" +
          '<span class="k-f">' + esc(p.f) + " · " + edad(p.nac) + " años</span>" +
          '<span class="k-f">' + esc(NIVELES[c.nivel].t.split(" · ")[0]) + "</span>" +
          '<span class="k-e"><span class="chip ' + e.c + '">' + ico(e.i) + esc(e.t) +
          "</span></span></span></button>";
      }).join("") + "</div>";
  }

  function accionReval(c) {
    var p = persona(c.per);
    var corto = p.n.split(" ").slice(0, 2).join(" ");
    var na = negAbierta(c);

    if (na) {
      return { tono:"urge", i:"alerta",
        t:"Una institución se negó a atender a " + corto + " y nadie lo ha reclamado",
        n:na.inst + ", el " + fecha(na.t) + ": " + na.motivo.toLowerCase() + ". " + na.detalle +
          " Mientras la negativa no se convierta en oficio, para la autoridad educativa no ocurrió.",
        btn:'<button class="btn btn-peligro" type="button" id="btnOficioEdu">' + ico("oficios") +
            "Reclamar por oficio</button>" };
    }
    if (c.resuelto) {
      return { tono:"ok", i:"check", t:"Revalidación resuelta el " + fecha(c.resuelto),
        n:"El expediente conserva los requisitos reunidos y las gestiones hechas. No hay nada " +
          "pendiente en este caso.", btn:"" };
    }
    if (c.neg.length) {
      var ult = c.neg[c.neg.length - 1];
      return { tono:"tibia", i:"reloj",
        t:"Reclamada por el oficio " + ult.oficio + ", en espera de respuesta",
        n:ult.hizo + " Si la autoridad no responde, la siguiente gestión va a la Subsecretaría, no " +
          "otra vez al mismo plantel.",
        btn:'<button class="btn btn-secundario" type="button" data-ofi="' + esc(ult.oficio) + '">' +
            ico("der") + "Ver el oficio</button>" };
    }
    var f = faltantes(c), bloq = f.filter(detiene);
    if (f.length) {
      return { tono: bloq.length ? "tibia" : "ok", i: bloq.length ? "alerta" : "check",
        t: bloq.length
             ? "Faltan " + plural(bloq.length, "requisito que detiene el trámite",
                                  "requisitos que detienen el trámite")
             : "Faltan " + plural(f.length, "documento", "documentos") + ", pero ninguno detiene el trámite",
        n: bloq.length
             ? bloq.map(function (r) { return r.t; }).join("; ") + ". " + bloq[0].bloq
             : "Los faltantes se regularizan después; ninguno puede usarse para negar la atención.",
        btn:'<button class="btn btn-primario" type="button" id="btnGestion">' + ico("mas") +
            "Registrar una gestión</button>" };
    }
    return { tono:"ok", i:"check", t:"Requisitos completos, en espera de la resolución",
      n:"El expediente está reunido ante " + c.inst.split(" · ")[0] + ". No hay nada que pedirle a " +
        corto + ".",
      btn:'<button class="btn btn-secundario" type="button" id="btnGestion">' + ico("mas") +
          "Registrar una gestión</button>" };
  }

  function panelNegativa(c) {
    return '<div class="tarjeta" id="cajaNeg" style="margin-bottom:16px">' +
      '<div class="tarjeta-enc"><h3 id="tNeg" tabindex="-1">Registrar una negativa de atención</h3></div>' +
      '<p style="font-size:12.5px;color:var(--gris);line-height:1.55;margin-bottom:14px">' +
        "Lo que se registra es el hecho: qué institución, qué día y qué alegó. Sin eso no hay nada " +
        "que reclamar, porque una negativa verbal en una ventanilla no deja rastro.</p>" +
      '<div class="fila">' +
        '<div class="campo"><label for="nInstEdu">Institución o plantel <span class="req">*</span></label>' +
          '<input type="text" id="nInstEdu" value="' + esc(c.inst.split(" · ")[0]) + '"></div>' +
        '<div class="campo"><label for="nFecEdu">Fecha del hecho <span class="req">*</span></label>' +
          '<input type="date" id="nFecEdu" value="' + HOY.slice(0, 10) + '"></div>' +
      "</div>" +
      '<div class="campo"><label for="nMotEdu">Qué alegaron <span class="req">*</span></label>' +
        '<select id="nMotEdu"><option value="">Elige un motivo del catálogo…</option>' +
        MOT_NEG.map(function (m) { return "<option>" + esc(m) + "</option>"; }).join("") +
        "</select></div>" +
      '<div class="campo"><label for="nDetEdu">Cómo ocurrió <span class="req">*</span></label>' +
        '<textarea id="nDetEdu" maxlength="400" placeholder="Quién atendió, qué pidió y con qué ' +
        'palabras. Es lo que va a citar el oficio."></textarea></div>' +
      '<div class="barra-acciones">' +
        '<span class="estado-borrador">' + ico("info") +
          "Al guardarla el caso queda como negativa sin reclamar, hasta que se emita el oficio.</span>" +
        '<span class="flex gap-8">' +
          '<button class="btn btn-secundario" type="button" id="btnNegNo">Cancelar</button>' +
          '<button class="btn btn-primario" type="button" id="btnNegSi">' + ico("guardar") +
            "Guardar la negativa</button></span>" +
      "</div></div>";
  }

  function detalleReval(c) {
    var p = persona(c.per);
    var N = NIVELES[c.nivel];
    var a = accionReval(c);
    var reqs = reqDe(c);
    var e = estadoR(c);

    var lista = reqs.map(function (r) {
      var st = c.req[r.id] || "falta";
      var E = EST_REQ[st];
      return '<div class="req-item"><span class="r-ico ' + st + '">' +
        (E.i ? ico(E.i) : "—") + "</span>" +
        '<span class="r-tx"><span class="r-t">' + esc(r.t) + "</span>" +
        '<span class="r-est ' + st + '">' + esc(E.t) + "</span>" +
        '<span class="r-n">Lo expide: ' + esc(r.quien) + ". " + esc(r.bloq) + "</span></span></div>";
    }).join("");

    var negs = c.neg.length
      ? c.neg.slice().reverse().map(function (x) {
          return '<div class="neg-item">' + ico("alerta") +
            '<span class="n-tx"><span class="n-t">' + esc(x.motivo) + "</span>" +
            '<span class="n-m">' + esc(x.detalle) + "</span>" +
            '<span class="n-m">' + (x.oficio
              ? "<b>Reclamada:</b> " + esc(x.hizo) + " Oficio <b>" + esc(x.oficio) + "</b>."
              : "<b>Sin reclamar.</b> No se ha emitido oficio, así que para la autoridad " +
                "educativa este hecho no ocurrió.") + "</span>" +
            '<span class="n-f">' + esc(x.inst) + " · " + fechaHora(x.t) + "</span></span></div>";
        }).join("")
      : '<div class="vacio">' + ico("check") +
        "Ninguna institución ha negado la atención en este caso.</div>";

    return '<div class="accion ' + a.tono + '">' + ico(a.i) +
        '<div class="a-tx"><span class="a-t">' + esc(a.t) + "</span>" +
        '<span class="a-n">' + esc(a.n) + "</span></div>" +
        (a.btn ? '<div class="a-acc">' + a.btn + "</div>" : "") + "</div>" +

      '<div class="tarjeta" style="margin-bottom:16px">' +
        '<div class="tarjeta-enc"><h2 class="sec-tit" id="tReval" tabindex="-1">' + esc(p.n) +
          '</h2><span class="chip ' + e.c + '">' + ico(e.i) + esc(e.t) + "</span></div>" +
        '<div class="resumen-grupo"><h4>El trámite</h4><div class="resumen-lista">' +
          rd("Expediente", p.f + " · " + edad(p.nac) + " años · " + p.pais) +
          rd("Nivel", N.t) +
          rd("Qué se busca", c.destino) +
          rd("Ante quién", c.inst) +
          rd("Abierto el", fecha(c.abierto)) +
          (c.limite ? rd(c.limiteTxt, fecha(c.limite) +
            (dias(c.limite) >= 0 ? " · en " + plural(dias(c.limite), "día", "días") : " · vencido")) : "") +
          (p.nna ? rd("Persona menor de edad", "Acompaña " + p.tutor) : "") +
        "</div></div>" +
        '<div class="aviso ' + (N.revalida ? "aviso-neutro" : "aviso-jade") +
          '" style="margin:16px 0 0">' + ico(N.revalida ? "info" : "check") +
          "<span><strong>" + (N.revalida ? "Cómo resuelve esta autoridad"
                                         : "Este nivel no se revalida") + "</strong>" +
          esc(N.regla) + "</span></div>" +
      "</div>" +

      (panelNeg ? panelNegativa(c) : "") +

      '<div class="rejilla g-2" style="align-items:start">' +
        '<div class="tarjeta"><div class="tarjeta-enc"><h3>Qué requiere el trámite</h3>' +
          '<span class="chip chip-neutro">' + reunidos(c) + " de " + reqs.length + "</span></div>" +
          lista + "</div>" +
        '<div class="tarjeta"><div class="tarjeta-enc"><h3>Negativas de atención</h3>' +
          (c.resuelto ? "" : '<button class="btn btn-secundario btn-s" type="button" id="btnNeg">' +
            ico("mas") + "Registrar</button>") + "</div>" +
          negs + "</div>" +
      "</div>";
  }

  function vistaReval() {
    var c = REVAL.filter(function (x) { return x.id === rSel; })[0];
    if (!c) {
      c = REVAL.slice().sort(function (a, b) { return pesoR(a) - pesoR(b); })[0];
      rSel = c.id;
    }
    return '<div class="g-reval"><div>' + carteraReval() + "</div>" +
      "<div>" + detalleReval(c) + "</div></div>";
  }

  /* ------------------------------------- Eventos de revalidación ------- */
  function eventosReval() {
    if (pest !== "reval") return;

    $$("[data-r]").forEach(function (b) {
      b.onclick = function () {
        rSel = this.getAttribute("data-r");
        panelNeg = false;
        pinta();
        var h = $("#tReval");
        if (h) h.focus({ preventScroll:true });
        anuncia("Caso de " + persona(caso().per).n + ".");
      };
    });

    /* El oficio vive en Canalizaciones; se navega, no se cambia de pestaña. */
    $$("[data-ofi]").forEach(function (b) {
      b.onclick = function () {
        location.href = "canalizaciones.html?o=" +
          encodeURIComponent(this.getAttribute("data-ofi").replace(/^SFS\//, ""));
      };
    });

    var c = caso();
    if (!c) return;

    var bNeg = $("#btnNeg");
    if (bNeg) bNeg.onclick = function () {
      panelNeg = true;
      pinta();
      var h = $("#tNeg");
      if (h) { h.focus({ preventScroll:true }); h.scrollIntoView({ behavior:"smooth", block:"center" }); }
    };
    var bNo = $("#btnNegNo");
    if (bNo) bNo.onclick = function () { panelNeg = false; pinta(); };

    var bSi = $("#btnNegSi");
    if (bSi) bSi.onclick = function () {
      var inst = $("#nInstEdu").value.trim();
      var f    = $("#nFecEdu").value;
      var mot  = $("#nMotEdu").value;
      var det  = $("#nDetEdu").value.trim();
      if (!inst) { $("#nInstEdu").focus(); anuncia("Falta la institución."); return; }
      if (!mot)  { $("#nMotEdu").focus();  anuncia("Elige el motivo del catálogo."); return; }
      if (!det)  { $("#nDetEdu").focus();  anuncia("Falta describir cómo ocurrió."); return; }
      c.neg.push({ t:f + " " + hora(HOY), inst:inst, motivo:mot, detalle:det, hizo:"", oficio:null });
      panelNeg = false;
      pinta();
      anuncia("Negativa registrada. El caso queda sin reclamar hasta que se emita el oficio.");
    };

    /* Reclamar por oficio no abre un formulario en blanco: lleva al
       compositor con la plantilla de educación y el caso ya elegido, que es
       de donde salen el destinatario y el hecho que se cita. */
    var bOf = $("#btnOficioEdu");
    if (bOf) bOf.onclick = function () {
      /* Reclamar no abre un formulario en blanco: lleva a Canalizaciones con
         la plantilla de educación y este caso ya elegido, que es de donde
         salen el destinatario y el hecho que se cita. */
      try { sessionStorage.setItem("simh-caso-edu", c.id); } catch (e) { /* da igual */ }
      location.href = "canalizaciones.html?nuevo=educacion&caso=" + encodeURIComponent(c.id);
    };
  }

  /* ======================================================================
     Pintado y arranque
     ================================================================== */
  var rSel = null;             /* caso abierto */
  var panelNeg = false;        /* captura de una negativa */

  $("#avisoModCuerpo").innerHTML =
    '<div class="resumen-lista">' +
    '<div class="resumen-dato"><span class="r-lab">La educación básica no se revalida</span>' +
      '<span class="r-val">Una niña o un niño se inscribe aunque no traiga documentos y la escuela ' +
      'regulariza el expediente después. Condicionar la inscripción a papeles es ilegal, y es la ' +
      'negativa que este módulo registra (Acuerdo 286 de la SEP).</span></div>' +
    '<div class="resumen-dato"><span class="r-lab">La negativa es un registro, no una queja</span>' +
      '<span class="r-val">Una negativa verbal en una ventanilla no deja rastro. Sin fecha, ' +
      'institución, motivo de catálogo y qué se hizo, no hay nada que reclamar: para la autoridad ' +
      'educativa el hecho no ocurrió.</span></div>' +
    '<div class="resumen-dato"><span class="r-lab">Cada requisito dice qué bloquea</span>' +
      '<span class="r-val">Un requisito que no declara su consecuencia es una casilla más. Lo que ' +
      'la ventanilla necesita saber es si puede seguir sin él, y en básica casi siempre puede.' +
      '</span></div>' +
    '<div class="resumen-dato"><span class="r-lab">Reclamar es emitir un oficio</span>' +
      '<span class="r-val">El oficio se redacta en <a href="canalizaciones.html">Canalizaciones</a> ' +
      'citando la negativa registrada aquí. Este módulo no emite documentos: registra los hechos ' +
      'que los sostienen.</span></div>' +
    "</div>";

  function pinta() {
    $("#encAcc").innerHTML = "";
    $("#panel").innerHTML = vistaReval();
    eventosReval();
  }

  /* Atajos de revisión: ?r=r2 abre el caso con negativa sin reclamar,
     ?r=r1 el de educación básica. También acepta un folio de expediente. */
  var q = new URLSearchParams(location.search).get("r");
  if (q) {
    REVAL.forEach(function (c) {
      if (c.id === q || c.per.indexOf(q) >= 0) rSel = c.id;
    });
  }

  pinta();
})();
</script>
</body>
</html>
