<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revalidación y Acceso Educativo · SIAMH</title>
<link rel="icon" href="assets/img/simh-isotipo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/simh.css">
<style>
  /* ======================================================================
     REVALIDACIÓN Y ACCESO EDUCATIVO
     ================================================================== */
  /* Lista de cotejo: dos estados, PRESENTA / NO PRESENTA (22/09/2026).
     El estado viaja en glifo + palabra + color, nunca solo en color. */
  .coteja{display:inline-flex;border:1px solid var(--linea);border-radius:var(--radio-s);overflow:hidden;flex:none}
  .coteja button{min-height:36px;padding:0 12px;font-family:var(--f-texto);font-size:12.5px;font-weight:600;
    border:0;border-left:1px solid var(--linea);background:var(--blanco);color:var(--tinta);cursor:pointer}
  .coteja button:first-child{border-left:0}
  .coteja button:hover{background:var(--hueso-claro)}
  .coteja button[data-v="si"][aria-pressed="true"]{background:var(--jade);color:#fff}
  .coteja button[data-v="no"][aria-pressed="true"]{background:var(--guinda);color:#fff}
  .coteja-grande button{min-height:44px;padding:0 22px;font-size:13px}
  .coteja-grande button[aria-checked="true"]{background:var(--jade-900);color:#fff}
  .coteja-bloques{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:1100px){.coteja-bloques{grid-template-columns:1fr}}
  .coteja-enc{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding-bottom:8px;border-bottom:1px solid var(--linea)}
  .coteja-enc h4{margin:0;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
  .coteja-lista{list-style:none;margin:0;padding:0}
  .coteja-fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--linea-suave)}
  .coteja-fila:last-child{border-bottom:0}
  .coteja-t{font-size:13px;line-height:1.35;color:var(--tinta);min-width:0}

  .grupo-barreras{margin-bottom:16px}
  .grupo-barreras-tit{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--gris);
    letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .grid-barreras{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}

  .barrera-card{
    display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--linea-suave);
    border-radius:var(--radio-s);background:var(--blanco);cursor:pointer;transition:all .15s ease;
  }
  .barrera-card:hover{border-color:var(--jade-200);background:var(--jade-050)}
  .barrera-card.marcada{border-color:var(--guinda);background:var(--guinda-050)}
  .barrera-card input{margin-top:3px;accent-color:var(--guinda)}
  .barrera-txt{flex:1;min-width:0}
  .barrera-tit{display:block;font-size:13px;font-weight:700;color:var(--tinta);line-height:1.25}
  .barrera-desc{display:block;font-size:11.5px;color:var(--gris);margin-top:2px;line-height:1.35}

  .neg-item{display:flex;gap:11px;align-items:flex-start;padding:13px 0;
    border-bottom:1px solid var(--linea-suave)}
  .neg-item:last-child{border-bottom:0;padding-bottom:0}
  .neg-item > svg{width:18px;height:18px;flex:none;stroke-width:1.8;fill:none;margin-top:2px;
    stroke:var(--guinda)}
  .neg-item .n-tx{flex:1;min-width:0}
  .neg-item .n-t{display:block;font-size:13.5px;font-weight:700;color:var(--guinda-900);line-height:1.35}
  .neg-item .n-m{display:block;font-size:12.5px;color:var(--gris);margin-top:4px;line-height:1.5}
  .neg-item .n-m b{color:var(--tinta)}
  .neg-item .n-f{display:block;font-size:11.5px;color:var(--gris-claro);margin-top:4px;
    font-variant-numeric:tabular-nums}

  /* Registro de barreras dentro del diagnóstico (22/09/2026) */
  .barreras-reg{margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}

  .grid-oficio-educacion{display:grid;grid-template-columns:1.15fr 0.85fr;gap:20px;align-items:start}
  @media (max-width:1100px){.grid-oficio-educacion{grid-template-columns:1fr}}
</style>
</head>

<script>
(function () {
  "use strict";
  SIMH.chrome("revalida");
  var ico = SIMH.icono, esc = SIMH.esc;

  /* Restricción por sede (22/09/2026): el módulo solo está habilitado para
     la Secretaría de la Frontera Sur, Tuxtla y quien administra. El menú ya
     no dibuja la entrada; si se llega por URL, se enuncia la regla en lugar
     de mostrar los casos. */
  if (!SIMH.accesoSede("revalida")) {
    var yoS = SIMH.sesion();
    document.querySelector(".enc-acc").innerHTML = "";
    document.getElementById("avisoMod").hidden = true;
    document.getElementById("panel").innerHTML =
      '<div class="accion tibia">' + ico("candado") +
        '<div class="a-tx"><span class="a-t">La Revalidación de Estudios no está habilitada en tu sede</span>' +
        '<span class="a-n">Este módulo solo opera en ' + SIMH.sedesDe("revalida").map(esc).join(" y ") +
        ', y para quien administra el sistema. Tu cuenta entra desde <b>' + esc(SIMH.SEDES[yoS.sede].t) +
        '</b>. Si una persona necesita revalidar estudios, canalízala a una de esas sedes.</span></div>' +
        '<div class="a-acc"><a class="btn btn-secundario btn-s" href="canalizaciones.html">' + ico("oficios") +
          'Ir a Canalizaciones</a></div></div>';

  var dias = D.dias, edad = D.edad, plural = D.plural;
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  $("#btnXls").innerHTML    = ico("excel") + "Exportar reporte (Excel)";

  /* ======================================================================
     1. Marcadores de Barreras y Problemáticas de Acceso a la Educación
     ================================================================== */
  var BARRERAS_GRUPO = [

        { id:"sin_acta", t:"Sin acta de nacimiento apostillada",

          ruta:"La escuela inscribe provisionalmente mientras la Secretaría y RENAPO emiten la CURP temporal." },
        { id:"sin_boletas", t:"Sin boletas de grados anteriores",

          obliga: false,
          ruta:"La escuela aplica examen de ubicación global para asignar el grado correspondiente sin frenar el ingreso." },
        { id:"sin_apostilla", t:"Sin apostilla (Media Superior / Superior)",
          desc:"Certificado de bachillerato o licenciatura sin apostilla.",
          obliga: true,
          ruta:"Para bachillerato procede revalidación parcial por cotejo. En superior se orienta trámite consular." },
        { id:"idioma", t:"Documentos en lengua extranjera",
          desc:"Constancias redactadas en idioma distinto al español.",
          obliga: true,
          ruta:"Canalización para traducción pericial oficial o apoyo del Centro de Lenguas.",
          canaliza:{ inst:"Perito Traductor Oficial · Poder Judicial", motivo:"Traducción pericial de documentos de estudios" } }
      ]
    },
    {
      grupo: "Barreras de atención y en centros educativos",
      items: [
        { id:"neg_inscripcion", t:"Barrera de inscripción en escuela pública",
          desc:"El director o personal del plantel rechazó al estudiante por ser extranjero.",
          obliga: true,
          ruta:"Infracción al Art. 3° CPEUM y Acuerdo 286. Emisión inmediata de Oficio de Exhorto e intervención a la Secretaría de Educación.",
          canaliza:{ inst:"Secretaría de Educación del Estado · Unidad de Inclusión", motivo:"Exhorto por barrera indebida de inscripción escolar (Acuerdo 286 SEP)" } },
        { id:"cobro_cuota", t:"Condicionamiento a cuotas 'voluntarias'",
          desc:"El plantel exige pago de cuotas escolares como requisito de admisión.",
          obliga: true,
          ruta:"La educación pública es gratuita. Se genera intervención ante la Supervisión de Zona Escolar.",
          canaliza:{ inst:"Supervisión de Zona Escolar", motivo:"Intervención por condicionamiento de inscripción a cuotas económicas" } },
        { id:"sin_cupo", t:"Rechazo verbal por 'falta de cupo'",
          desc:"Niegan el acceso sin otorgar oficio de rechazo ni reubicación.",
          obliga: true,
          ruta:"Exigir el rechazo por escrito y solicitar reubicación oficial en escuela con turno disponible.",
          canaliza:{ inst:"Supervisión de Zona Escolar", motivo:"Solicitud de garantía de cupo escolar en plantel cercano" } }
      ]
    },
    {
      grupo: "Condiciones de Vulnerabilidad y Rezago",
      items: [
        { id:"rezago", t:"Rezago escolar de 2 o más años",
          desc:"Estudiante desfasado en edad respecto al grado escolar.",
          obliga: false,
          ruta:"Canalización a programas de nivelación pedagógica acelerada o sistema de educación para adultos (INEA).",
          canaliza:{ inst:"Instituto de Educación para Jóvenes y Adultos (INEA)", motivo:"Diagnóstico pedagógico y nivelación de educación básica" } },
        { id:"nee", t:"Discapacidad / Necesidad Educativa Especial",
          desc:"Requiere apoyos específicos o adecuaciones curriculares.",
          obliga: true,
          ruta:"Canalización a Unidad de Servicios de Apoyo a la Educación Regular (USAER) o Centro de Atención Múltiple (CAM).",
          canaliza:{ inst:"Dirección de Educación Especial (USAER/CAM)", motivo:"Valoración psicopedagógica y ajustes razonables en aula" } },
        { id:"nnasep", t:"NNA no acompañado o separado",
          desc:"Menor de edad sin tutor legal en territorio nacional.",
          obliga: true,
          ruta:"Aviso obligatorio a la Procuraduría Regional de Protección de NNA dentro de las primeras 24 h.",
          canaliza:{ inst:"Procuraduría de Protección de NNA", motivo:"Representación jurídica y restitución del derecho a la educación de NNA" } }
      ]
    }
  ];

  var BARRERAS_IDX = {};
  BARRERAS_GRUPO.forEach(function (g) {
    g.items.forEach(function (b) { BARRERAS_IDX[b.id] = b; });
  });

  /* ======================================================================
     2. Lista de cotejo por tipo de escuela
     ------------------------------------------------------------------
     Pedido de la Dirección (22/09/2026): el capturista solo marca si la
     persona PRESENTA o NO PRESENTA cada documento. Se retiraron las
     columnas "Quién lo emite" e "Impacto legal" y el estado de cuatro
     valores (reunido · en trámite · falta · no aplica): en ventanilla lo
     que se verifica es si el papel está en la mano o no.

     El formulario se segmenta por TIPO DE ESCUELA —sostenimiento
     (pública / privada) y nivel— porque cambian los documentos y los
     trámites: una privada pide carta de no adeudo y hay que verificar su
     RVOE; una pública no.
     ================================================================== */
  var NIVELES = {
    basica:  { t:"Educación básica · Preescolar, primaria y secundaria" },
    media:   { t:"Media superior · Bachillerato" },
    superior:{ t:"Superior · Licenciatura o técnico superior" }
  };

  var SOSTENIMIENTO = {
    publica: { t:"Pública" },
    privada: { t:"Privada" }
  };

  /* Documentos de cada nivel; `solo` restringe uno a un sostenimiento. */
  var DOCS_ESC = {
    basica: [
      { id:"acta",    t:"Acta de nacimiento o documento de identidad" },
      { id:"curp",    t:"CURP" },
      { id:"boletas", t:"Boletas o constancia de estudios del país de origen" },
      { id:"domic",   t:"Comprobante de domicilio" },
      { id:"noadeudo",t:"Carta de no adeudo de la escuela anterior", solo:"privada" }
    ],
    media: [
      { id:"cert",    t:"Certificado o constancia de estudios de origen" },
      { id:"apost",   t:"Apostilla o legalización del certificado" },
      { id:"trad",    t:"Traducción por perito autorizado" },
      { id:"ident",   t:"Identificación oficial vigente" },
      { id:"curp",    t:"CURP" },
      { id:"pago",    t:"Comprobante de pago de derechos" },
      { id:"noadeudo",t:"Carta de no adeudo de la escuela anterior", solo:"privada" }
    ],
    superior: [
      { id:"cert",    t:"Título, certificado o constancia de estudios" },
      { id:"plan",    t:"Plan de estudios y calificaciones por materia" },
      { id:"apost",   t:"Apostilla o legalización" },
      { id:"trad",    t:"Traducción por perito autorizado" },
      { id:"ident",   t:"Identificación oficial vigente" },
      { id:"curp",    t:"CURP" },
      { id:"pago",    t:"Comprobante de pago de derechos" }
    ]
  };

  /* Trámites asociados a cada tipo de escuela. */
  var TRAMITES = {
    basica: [
      { id:"insc",   t:"Solicitud de inscripción en el plantel" },
      { id:"ubica",  t:"Examen o valoración de ubicación de grado" },
      { id:"ctrl",   t:"Alta en el sistema de control escolar", solo:"publica" },
      { id:"rvoe",   t:"Verificación de la incorporación del plantel ante la SEP", solo:"privada" },
      { id:"cuota",  t:"Acuerdo de cuota de inscripción con el plantel", solo:"privada" }
    ],
    media: [
      { id:"solrev", t:"Solicitud de revalidación ante el Departamento de Revalidación" },
      { id:"cotejo", t:"Cotejo de materias acreditadas" },
      { id:"insc",   t:"Inscripción en el plantel" },
      { id:"rvoe",   t:"Verificación del RVOE del plantel", solo:"privada" }
    ],
    superior: [
      { id:"solrev", t:"Solicitud de revalidación o equivalencia de estudios" },
      { id:"dict",   t:"Dictamen por materias contra el plan de estudios" },
      { id:"insc",   t:"Inscripción en la institución" },
      { id:"rvoe",   t:"Verificación del RVOE de la institución", solo:"privada" },
      { id:"cedula", t:"Trámite de cédula profesional (si va a ejercer)" }
    ]
  };

  function aplica(lista, sost) {
    return (lista || []).filter(function (x) { return !x.solo || x.solo === sost; });
  }

  /* Los casos anteriores se capturaron con cuatro estados; al pasar a la
     lista de cotejo, solo "reunido" cuenta como PRESENTA. "En trámite" no
     está en la mano: NO PRESENTA. "No aplica" queda sin marcar. */
  function normaliza(c) {
    if (!c.sost) c.sost = "publica";
    if (!c.doc) {
      c.doc = {};
      Object.keys(c.req || {}).forEach(function (k) {
        var v = c.req[k];
        if (v === "si") c.doc[k] = "si";
        else if (v === "falta" || v === "tramite") c.doc[k] = "no";
      });
    }
    if (!c.tram) c.tram = {};
    return c;
  }

  var MOT_NEG = [
    "Condicionan la inscripción a documentos que la norma no exige",
    "Se niegan a recibir la solicitud",
    "Exigen apostilla no exigible para el trámite solicitado",
    "Condicionan el trámite a un pago sin informar de la exención",
    "Argumentan falta de cupo sin darlo por escrito",
    "Piden acreditar situación migratoria regular"
  ];

  /* ======================================================================
     3. Cartera de Casos Educativos Vinculada a las Personas
     ================================================================== */
  var CASOS = [
    {
      perId: "SIAMH-2026-TAP-0408",
      nivel: "basica",
      destino: "Inscripción a 2.º de primaria en el ciclo en curso",
      inst: "Escuela Primaria Federal Belisario Domínguez · Tapachula",
      fechaApertura: "24/08/2026",
      limite: "01/09/2026",
      limiteTxt: "Inicio del ciclo escolar",
      barreras: ["sin_acta", "neg_inscripcion"],
      req: { valora:"falta", acta:"falta", curp:"tramite", boletas:"na" },
      neg: [
        { t:"2026-08-26 09:20", inst:"Escuela Primaria Federal Belisario Domínguez",
          motivo:"Condicionan la inscripción a documentos que la norma no exige",
          detalle:"La dirección del plantel pidió CURP y acta de nacimiento apostillada como condición para recibir la solicitud de inscripción.",
          hizo:"Se emitió oficio a la Secretaría de Educación del Estado.",
          oficio:"SFS/SMH/0944/2026" }
      ],
      can: [
        { fecha:"26/08/2026", inst:"Secretaría de Educación del Estado · Unidad de Inclusión",
          motivo:"Exhorto por barrera indebida de inscripción escolar (Acuerdo 286 SEP)",
          of:"SFS/SMH/0944/2026", est:"Emitido · en seguimiento" }
      ]
    },
    {
      perId: "SIAMH-2026-TAP-0410",
      nivel: "media",
      destino: "Revalidación parcial de 1.º y 2.º de bachillerato",
      inst: "Secretaría de Educación del Estado · Departamento de Revalidación",
      fechaApertura: "25/08/2026",
      limite: "15/09/2026",
      limiteTxt: "Cierre de inscripciones extemporáneas",
      barreras: ["sin_apostilla", "neg_inscripcion"],
      req: { cert:"si", apost:"falta", trad:"na", ident:"si", curp:"si", pago:"tramite" },
      neg: [
        { t:"2026-08-27 13:10", inst:"Secretaría de Educación del Estado",
          motivo:"Exigen apostilla no exigible para el trámite solicitado",
          detalle:"La ventanilla rechazó la solicitud de revalidación parcial por no traer el certificado apostillado, siendo que la parcial se resuelve por cotejo.",
          hizo:"", oficio:null }
      ],
      can: []
    },
    {
      perId: "SIAMH-2026-SUC-0177",
      nivel: "superior",
      destino: "Revalidación de licenciatura en enfermería para ejercer en Chiapas",
      inst: "Secretaría de Educación del Estado · Departamento de Revalidación",
      fechaApertura: "19/08/2026",
      limite: "",
      limiteTxt: "",
      barreras: ["idioma"],
      req: { cert:"si", plan:"si", apost:"si", trad:"tramite", ident:"si", curp:"si", pago:"falta" },
      neg: [],
      can: []
    },
    {
      perId: "SIAMH-2026-TAP-0411",
      nivel: "superior",
      destino: "Revalidación de estudios técnicos en construcción",
      inst: "Secretaría de Educación del Estado · Departamento de Revalidación",
      fechaApertura: "22/08/2026",
      limite: "",
      limiteTxt: "",
      barreras: ["idioma", "sin_apostilla"],
      req: { cert:"si", plan:"falta", apost:"falta", trad:"falta", ident:"si", curp:"si", pago:"na" },
      neg: [],
      can: []
    },
    {
      perId: "SIAMH-2026-FCO-0094",
      nivel: "superior",
      destino: "Revalidación de licenciatura en contaduría",
      sost: "privada",
      inst: "Secretaría de Educación del Estado · Departamento de Revalidación",
      fechaApertura: "05/08/2026",
      limite: "",
      limiteTxt: "",
      resuelto: "24/08/2026",
      barreras: [],
      req: { cert:"si", plan:"si", apost:"si", trad:"si", ident:"si", curp:"si", pago:"si" },
      neg: [],
      can: []
    },
    {
      perId: "SIAMH-2026-TAP-0412",
      nivel: "basica",
      destino: "Acompañamiento para ingreso a secundaria técnica",
      inst: "Escuela Secundaria Técnica Núm. 3 · Tapachula",
      fechaApertura: "20/08/2026",
      limite: "01/09/2026",
      limiteTxt: "Inicio del ciclo escolar",
      barreras: ["sin_boletas"],
      req: { valora:"tramite", acta:"si", curp:"si", boletas:"falta" },
      neg: [],
      can: []
    }
  ];

  /* Lo que "Descartar" restaura: la ficha tal como se guardó. */
  function foto(c) {
    return JSON.stringify({ nivel:c.nivel, sost:c.sost, inst:c.inst, destino:c.destino,
      doc:c.doc, tram:c.tram, barreras:c.barreras });
  }

  function getCaso(per) {
    var c = CASOS.find(function (x) { return x.perId === per.f; });
    if (!c) {
      /* La edad sale de la fecha de nacimiento: `per.edad` no existe en el
         catálogo, y leerlo mandaba a toda persona sin caso a "superior". */
      var e = edad(per.nac);
      c = {
        perId: per.f,
        nivel: e < 15 ? "basica" : (e < 18 ? "media" : "superior"),
        destino: "Acompañamiento educativo y acceso escolar",

    /* ---------------- 4. Ficha del Trámite y Lista de Cotejo ----------- */
    var docs = aplica(DOCS_ESC[c.nivel], c.sost);
    var trams = aplica(TRAMITES[c.nivel], c.sost);

      var si = 0, no = 0;

              (v === "no" ? "✕ " : "") + etNo + '</button>' +

          '<div class="coteja-enc"><h4>Trámites asociados · escuela ' + esc(SOSTENIMIENTO[c.sost].t.toLowerCase()) + '</h4>' +
            '<span class="txt-min">' + ct.si + ' realizado' + (ct.si === 1 ? '' : 's') + ' · ' + ct.no + ' pendiente' + (ct.no === 1 ? '' : 's') +
              (ct.sin ? ' · ' + ct.sin + ' sin marcar' : '') + '</span></div>' +
          listaCotejo(trams, c.tram, "data-tram", "Realizado", "Pendiente") +

      '</div>' +

      '<div class="flex gap-8" style="margin-top:16px;justify-content:flex-end">' +
        (c.sucio ? '<button class="btn btn-secundario btn-s" type="button" id="btnDescartar">' + ico("cerrar") + 'Descartar</button>' : '') +
        '<button class="btn btn-primario btn-s" type="button" id="btnGuardarVal">' + ico("guardar") + 'Guardar ficha del trámite</button>' +
      '</div>' +
    '</div>';

    /* ---------------- 6. Generador de Oficio de Canalización / Exhorto -- */
    html += '<div class="tarjeta">' +
      '<div class="tarjeta-enc">' +
        '<div>' +
          '<h3 style="margin:0">Generar Oficio de Intervención / Canalización Educativa</h3>' +
          '<span class="txt-min">Emite el documento institucional que defiende el acceso escolar (se vincula a Canalizaciones)</span>' +
        '</div>' +
        '<a class="btn btn-secundario btn-s" href="canalizaciones.html?pl=educacion" title="Ver todos los oficios de educación en el módulo de Canalizaciones">' +
          ico("oficios") + 'Ver en Canalizaciones' +
        '</a>' +
      '</div>' +

      '<div class="grid-oficio-educacion">' +
        '<div>' +
          '<div class="fila">' +
            '<div class="campo" style="flex:1.5">' +
              '<label for="ofDest">Autoridad o Plantel Destinatario <span class="req">*</span></label>' +
              '<input type="text" id="ofDest" value="' + esc(c.inst || "Secretaría de Educación del Estado · Dirección de Educación Básica") + '">' +
            '</div>' +
            '<div class="campo" style="flex:1">' +
              '<label for="ofAsunto">Asunto <span class="req">*</span></label>' +
              '<input type="text" id="ofAsunto" value="' + esc(c.asuntoOf || "") + '" placeholder="Escribe el asunto del oficio">' +
            '</div>' +

    $("#panel").innerHTML = html;

  /* ======================================================================
     5. Eventos del Detalle y Captura
     ================================================================== */
  function eventosDetalle() {
    var per = D.PERS[selPerIdx];
    var c = getCaso(per);
    var N = NIVELES[c.nivel] || NIVELES.basica;

    /* Pintar la hoja de vista previa en tiempo real */
    function pintarHojaOficio() {
      var dest = $("#ofDest") ? $("#ofDest").value.trim() : "Autoridad Destinataria";
      if ($("#ofAsunto")) c.asuntoOf = $("#ofAsunto").value;
      var asunto = (c.asuntoOf || "").trim() || "— asunto —";
      var cita = $("#ofCita") ? $("#ofCita").value : "";
      var citaTxt = cita ? cita.split("-").reverse().join("/") : "inmediata";
      var acomp = $("#ofAcomp") ? $("#ofAcomp").value : "Sí, personal de la Secretaría";
      var fund = $("#ofFundamento") ? $("#ofFundamento").value.trim() : "";
      var folioPrevio = "— se asigna al firmar —";

      var hoja = $("#hojaOficio");
      if (!hoja) return;

      /* Membrete y composición del formato oficial (22/09/2026). */
      hoja.innerHTML = SIMH.hojaSFS({
        sello: '<div class="o-sello bor">' + ico("editar") + 'Borrador en edición · el folio se asigna al firmar</div>',
        fecha: SIMH.fechaLarga(HOY) + ".",
        asunto: esc(asunto),
        dest: esc(dest),
        cuerpo: [
          'Por medio del presente, la <b>Subsecretaría de Movilidad Humana a través de la Secretaría de la Frontera Sur</b>, en el ámbito de sus atribuciones, se permite intervenir en favor de la persona <span class="o-var">' + esc(per.n) + '</span>, de <span class="o-var">' + edad(per.nac) + ' años</span> de edad, de nacionalidad <span class="o-var">' + esc(per.pais) + '</span>, con expediente <span class="o-var">' + esc(per.f) + '</span>' + (per.curp ? ' y CURP <span class="o-var">' + esc(per.curp) + '</span>' : '') + '.',
          esc(fund),
          '<b>Fecha de atención o gestión:</b> ' + esc(citaTxt) + '. <b>Acompañamiento:</b> ' + esc(acomp) + '.',
          'Agradeciendo de antemano su atención y colaboración, quedamos a disposición para proporcionar la información y documentación necesaria para el seguimiento del caso.',
          'Sin otro particular, reciba un cordial saludo.'
        ]
      });
      SIMH.paginar(hoja);
    }

    /* Eventos para actualizar la vista previa en vivo */
    ["#ofDest", "#ofAsunto", "#ofCita", "#ofAcomp", "#ofFundamento"].forEach(function (sel) {
      var el = $(sel);
      if (el) {
        el.addEventListener("input", pintarHojaOficio);
        el.addEventListener("change", pintarHojaOficio);
      }
    });

    pintarHojaOficio();

    /* Marcadores de barreras */
    $$("[data-barrera]").forEach(function (chk) {
      chk.onchange = function () {
        var id = this.getAttribute("data-barrera");
        var idx = c.barreras.indexOf(id);
        if (this.checked && idx < 0) c.barreras.push(id);
        if (!this.checked && idx >= 0) c.barreras.splice(idx, 1);
        c.sucio = true;
        pintarDetalle();
      };
    });

    /* Pre-cargar en oficio desde rutas */
    $$("[data-precan]").forEach(function (btn) {
      btn.onclick = function () {
        var id = this.getAttribute("data-precan");
        var b = BARRERAS_IDX[id];
        if (!b || !b.canaliza) return;
        var od = $("#ofDest"), oa = $("#ofAsunto");
        if (od) od.value = b.canaliza.inst;
        if (oa) oa.value = b.canaliza.motivo;
        $("#ofDest").focus();
        $("#ofDest").scrollIntoView({ behavior:"smooth", block:"center" });
        pintarHojaOficio();
        if (SIMH.toast) SIMH.toast("Datos cargados en el formulario de oficio", "info");
      };
    });

    /* Cambio de nivel educativo */
    var fNivel = $("#fNivel");
    if (fNivel) {
      fNivel.onchange = function () {
        c.nivel = this.value;
        c.sucio = true;
        pintarDetalle();
      };
    }

    /* Lista de cotejo: un clic marca; otro clic sobre la misma opción la
       desmarca, para poder corregir un "presenta" puesto por error. */
    function marca(mapa, id, v) {
      if (mapa[id] === v) delete mapa[id]; else mapa[id] = v;
      c.sucio = true;
      pintarDetalle();
    }
    $$("[data-doc]").forEach(function (b) {
      b.onclick = function () { marca(c.doc, this.getAttribute("data-doc"), this.getAttribute("data-v")); };
    });
    $$("[data-tram]").forEach(function (b) {
      b.onclick = function () { marca(c.tram, this.getAttribute("data-tram"), this.getAttribute("data-v")); };
    });
    $$("[data-sost]").forEach(function (b) {
      b.onclick = function () {
        if (c.sost === this.getAttribute("data-sost")) return;
        c.sost = this.getAttribute("data-sost");
        c.sucio = true;
        pintarDetalle();
      };
    });

    /* Lo escrito en plantel y objetivo se conserva en el caso mientras se
       marca la lista: cada marca repinta la tarjeta. */
    ["#fInst", "#fDestino"].forEach(function (sel) {
      var el = $(sel);
      if (el) el.oninput = function () {
        if (sel === "#fInst") c.inst = this.value; else c.destino = this.value;
        if (!c.sucio) {
          c.sucio = true;
          var chip = this.closest(".tarjeta").querySelector(".tarjeta-enc .chip");
          if (chip) { chip.className = "chip chip-rosa"; chip.innerHTML = ico("reloj") + "Cambios sin guardar"; }
        }
      };
    });

    /* Guardar valoración */
    var bg = $("#btnGuardarVal");
    if (bg) {
      bg.onclick = function () {
        c.inst = ($("#fInst") ? $("#fInst").value : c.inst).trim();
        c.destino = ($("#fDestino") ? $("#fDestino").value : c.destino).trim();
        c.sucio = false;
        c.guardado = foto(c);
        pintarDetalle();
        if (SIMH.toast) SIMH.toast("Ficha del trámite guardada en el expediente", "ok");
      };
    }

    /* Descartar: vuelve a lo último guardado, no solo apaga el aviso. */
    var bd = $("#btnDescartar");
    if (bd) {
      bd.onclick = function () {
        if (c.guardado) {
          var g = JSON.parse(c.guardado);
          Object.keys(g).forEach(function (k) { c[k] = g[k]; });
        }
        c.sucio = false;
        pintarDetalle();
      };
    }

    /* Abrir panel de negativa */
    var bon = $("#btnAbrirNeg");
    if (bon) {
      bon.onclick = function () {
        panelNegAbierto = true;
        pintarDetalle();
        var ni = $("#nInst");
        if (ni) ni.focus();
      };
    }
    var bcn = $("#btnCancelaNeg");
    if (bcn) {
      bcn.onclick = function () {
        panelNegAbierto = false;
        pintarDetalle();
      };
    }

    /* Guardar negativa */
    var bgn = $("#btnGuardarNeg");
    if (bgn) {
      bgn.onclick = function () {
        var inst = $("#nInst") ? $("#nInst").value.trim() : "";
        var fec = $("#nFec") ? $("#nFec").value : HOY.slice(0, 10);
        var mot = $("#nMot") ? $("#nMot").value : "";
        var det = $("#nDet") ? $("#nDet").value.trim() : "";
        var obs = $("#nObs") ? $("#nObs").value.trim() : "";
        if (!inst || !mot || !det) {
          alert("Por favor completa la institución, el motivo y el detalle de la barrera.");
          return;
        }
        c.neg.push({
          t: fec + " " + hora(HOY),
          inst: inst,
          motivo: mot,
          detalle: det,
          obs: obs,
          hizo: "",
          oficio: null
        });
        if (c.barreras.indexOf("neg_inscripcion") < 0) c.barreras.push("neg_inscripcion");
        panelNegAbierto = false;
        pintarDetalle();
        if (SIMH.toast) SIMH.toast("Barrera registrada en el historial", "alerta");
      };
    }

    /* Reclamar desde botón rápido o lista */
    var brr = $("#btnReclamarRapido");
    if (brr) {
      brr.onclick = function () {
        var ofd = $("#ofDest"), ofa = $("#ofAsunto");
        if (ofd) ofd.value = "Secretaría de Educación del Estado · Unidad de Inclusión";
        if (ofa) ofa.value = "Exhorto por barrera de inscripción (Acuerdo 286 SEP)";
        $("#ofDest").focus();
        $("#ofDest").scrollIntoView({ behavior:"smooth", block:"center" });
        pintarHojaOficio();
      };
    }

    /* Generar oficio */
    var bgo = $("#btnGenerarOficio");
    if (bgo) {
      bgo.onclick = function () {
        var dest = $("#ofDest") ? $("#ofDest").value.trim() : "";
        var asunto = $("#ofAsunto") ? $("#ofAsunto").value.trim() : "";
        var cita = $("#ofCita") ? $("#ofCita").value : "";
        var citaTxt = cita ? cita.split("-").reverse().join("/") : "inmediata";
        var acomp = $("#ofAcomp") ? $("#ofAcomp").value : "Sí, personal de la Secretaría";
        var fund = $("#ofFundamento") ? $("#ofFundamento").value.trim() : "";
        if (!dest) {
          alert("Indica la autoridad destinataria del oficio.");
          return;
        }
        if (!asunto) {
          alert("Escribe el asunto del oficio.");
          $("#ofAsunto").focus();
          return;
        }
        var folio = folioOficio();
        var nuevoCan = {
          fecha: fecha(HOY.slice(0, 10)),
          inst: dest,
          motivo: asunto,
          of: folio,
          est: "Emitido · en seguimiento"
        };
        c.can.push(nuevoCan);

        // Si hay una negativa abierta, vincularla
        var na = c.neg.find(function (x) { return !x.oficio; });
        if (na) {
          na.oficio = folio;
          na.hizo = "Se emitió oficio de intervención legal ante " + dest + ".";
        }

        // Crear objeto completo para el módulo de Canalizaciones
        var ofiCompleto = {
          id: "o_edu_" + Date.now(),
          ref: SIMH.refBorrador(),
          folio: folio,
          pl: "educacion",
          est: "emitido",
          asunto: asunto,
          per: per.f,
          dest: { inst: dest, cargo: "Dirección / Autoridad Educativa", mun: per.mun || "Tapachula" },
          origen: "oficios",
          folioDep: "VENT-" + (per.mun ? per.mun.slice(0,3).toUpperCase() : "TAP") + "/2026/" + Math.floor(100 + Math.random()*900),
          creado: { por: D.YO.n, rol: D.YO.rol, t: D.HOY },
          firmado: { por: D.DIRECTOR.n, cargo: D.DIRECTOR.cargo, t: D.HOY },
          acusePlazo: "2026-09-05",
          datos: {
            nivel: N.t,
            plantel: dest,
            negativa: asunto,
            pide: fund,
            cita: citaTxt,
            acomp: acomp
          }
        };

        // Guardar en localStorage para que aparezca en canalizaciones.html
        try {
          var lista = JSON.parse(localStorage.getItem("SIAMH_OFICIOS_EXTRA") || "[]");
          lista.unshift(ofiCompleto);
          localStorage.setItem("SIAMH_OFICIOS_EXTRA", JSON.stringify(lista));
        } catch(e) {}

        pintarDetalle();
        if (SIMH.toast) {
          SIMH.toast("Oficio " + folio + " generado y registrado en Canalizaciones", "ok");
        }
      };
    }
  }

  /* ======================================================================
     6. Gestor de Caso (Drawer & Atajos)
     ================================================================== */
  var gestor = SIMH.gestorCaso({
    items: D.PERS,
    indiceInicial: selPerIdx,
    titulo: "Seleccionar Estudiante",
    placeholder: "Buscar por nombre, folio o CURP...",
    filtraItem: function (p, txt) {
      if (!txt) return true;
      var t = (p.n + " " + p.f + " " + p.curp + " " + p.pais + " " + p.mun).toLowerCase();
      return t.indexOf(txt.toLowerCase()) >= 0;
    },
    renderItem: function (p, esActivo, idx) {
      var c = getCaso(p);
      var na = c.neg.find(function (x) { return !x.oficio; });
      return '<button type="button" class="drawer-item' + (esActivo ? ' activo' : '') + '" data-idx="' + idx + '">' +
        SIMH.fotoPersona(p.foto ? p.f : "", p.n, "drawer-item-avatar", p.ini) +
        '<div class="drawer-item-txt">' +
          '<span class="drawer-item-nom">' + esc(p.n) + '</span>' +
          '<span class="drawer-item-sub">Folio ' + esc(p.f) + ' · ' + edad(p.nac) + ' años · ' + esc(p.pais) + '</span>' +
        '</div>' +
        (na ? '<span class="chip chip-guinda">!</span>' : '') +
      '</button>';
    },
    onSelect: function (p, idx) {
      selPerIdx = idx;
      panelNegAbierto = false;
      pintarDetalle();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  /* Aviso explicativo */
  $("#avisoModCuerpo").innerHTML =
    '<div class="resumen-lista">' +
      '<div class="resumen-dato"><span class="r-lab">Prohibición de exigir apostilla en básica</span>' +
        '<span class="r-val">Condicionar el acceso a apostillas, cuotas o regularidad migratoria es un acto violatorio de derechos humanos. Este módulo permite registrar la barrera con fecha, plantel y testimonio para sustentar el oficio de intervención.</span></div>' +
      '<div class="resumen-dato"><span class="r-lab">Revalidación en Media Superior y Superior</span>' +
        '<span class="r-val">En bachillerato y universidad se realiza el cotejo de materias y planes de estudio. Para revalidación parcial procede la resolución mediante cotejo directo sin exigir apostilla previa.</span></div>' +
    '</div>';

  pintarDetalle();

  /* Eventos globales */
  document.addEventListener("click", function (e) {
    if (e.target.closest("#btnAbrirSelector")) {
      gestor.abrir();
    } else if (e.target.closest("#btnCasoAnt")) {
      gestor.anterior();
    } else if (e.target.closest("#btnCasoSig")) {
      gestor.siguiente();
    }
  });
})();
</script>
</body>
</html>
