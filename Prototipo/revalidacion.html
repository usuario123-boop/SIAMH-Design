<!DOCTYPE html>
<html lang="es-MX">

<style>
  /* ======================================================================
     REVALIDACIÓN Y ACCESO EDUCATIVO
     ================================================================== */
  .req-tabla{width:100%;border-collapse:collapse}
  .req-tabla th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;
    color:var(--gris);letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--linea);background:var(--hueso-claro)}
  .req-tabla td{padding:12px;border-bottom:1px solid var(--linea-suave);vertical-align:top;font-size:13px}
  .req-tabla tr:last-child td{border-bottom:0}
  .req-tabla tr:hover td{background:rgba(0,152,135,.02)}

  .sel-req-estado{
    height:32px;padding:0 8px;border:1px solid var(--linea);border-radius:var(--radio-s);
    font-family:var(--f-texto);font-size:12.5px;font-weight:600;background:var(--blanco);
    color:var(--tinta);cursor:pointer;
  }
  .sel-req-estado.si{border-color:var(--jade);color:var(--jade-900);background:var(--jade-050)}
  .sel-req-estado.tramite{border-color:var(--rosa);color:#7d0140;background:var(--rosa-050)}
  .sel-req-estado.falta{border-color:var(--guinda);color:var(--guinda-900);background:var(--guinda-050)}

  .grupo-barreras{margin-bottom:16px}
  .grupo-barreras-tit{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--gris);
    letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .grid-barreras{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}

  .barrera-card{
    display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--linea-suave);
    border-radius:var(--radio-s);background:var(--blanco);cursor:pointer;transition:all .15s ease;
  }
  .barrera-card:hover{border-color:var(--jade-200);background:var(--jade-050)}
  .barrera-card.marcada{border-color:var(--guinda);background:var(--guinda-050)}
  .barrera-card input{margin-top:3px;accent-color:var(--guinda)}
  .barrera-txt{flex:1;min-width:0}
  .barrera-tit{display:block;font-size:13px;font-weight:700;color:var(--tinta);line-height:1.25}
  .barrera-desc{display:block;font-size:11.5px;color:var(--gris);margin-top:2px;line-height:1.35}

  .neg-item{display:flex;gap:11px;align-items:flex-start;padding:13px 0;
    border-bottom:1px solid var(--linea-suave)}
  .neg-item:last-child{border-bottom:0;padding-bottom:0}
  .neg-item > svg{width:18px;height:18px;flex:none;stroke-width:1.8;fill:none;margin-top:2px;
    stroke:var(--guinda)}
  .neg-item .n-tx{flex:1;min-width:0}
  .neg-item .n-t{display:block;font-size:13.5px;font-weight:700;color:var(--guinda-900);line-height:1.35}
  .neg-item .n-m{display:block;font-size:12.5px;color:var(--gris);margin-top:4px;line-height:1.5}
  .neg-item .n-m b{color:var(--tinta)}
  .neg-item .n-f{display:block;font-size:11.5px;color:var(--gris-claro);margin-top:4px;
    font-variant-numeric:tabular-nums}
</style>
</head>

      { id:"curp",  t:"CURP",

      { id:"pago",  t:"Pago de derechos",
        quien:"La persona", bloq:"Hay exención para personas en movilidad." }
    ]

    "Exigen apostilla no exigible para el trámite solicitado",

        can: []

        '<div class="a-tx"><span class="a-t">Negativa escolar registrada sin reclamar ante la autoridad</span>' +
        '<span class="a-n">' + esc(na.inst) + ' rechazó la atención: "' + esc(na.motivo) + '". ' + esc(na.detalle) +
        ' Mientras no se emita el oficio formal, la negativa queda impune y el derecho a la educación frenado.</span></div>' +
        '<div class="a-acc"><button class="btn btn-peligro btn-s" type="button" id="btnReclamarRapido">' +
        ico("oficios") + 'Generar oficio de reclamo</button></div></div>';
    } else if (c.barreras.length) {
      html += '<div class="accion tibia">' + ico("info") +
        '<div class="a-tx"><span class="a-t">' + plural(c.barreras.length, "problemática detectada", "problemáticas detectadas") + ' en el acceso educativo</span>' +
        '<span class="a-n">Se activaron las rutas legales de solución institucional: consulta los marcadores y genera las intervenciones correspondientes.</span></div></div>';
    }

    /* ---------------- 3. Marcadores de Barreras y Problemáticas -------- */
    html += '<div class="tarjeta" style="margin-bottom:16px">' +
      '<div class="tarjeta-enc">' +
        '<div>' +
          '<h3 style="margin:0">Diagnóstico de Barreras y Problemáticas Educativas</h3>' +
          '<span class="txt-min">Marca las condiciones o impedimentos que presenta el estudiante para activar las rutas legales de atención</span>' +
        '</div>' +
      '</div>';

    BARRERAS_GRUPO.forEach(function (grp) {
      html += '<div class="grupo-barreras">' +
        '<div class="grupo-barreras-tit">' + ico("alerta") + esc(grp.grupo) + '</div>' +
        '<div class="grid-barreras">';
      grp.items.forEach(function (b) {
        var marcada = c.barreras.indexOf(b.id) >= 0;
        html += '<label class="barrera-card' + (marcada ? ' marcada' : '') + '">' +
          '<input type="checkbox" data-barrera="' + b.id + '"' + (marcada ? ' checked' : '') + '>' +
          '<span class="barrera-txt">' +
            '<span class="barrera-tit">' + esc(b.t) + '</span>' +
            '<span class="barrera-desc">' + esc(b.desc) + '</span>' +
          '</span>' +
        '</label>';
      });
      html += '</div></div>';
    });

    /* Rutas activadas por los marcadores */
    var rutasActivas = c.barreras.map(function (id) { return BARRERAS_IDX[id]; }).filter(Boolean);
    if (rutasActivas.length) {
      html += '<div class="aviso aviso-jade" style="margin-top:14px">' + ico("check") +
        '<span><strong>Rutas legales y de restitución de derechos aplicables:</strong>' +
        rutasActivas.map(function (r) {
          return '<span style="display:block;margin-top:4px">· <b>' + esc(r.t) + ':</b> ' + esc(r.ruta) +
            (r.canaliza ? ' <button class="enlace-inline" type="button" data-precan="' + r.id + '">→ Cargar en oficio</button>' : '') +
            '</span>';
        }).join("") +
        '</span></div>';
    }

    html += '</div>';

    /* ---------------- 4. Ficha del Trámite y Cotejo de Requisitos ----- */
    html += '<div class="tarjeta" style="margin-bottom:16px">' +
      '<div class="tarjeta-enc">' +
        '<div>' +
          '<h3 style="margin:0">Ficha del Trámite y Cotejo de Documentos</h3>' +
          '<span class="txt-min">Selecciona el nivel educativo y registra el estado de cada documento</span>' +
        '</div>' +
        (c.sucio
          ? '<span class="chip chip-rosa">' + ico("reloj") + 'Cambios sin guardar</span>'
          : '<span class="chip chip-jade">' + ico("check") + 'Valoración actualizada</span>') +
      '</div>' +

      '<div class="fila" style="margin-bottom:14px">' +
        '<div class="campo" style="flex:1">' +
          '<label for="fNivel">Nivel educativo solicitado <span class="req">*</span></label>' +
          '<select id="fNivel">' +
            '<option value="basica"' + (c.nivel === "basica" ? " selected" : "") + '>Educación Básica (Preescolar, Primaria, Secundaria)</option>' +
            '<option value="media"' + (c.nivel === "media" ? " selected" : "") + '>Media Superior (Bachillerato / Preparatoria)</option>' +
            '<option value="superior"' + (c.nivel === "superior" ? " selected" : "") + '>Superior (Licenciatura / Técnico Superior)</option>' +
          '</select>' +
        '</div>' +
        '<div class="campo" style="flex:1.5">' +
          '<label for="fInst">Plantel o Institución Educativa Receptora</label>' +
          '<input type="text" id="fInst" value="' + esc(c.inst || "") + '" placeholder="Ej. Escuela Primaria Federal Belisario Domínguez">' +
        '</div>' +
      '</div>' +

      '<div class="campo" style="margin-bottom:16px">' +
        '<label for="fDestino">Objetivo específico del trámite</label>' +
        '<input type="text" id="fDestino" value="' + esc(c.destino || "") + '" placeholder="Ej. Inscripción inmediata a 2.º grado de primaria">' +
      '</div>' +

      '<div class="aviso ' + (N.revalida ? "aviso-neutro" : "aviso-jade") + '" style="margin-bottom:16px">' +
        ico(N.revalida ? "info" : "check") +
        '<span><strong>' + (N.revalida ? "Criterio de revalidación oficial" : "Principio de no revalidación en básica (Acuerdo 286)") + '</strong>' +
        esc(N.regla) + '</span>' +
      '</div>' +

      '<div style="overflow-x:auto">' +
        '<table class="req-tabla">' +
          '<thead><tr><th style="width:38%">Requisito / Documento</th><th style="width:22%">Quién lo emite</th><th style="width:24%">Impacto Legal</th><th style="width:16%">Estado</th></tr></thead>' +
          '<tbody>' +
            reqs.map(function (r) {
              var st = c.req[r.id] || "falta";
              return '<tr>' +
                '<td><b>' + esc(r.t) + '</b></td>' +
                '<td class="txt-min">' + esc(r.quien) + '</td>' +
                '<td class="txt-min">' + esc(r.bloq) + '</td>' +
                '<td>' +
                  '<select class="sel-req-estado ' + st + '" data-reqid="' + r.id + '">' +
                    '<option value="si"' + (st === "si" ? " selected" : "") + '>✓ Reunido</option>' +
                    '<option value="tramite"' + (st === "tramite" ? " selected" : "") + '>⏳ En trámite</option>' +
                    '<option value="falta"' + (st === "falta" ? " selected" : "") + '>⚠️ Falta</option>' +
                    '<option value="na"' + (st === "na" ? " selected" : "") + '>— No aplica</option>' +
                  '</select>' +
                '</td>' +
              '</tr>';
            }).join("") +
          '</tbody>' +
        '</table>' +
      '</div>' +

      '<div class="flex gap-8" style="margin-top:16px;justify-content:flex-end">' +
        (c.sucio ? '<button class="btn btn-secundario btn-s" type="button" id="btnDescartar">' + ico("cerrar") + 'Descartar</button>' : '') +
        '<button class="btn btn-primario btn-s" type="button" id="btnGuardarVal">' + ico("guardar") + 'Guardar valoración educativa</button>' +
      '</div>' +
    '</div>';

    /* ---------------- 5. Registro de Negativas de Atención ------------ */
    html += '<div class="tarjeta" style="margin-bottom:16px">' +
      '<div class="tarjeta-enc">' +
        '<div>' +
          '<h3 style="margin:0">Registro de Negativas de Atención en Planteles</h3>' +
          '<span class="txt-min">Historial de rechazos, condicionamientos o cobros indebidos presentados en ventanilla</span>' +
        '</div>' +
        '<button class="btn btn-secundario btn-s" type="button" id="btnAbrirNeg">' + ico("mas") + 'Registrar negativa</button>' +
      '</div>';

    if (panelNegAbierto) {
      html += '<div class="panel" style="background:var(--hueso-claro);border:1px solid var(--linea);border-radius:var(--radio-s);padding:14px;margin-bottom:14px">' +
        '<h4 style="margin:0 0 8px;color:var(--guinda-900)">Capturar Negativa de Atención en Plantel</h4>' +
        '<div class="fila">' +
          '<div class="campo"><label for="nInst">Plantel o Institución infractora <span class="req">*</span></label>' +
            '<input type="text" id="nInst" value="' + esc(c.inst.split(" · ")[0]) + '"></div>' +
          '<div class="campo"><label for="nFec">Fecha del hecho <span class="req">*</span></label>' +
            '<input type="date" id="nFec" value="' + HOY.slice(0, 10) + '"></div>' +
        '</div>' +
        '<div class="campo"><label for="nMot">Motivo alegado por la escuela <span class="req">*</span></label>' +
          '<select id="nMot"><option value="">Elige un motivo del catálogo…</option>' +
          MOT_NEG.map(function (m) { return "<option>" + esc(m) + "</option>"; }).join("") +
          '</select></div>' +
        '<div class="campo"><label for="nDet">Descripción de lo ocurrido <span class="req">*</span></label>' +
          '<textarea id="nDet" rows="3" placeholder="Quién atendió, qué argumentos dio y qué se solicitó. Esta descripción sustentará el oficio legal."></textarea></div>' +
        '<div class="flex gap-8">' +
          '<button class="btn btn-primario btn-s" type="button" id="btnGuardarNeg">' + ico("guardar") + 'Guardar negativa</button>' +
          '<button class="btn btn-secundario btn-s" type="button" id="btnCancelaNeg">Cancelar</button>' +
        '</div>' +
      '</div>';
    }

    if (c.neg && c.neg.length) {
      html += c.neg.slice().reverse().map(function (x, idx) {
        return '<div class="neg-item">' + ico("alerta") +
          '<span class="n-tx">' +
            '<span class="n-t">' + esc(x.motivo) + '</span>' +
            '<span class="n-m">' + esc(x.detalle) + '</span>' +
            '<span class="n-m">' + (x.oficio
              ? '<span class="chip chip-jade" style="margin-right:6px">Reclamada</span>Oficio <b>' + esc(x.oficio) + '</b> · ' + esc(x.hizo || "En trámite")
              : '<span class="chip chip-guinda" style="margin-right:6px">Sin reclamar</span>Pendiente de emitir oficio a la autoridad.') + '</span>' +
            '<span class="n-f">' + esc(x.inst) + ' · ' + esc(x.t) + '</span>' +
          '</span>' +
          (!x.oficio ? '<button class="btn btn-secundario btn-s" type="button" data-reclamaidx="' + idx + '">' + ico("oficios") + 'Reclamar</button>' : '') +
        '</div>';
      }).join("");
    } else {
      html += '<div class="vacio" style="padding:16px">' + ico("check") + 'No se han registrado negativas de atención en este caso.</div>';
    }

    html += '</div>';

    /* ---------------- 6. Generador de Oficio de Canalización / Exhorto -- */
    html += '<div class="tarjeta">' +
      '<div class="tarjeta-enc">' +
        '<div>' +
          '<h3 style="margin:0">Generar Oficio de Intervención / Canalización Educativa</h3>' +
          '<span class="txt-min">Emite el documento institucional que sustenta y defiende el acceso escolar</span>' +
        '</div>' +
      '</div>' +
      '<div class="fila">' +
        '<div class="campo" style="flex:1.5">' +
          '<label for="ofDest">Autoridad destinataria <span class="req">*</span></label>' +
          '<input type="text" id="ofDest" value="Secretaría de Educación del Estado · Dirección de Educación Básica">' +
        '</div>' +
        '<div class="campo" style="flex:1">' +
          '<label for="ofAsunto">Asunto / Tipo de intervención <span class="req">*</span></label>' +
          '<select id="ofAsunto">' +
            '<option value="Exhorto por negativa de inscripción (Acuerdo 286 SEP)">Exhorto por negativa de inscripción (Acuerdo 286 SEP)</option>' +
            '<option value="Solicitud de revalidación parcial por materias">Solicitud de revalidación parcial por materias</option>' +
            '<option value="Exención de pago de derechos de revalidación">Exención de pago de derechos de revalidación</option>' +
            '<option value="Solicitud de valoración y examen de ubicación">Solicitud de valoración y examen de ubicación</option>' +
            '<option value="Canalización a educación especial / USAER">Canalización a educación especial / USAER</option>' +
          '</select>' +
        '</div>' +
      '</div>' +
      '<div class="campo">' +
        '<label for="ofFundamento">Fundamento legal y hechos citados</label>' +
        '<textarea id="ofFundamento" rows="3">Con fundamento en el Artículo 3.° Constitucional, los artículos 61 y 62 de la Ley General de Educación, y el Acuerdo 286 de la SEP, se solicita la inscripción provisional e inmediata de ' + per.n + ', garantizando el interés superior de la niñez sin que la falta de documentos de origen condicione el ingreso al plantel.</textarea>' +
      '</div>' +
      '<div class="flex gap-8" style="justify-content:flex-end">' +
        '<button class="btn btn-primario" type="button" id="btnGenerarOficio">' + ico("oficios") + 'Generar oficio en borrador</button>' +
      '</div>' +
    '</div>';

    $("#panel").innerHTML = html;
    eventosDetalle();
  }

  /* ======================================================================
     5. Eventos del Detalle y Captura
     ================================================================== */
  function eventosDetalle() {
    var per = D.PERS[selPerIdx];
    var c = getCaso(per);

    /* Marcadores de barreras */
    $$("[data-barrera]").forEach(function (chk) {
      chk.onchange = function () {
        var id = this.getAttribute("data-barrera");
        var idx = c.barreras.indexOf(id);
        if (this.checked && idx < 0) c.barreras.push(id);
        if (!this.checked && idx >= 0) c.barreras.splice(idx, 1);
        c.sucio = true;
        pintarDetalle();
      };
    });

    /* Pre-cargar en oficio desde rutas */
    $$("[data-precan]").forEach(function (btn) {
      btn.onclick = function () {
        var id = this.getAttribute("data-precan");
        var b = BARRERAS_IDX[id];
        if (!b || !b.canaliza) return;
        var od = $("#ofDest"), oa = $("#ofAsunto");
        if (od) od.value = b.canaliza.inst;
        if (oa) oa.value = b.canaliza.motivo;
        $("#ofDest").focus();
        $("#ofDest").scrollIntoView({ behavior:"smooth", block:"center" });
        if (SIMH.toast) SIMH.toast("Datos cargados en el formulario de oficio", "info");
      };
    });

    /* Cambio de nivel educativo */
    var fNivel = $("#fNivel");
    if (fNivel) {
      fNivel.onchange = function () {
        c.nivel = this.value;
        c.sucio = true;
        pintarDetalle();
      };
    }

    /* Cambio de estado en requisitos */
    $$(".sel-req-estado").forEach(function (sel) {
      sel.onchange = function () {
        var reqId = this.getAttribute("data-reqid");
        c.req[reqId] = this.value;
        c.sucio = true;
        pintarDetalle();
      };
    });

    /* Guardar valoración */
    var bg = $("#btnGuardarVal");
    if (bg) {
      bg.onclick = function () {
        var fi = $("#fInst"), fd = $("#fDestino");
        if (fi) c.inst = fi.value.trim();
        if (fd) c.destino = fd.value.trim();
        c.sucio = false;
        pintarDetalle();
        if (SIMH.toast) SIMH.toast("Valoración educativa guardada en el expediente", "ok");
      };
    }

    /* Descartar */
    var bd = $("#btnDescartar");
    if (bd) {
      bd.onclick = function () {
        c.sucio = false;
        pintarDetalle();
      };
    }

    /* Abrir panel de negativa */
    var bon = $("#btnAbrirNeg");
    if (bon) {
      bon.onclick = function () {
        panelNegAbierto = true;
        pintarDetalle();
        var ni = $("#nInst");
        if (ni) ni.focus();
      };
    }
    var bcn = $("#btnCancelaNeg");
    if (bcn) {
      bcn.onclick = function () {
        panelNegAbierto = false;
        pintarDetalle();
      };
    }

    /* Guardar negativa */
    var bgn = $("#btnGuardarNeg");
    if (bgn) {
      bgn.onclick = function () {
        var inst = $("#nInst") ? $("#nInst").value.trim() : "";
        var fec = $("#nFec") ? $("#nFec").value : HOY.slice(0, 10);
        var mot = $("#nMot") ? $("#nMot").value : "";
        var det = $("#nDet") ? $("#nDet").value.trim() : "";
        if (!inst || !mot || !det) {
          alert("Por favor completa la institución, el motivo y el detalle de la negativa.");
          return;
        }
        c.neg.push({
          t: fec + " " + hora(HOY),
          inst: inst,
          motivo: mot,
          detalle: det,
          hizo: "",
          oficio: null
        });
        if (c.barreras.indexOf("neg_inscripcion") < 0) c.barreras.push("neg_inscripcion");
        panelNegAbierto = false;
        pintarDetalle();
        if (SIMH.toast) SIMH.toast("Negativa registrada en el historial", "alerta");
      };
    }

    /* Reclamar desde botón rápido o lista */
    var brr = $("#btnReclamarRapido");
    if (brr) {
      brr.onclick = function () {
        var ofd = $("#ofDest"), ofa = $("#ofAsunto");
        if (ofd) ofd.value = "Secretaría de Educación del Estado · Unidad de Inclusión";
        if (ofa) ofa.value = "Exhorto por negativa de inscripción (Acuerdo 286 SEP)";
        $("#ofDest").focus();
        $("#ofDest").scrollIntoView({ behavior:"smooth", block:"center" });
      };
    }

    /* Generar oficio */
    var bgo = $("#btnGenerarOficio");
    if (bgo) {
      bgo.onclick = function () {
        var dest = $("#ofDest") ? $("#ofDest").value.trim() : "";
        var asunto = $("#ofAsunto") ? $("#ofAsunto").value : "";
        if (!dest) {
          alert("Indica la autoridad destinataria del oficio.");
          return;
        }
        var folio = folioOficio();
        c.can.push({
          fecha: fecha(HOY.slice(0, 10)),
          inst: dest,
          motivo: asunto,
          of: folio,
          est: "Emitido · en seguimiento"
        });
        // Si hay una negativa abierta, vincularla
        var na = c.neg.find(function (x) { return !x.oficio; });
        if (na) {
          na.oficio = folio;
          na.hizo = "Se emitió oficio de intervención legal.";
        }
        pintarDetalle();
        if (SIMH.toast) SIMH.toast("Oficio " + folio + " generado en borrador", "ok");
      };
    }
  }

  /* ======================================================================
     6. Gestor de Caso (Drawer & Atajos)
     ================================================================== */
  var gestor = SIMH.gestorCaso({
    items: D.PERS,
    indiceInicial: selPerIdx,
    titulo: "Seleccionar Estudiante",
    placeholder: "Buscar por nombre, folio o CURP...",
    filtraItem: function (p, txt) {
      if (!txt) return true;
      var t = (p.n + " " + p.f + " " + p.curp + " " + p.pais + " " + p.mun).toLowerCase();
      return t.indexOf(txt.toLowerCase()) >= 0;
    },
    renderItem: function (p, esActivo, idx) {
      var c = getCaso(p);
      var na = c.neg.find(function (x) { return !x.oficio; });
      return '<button type="button" class="drawer-item' + (esActivo ? ' activo' : '') + '" data-idx="' + idx + '">' +
        '<div class="drawer-item-avatar">' + (p.foto ? ico("persona") : esc(p.ini)) + '</div>' +
        '<div class="drawer-item-txt">' +
          '<span class="drawer-item-nom">' + esc(p.n) + '</span>' +
          '<span class="drawer-item-sub">Folio ' + esc(p.f) + ' · ' + edad(p.nac) + ' años · ' + esc(p.pais) + '</span>' +
        '</div>' +
        (na ? '<span class="chip chip-guinda">!</span>' : '') +
      '</button>';
    },
    onSelect: function (p, idx) {
      selPerIdx = idx;
      panelNegAbierto = false;
      pintarDetalle();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  /* Aviso explicativo */
  $("#avisoModCuerpo").innerHTML =
    '<div class="resumen-lista">' +
      '<div class="resumen-dato"><span class="r-lab">La educación básica no se revalida</span>' +
        '<span class="r-val">Conforme al <b>Acuerdo 286 de la SEP</b> y los estándares de inclusión educativa, toda niña, niño o adolescente tiene derecho a inscribirse de manera inmediata en primaria o secundaria aunque carezca de documentos de identidad o boletas de origen. La escuela inscribe provisionalmente y regulariza después.</span></div>' +
      '<div class="resumen-dato"><span class="r-lab">Prohibición de exigir apostilla en básica</span>' +
        '<span class="r-val">Condicionar el acceso a apostillas, cuotas o regularidad migratoria es un acto violatorio de derechos humanos. Este módulo permite registrar la negativa con fecha, plantel y testimonio para sustentar el oficio de intervención.</span></div>' +
      '<div class="resumen-dato"><span class="r-lab">Revalidación en Media Superior y Superior</span>' +
        '<span class="r-val">En bachillerato y universidad se realiza el cotejo de materias y planes de estudio. Para revalidación parcial procede la resolución mediante cotejo directo sin exigir apostilla previa.</span></div>' +
    '</div>';

  pintarDetalle();

  /* Eventos globales */
  document.addEventListener("click", function (e) {
    if (e.target.closest("#btnAbrirSelector") || e.target.closest("#btnBuscar")) {
      gestor.abrir();
    } else if (e.target.closest("#btnCasoAnt")) {
      gestor.anterior();
    } else if (e.target.closest("#btnCasoSig")) {
      gestor.siguiente();
    }
  });
})();
</script>
</body>
</html>
