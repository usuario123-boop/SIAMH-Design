<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  .g-maestro{display:grid;grid-template-columns:308px minmax(0,1fr);gap:16px;align-items:start}
  .g-maestro > *{min-width:0}
  @media (max-width:1180px){ .g-maestro{grid-template-columns:1fr} }
  @media (max-width:1000px){ .rejilla.g-3{grid-template-columns:1fr} }
  @media (max-width:860px){ .rejilla.g-hero{grid-template-columns:1fr} }

  /* ---------- Cartera de grupos: primero lo que exige acción ----------- */
  .grp-item{display:block;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--linea-suave);padding:11px 12px;cursor:pointer;
    font-family:var(--f-texto);position:relative}
  .grp-item:hover{background:var(--hueso-claro)}
  .grp-item.activo{background:var(--jade-050)}
  .grp-item.activo::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
    background:var(--jade);border-radius:0 3px 3px 0}
  .grp-item .g-nom{display:block;font-size:13.5px;font-weight:700;color:var(--tinta);line-height:1.3;margin:6px 0 2px}
  .grp-item .g-sede{display:block;font-size:11.5px;color:var(--gris-claro);line-height:1.35}
  .grp-item .g-alerta{display:flex;gap:5px;align-items:flex-start;font-size:11.5px;color:var(--guinda-900);
    font-weight:700;margin-top:5px;line-height:1.35}
  .grp-item .g-alerta svg{width:13px;height:13px;stroke:var(--guinda);stroke-width:2;fill:none;flex:none;margin-top:1px}
  .grp-item .g-cupo{display:flex;align-items:center;gap:8px;margin-top:7px}
  .grp-item .g-barra{display:block;flex:1;height:5px;border-radius:3px;background:var(--linea-suave);overflow:hidden}
  .grp-item .g-barra > span{display:block;height:100%;background:var(--dato-3)}
  .grp-item .g-cifra{display:block;font-size:11px;color:var(--gris);font-variant-numeric:tabular-nums;flex:none}

  .chips-filtro{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chips-filtro .chip{cursor:pointer;border:0;font-family:var(--f-texto)}

  /* ---------- Cabecera del grupo --------------------------------------- */
  .grp-cab{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
  .grp-cab .gc-txt{flex:1;min-width:280px}
  .grp-cab h2{font-family:var(--f-texto);font-size:20px;font-weight:700;color:var(--tinta);
    letter-spacing:0;text-transform:none;margin:0 0 6px;line-height:1.25}
  .grp-cab .gc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .grp-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--gris)}
  .grp-meta b{color:var(--tinta);font-weight:700}

  /* ---------- Medidor de cupo: un lugar = una casilla ------------------ */
  .cupo-med{display:flex;gap:3px;margin:6px 0 9px}
  .cupo-med span{display:block;flex:1;height:28px;border-radius:3px;
    background:var(--blanco);border:1px dashed var(--arena)}
  .cupo-med span.ocu{background:var(--dato-3);border:1px solid var(--dato-3)}
  .cupo-leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--gris)}
  .cupo-leyenda .cl{display:flex;align-items:center;gap:6px}
  .cupo-leyenda .cl i{display:block;width:11px;height:11px;border-radius:2px;flex:none}
  .cupo-leyenda .cl i.ocu{background:var(--dato-3)}
  .cupo-leyenda .cl i.lib{background:var(--blanco);border:1px dashed var(--arena)}

  /* ---------- Proporción: magnitud contra un umbral, no dos categorías -- */
  .prop{position:relative;height:28px;border-radius:4px;background:var(--hueso);overflow:hidden;margin:6px 0 7px}
  .prop > .p-fill{display:block;height:100%;background:var(--dato-3)}
  .prop > .p-fill.falla{background:var(--guinda)}
  .prop > .p-umbral{display:block;position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--tinta);opacity:.8}
  .prop > .p-et{display:block;position:absolute;top:5px;left:10px;font-size:12.5px;font-weight:700;color:#fff}
  .prop-pie{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--gris);flex-wrap:wrap}

  .bloque-med{border:1px solid var(--linea-suave);border-radius:var(--radio);padding:13px 15px}
  .bloque-med > h4{margin:0;font-family:var(--f-texto);font-size:10.5px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--gris-claro);font-weight:700}
  .bloque-med .bm-est{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;font-weight:700;
    margin-top:9px;line-height:1.35}
  .bloque-med .bm-est svg{width:14px;height:14px;stroke-width:2;fill:none;flex:none;margin-top:1px}
  .bm-ok{color:var(--jade-900)} .bm-ok svg{stroke:var(--jade-900)}
  .bm-mal{color:var(--critico)} .bm-mal svg{stroke:var(--critico)}

  /* ---------- Requisitos para acreditar -------------------------------- */
  .req-fila{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--linea-suave)}
  .req-fila:first-child{padding-top:0}
  .req-fila:last-child{border-bottom:0;padding-bottom:0}
  .req-fila .r-txt{flex:1;min-width:0}
  .req-fila .r-t{display:block;font-size:13.5px;font-weight:700;color:var(--tinta);line-height:1.3}
  .req-fila .r-n{display:block;font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.4}
  .req-fila .r-n.mal{color:var(--guinda-900);font-weight:700}
  .req-fila .r-cif{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;
    color:var(--tinta);text-align:right;min-width:56px;line-height:1.1}
  .req-fila .r-cif small{display:block;font-size:10.5px;font-weight:400;color:var(--gris-claro);letter-spacing:.03em;margin-top:2px}
  .req-fila .r-bar{display:block;width:100px;height:6px;border-radius:3px;background:var(--linea-suave);overflow:hidden;flex:none}
  .req-fila .r-bar > span{display:block;height:100%;background:var(--dato-3)}
  .req-fila .r-bar > span.pend{background:var(--arena)}

  /* ---------- Tabla de participantes ----------------------------------- */
  .nac{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--gris);
    border:1px solid var(--linea);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:1px}
  .t-part td{vertical-align:middle}
  .t-part td:first-child,.t-part th:first-child{width:36%;min-width:222px}
  .t-part td,.t-part th{padding-left:12px;padding-right:12px}
  .t-part .p-nom a{color:var(--tinta);text-decoration:none}
  .t-part .p-nom a:hover{color:var(--jade-900);text-decoration:underline}
  .t-part .p-nom{display:block;font-weight:700;line-height:1.25;font-size:13px}
  .t-part .p-folio{display:block;font-size:11.5px;color:var(--gris);margin-top:2px}
  .t-part tr.dada-baja .p-nom{text-decoration:line-through;color:var(--gris-claro)}
  .t-part tr.dada-baja td{background:var(--hueso-claro)}
  .docs{display:flex;flex-direction:column;gap:4px}
  .doc-l{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--gris);white-space:nowrap}
  .doc-l svg{width:13px;height:13px;stroke-width:2.2;fill:none;flex:none}
  .doc-l.si{color:var(--jade-900)} .doc-l.si svg{stroke:var(--jade-900)}
  .doc-l.no{color:var(--critico);font-weight:700} .doc-l.no svg{stroke:var(--critico)}
  .doc-l.na{color:var(--gris-claro)} .doc-l.na svg{stroke:var(--gris-claro)}
  .asis-cel{display:block;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.2}
  .asis-cel small{display:block;font-size:11px;font-weight:400;color:var(--gris);margin-top:2px}
  .asis-cel.riesgo{color:var(--rosa)} .asis-cel.riesgo small{color:var(--rosa)}
  .asis-cel.perdida{color:var(--critico)} .asis-cel.perdida small{color:var(--critico)}

  .filtros-tabla{display:flex;gap:6px;flex-wrap:wrap}
  .filtros-tabla .chip{cursor:pointer;border:0;font-family:var(--f-texto)}

  /* ---------- Pase de lista -------------------------------------------- */
  .pase{display:inline-flex;border:1px solid var(--linea);border-radius:var(--radio-s);overflow:hidden}
  .pase button{height:28px;padding:0 11px;font-size:11.5px;font-weight:700;border:0;background:var(--blanco);
    cursor:pointer;font-family:var(--f-texto);color:var(--gris);border-left:1px solid var(--linea)}
  .pase button:first-child{border-left:0}
  .pase button:hover{background:var(--hueso-claro)}
  .pase button.on-p{background:var(--jade);color:#fff}
  .pase button.on-a{background:var(--guinda);color:#fff}
  .pase button.on-j{background:var(--arena);color:var(--tinta)}

  /* ---------- Panel de alta de participante ---------------------------- */
  .panel-add{border:1px solid var(--jade);border-radius:var(--radio);background:var(--jade-020);
    padding:15px 16px;margin-bottom:16px}
  .panel-add > h3{margin:0 0 3px;font-family:var(--f-texto);font-size:14.5px;font-weight:700;
    color:var(--tinta);text-transform:none;letter-spacing:0}
  .cand{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--linea-suave)}
  .cand:last-child{border-bottom:0}
  .cand .c-txt{flex:1;min-width:0}
  .cand .c-nom{display:block;font-size:13px;font-weight:700;line-height:1.25}
  .cand .c-sub{display:block;font-size:11.5px;color:var(--gris);margin-top:2px}
  .pred{border-left:3px solid var(--jade);background:var(--blanco);padding:10px 12px;
    border-radius:0 var(--radio-s) var(--radio-s) 0;font-size:12.5px;color:var(--gris);margin-top:10px;line-height:1.5}
  .pred.rompe{border-left-color:var(--guinda);color:var(--guinda-900)}
  .pred svg{width:14px;height:14px;stroke-width:2;fill:none;stroke:var(--guinda);vertical-align:-2px}
  .pred b{color:var(--tinta)}
  .pred.rompe b{color:var(--guinda-900)}

  /* ---------- Panel de baja -------------------------------------------- */
  .panel-baja{border:1px solid var(--guinda);border-radius:var(--radio);background:var(--guinda-050);
    padding:15px 16px;margin-top:16px}
  .panel-baja > h3{margin:0 0 3px;font-family:var(--f-texto);font-size:14.5px;font-weight:700;
    color:var(--guinda-900);text-transform:none;letter-spacing:0}

  /* Temporadas y constancia enviada (22/09/2026) */
  .t-temp td{vertical-align:middle;font-size:13px;word-break:break-word}
  .t-temp th{white-space:normal}
  .t-temp .num{text-align:right;font-variant-numeric:tabular-nums}
  .t-sub{display:block;font-size:11.5px;color:var(--gris);margin-top:2px}
  .t-part .p-env{display:block;font-size:11.5px;color:var(--jade-900);font-weight:600;margin-top:2px}
  .t-part .p-env.no{color:var(--guinda-900)}
  .msg-prev{white-space:pre-wrap;font-family:var(--f-texto);font-size:12.5px;line-height:1.5;color:var(--tinta);
    background:var(--blanco);border:1px solid var(--linea-suave);border-radius:var(--radio-s);
    padding:10px 12px;margin:10px 0 0;max-width:620px}
  .lbl-fijo{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--gris);margin-bottom:6px}
  .dato-fijo{display:flex;align-items:center;min-height:44px;font-size:14px;font-weight:700;color:var(--tinta)}

  .sec-tit{font-family:var(--f-texto);font-size:14.5px;font-weight:700;color:var(--tinta);
    text-transform:none;letter-spacing:0;margin:0}
</style>

  function fecha(iso) { var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }

  /* Asistencia: el porcentaje de hoy no basta. Lo que decide la
     acreditación es si el mínimo TODAVÍA es alcanzable con las sesiones
     que faltan; cuando deja de serlo es irreversible y hay que decirlo,
     no dejarlo como un "va bajo" que ya no tiene remedio.                 */
  function asis(g, x) {
    var minimo = Math.ceil(g.sesiones * MIN_ASIS);
    var faltan = g.sesiones - g.sesion;
    var techo  = x.a + faltan;
    var pctHoy = g.sesion ? x.a / g.sesion : 0;
    var est = "ok";
    if (techo < minimo) est = "perdida";
    else if (g.sesion && pctHoy < MIN_ASIS) est = "riesgo";
    return { minimo:minimo, techo:techo, faltan:faltan, pct:pctHoy, est:est };
  }

  function resumen(g) {
    var act = activos(g);
    var ext = act.filter(function (x) { return x.ext; }).length;
    var mex = act.length - ext;
    var libres = g.cupo - act.length;
    var cumple = ext > mex;
    /* Margen: cuántas personas mexicanas más caben sin romper ext > mex. */
    var margen = Math.max(0, Math.min(libres, ext - mex - 1));
    var faltanExt = cumple ? 0 : (mex - ext + 1);
    var docs = act.filter(docOk).length;
    var asisOk = 0, riesgo = 0, perdida = 0;
    act.forEach(function (x) {
      var a = asis(g, x);
      if (a.est === "ok") asisOk++; else if (a.est === "riesgo") riesgo++; else perdida++;
    });
    var listos = act.filter(function (x) { return docOk(x) && asis(g, x).est === "ok"; }).length;

    return '<div class="bloque-med">' +
      "<h4>Proporción mayoritaria extranjera</h4>" +
      '<div class="prop" role="img" aria-label="' + pct + ' por ciento de personas extranjeras; el mínimo es más del 50 por ciento">' +
        '<span class="p-fill' + (r.cumple ? "" : " falla") + '" style="width:' + Math.max(pct, 14) + '%"></span>' +
        '<span class="p-umbral"></span>' +
        '<span class="p-et">' + pct + "%</span>" +
      "</div>" +
      '<div class="prop-pie"><span>' + r.ext + " extranjeras · " + r.mex + " mexicanas</span>" +
        "<span>mínimo: más del 50%</span></div>" +
      '<div class="bm-est ' + (r.cumple ? "bm-ok" : "bm-mal") + '">' + ico(r.cumple ? "check" : "alerta") +
        "<span>" + (r.cumple
          ? (g.estado === "concluido"
              ? "Cumplió la proporción mayoritaria extranjera"
              : (r.margen
                  ? "Cumple · " + (r.margen === 1 ? "cabe " : "caben ") +
                    plural(r.margen, "persona mexicana", "personas mexicanas") + " más sin romperla"
                  : "Cumple · toda alta adicional debe ser de persona extranjera"))
          : "No cumple · " + faltan(r.faltanExt) + plural(r.faltanExt, "persona extranjera", "personas extranjeras")) +
        "</span></div></div>";
  }

  function bloquePlazo(g) {
    var dc = dias(HOY, g.cierre), df = dias(HOY, g.fin);
    var t, s, mal = false, nota;
    if (g.estado === "concluido") {
      t = "Concluido el " + fecha(g.fin);
      s = "Las constancias de competencia las emitió la institución que impartió el curso";
      nota = "El grupo queda cerrado; su historial se conserva";
    } else if (g.estado === "programado") {
      var tp = temporada(g.temporada);
      t = "Inscripción abre el " + fecha(g.abre);
      s = "Faltan " + plural(dias(HOY, g.abre), "día", "días") + " · registro hasta el " + fecha(g.cierre) +
          " · inicia el " + fecha(g.inicio);
      nota = "Antes de que abra la inscripción no se admiten altas" +
             (tp ? " · temporada " + tp.t : "");
    } else if (g.estado === "conformacion") {
      t = "Cierra inscripción el " + fecha(g.cierre);
      s = dc >= 0 ? (dc === 1 ? "Falta 1 día" : "Faltan " + dc + " días") + " · inicia el " + fecha(g.inicio)
                  : "El plazo de inscripción venció";
      mal = dc >= 0 && dc <= 7;
      nota = "La proporción se verifica al cerrar la inscripción";
    } else {
      t = "Sesión " + g.sesion + " de " + g.sesiones;
      s = "Termina el " + fecha(g.fin) + " · " + faltan(df) + plural(df, "día", "días");
      mal = df <= 7;
      nota = "La documentación se verifica al cerrar el curso";
    }
    return '<div class="bloque-med">' +
      "<h4>Calendario</h4>" +
      '<div style="font-size:15px;font-weight:700;margin:8px 0 4px;line-height:1.25">' + esc(t) + "</div>" +
      '<div style="font-size:12px;color:var(--gris);line-height:1.4">' + esc(s) + "</div>" +
      '<div class="bm-est ' + (mal ? "bm-mal" : "bm-ok") + '">' + ico("reloj") + "<span>" + nota + "</span></div>" +
      "</div>";
  }

  function filaReq(t, n, tot, nota, mal, pend) {
    var pctv = (pend || !tot) ? 0 : Math.round(n / tot * 100);
    return '<div class="req-fila">' +
      '<div class="r-txt"><span class="r-t">' + t + "</span>" +
        '<span class="r-n' + (mal ? " mal" : "") + '">' + nota + "</span></div>" +
      '<span class="r-bar"><span class="' + (pend ? "pend" : "") + '" style="width:' + pctv + '%"></span></span>' +
      '<span class="r-cif">' + (pend ? "—" : n) + "<small>de " + tot + "</small></span></div>";
  }

  function bloqueRequisitos(g, r) {
    var d = r.n - r.docs;
    var bajo = r.riesgo + r.perdida;
    var sinIniciar = g.sesion === 0;
    var evalPend = g.estado !== "concluido";

    var heroLab, heroSub;
    if (g.estado === "concluido") {
      heroLab = "Acreditaron el curso";
      heroSub = "de " + r.n + " personas inscritas cumplieron la documentación y el mínimo de asistencia";
    } else if (sinIniciar) {
      heroLab = "Listas para acreditar";
      heroSub = "de " + r.n + " personas inscritas tienen hoy la documentación completa; la asistencia " +
                "empieza a contar el " + fecha(g.inicio);
    } else {
      heroLab = "En condiciones de acreditar";
      heroSub = "de " + r.n + " personas inscritas cumplen hoy la documentación y el mínimo de asistencia";
    }

    return '<div class="tarjeta">' +
      '<div class="tarjeta-enc"><h3 class="sec-tit">Requisitos para Acreditar</h3></div>' +
      '<div class="hero" style="margin-bottom:20px">' +
        '<span class="h-lab">' + heroLab + "</span>" +
        '<span class="h-num">' + r.listos + "</span>" +
        '<span class="h-sub">' + heroSub + "</span>" +
      "</div>" +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:14px">' +
        '<div class="bloque-med">' +
          '<h4>🎯 Cupo del grupo</h4>' +
          filaReq("Inscritas", r.n, g.cupo, "", false, false) +
        '</div>' +
        '<div class="bloque-med">' +
          '<h4>👥 Proporción mayoritaria extranjera</h4>' +
          filaReq("Extranjeras", r.ext, r.n, "> 50% = " + Math.round(r.pct * 100) + "%", !r.cumple, false) +
        '</div>' +
        '<div class="bloque-med">' +
          '<h4>📄 Documentación completa</h4>' +
          filaReq("CURP + COMAR", r.docs, r.n,
            d ? plural(d, "persona incompleta", "personas incompletas") : "Todas documentadas",
            !!d, false) +
        '</div>' +
        '<div class="bloque-med">' +
          '<h4>📊 Asistencia mínima</h4>' +
          filaReq("80% de sesiones", r.asisOk, r.n,
            sinIniciar ? "Mínimo " + Math.ceil(g.sesiones * MIN_ASIS) + " de " + g.sesiones
                       : (bajo ? plural(bajo, "en riesgo", "en riesgo") : "Todas cumplen"),
            !!bajo, sinIniciar) +
        '</div>' +
      '</div>' +
      '<div class="tarjeta-pie">La acreditación es competencia de la institución que imparte el curso. El SIAMH verifica los requisitos y ' +
        "conserva el expediente de la persona; no emite la constancia de competencia.</div></div>";
  }

  function celdaDocs(x) {
    var l = [];
    l.push('<span class="doc-l ' + (x.curp ? "si" : "no") + '" title="' +
      (x.curp ? "CURP vigente en el expediente" : "CURP no acreditada: impide acreditar el curso") + '">' +
      ico(x.curp ? "check" : "alerta") + "CURP" + (x.curp ? "" : " falta") + "</span>");
    if (x.ext) {
      l.push('<span class="doc-l ' + (x.comar ? "si" : "no") + '" title="' +
        (x.comar ? "Constancia COMAR vigente" : "Constancia COMAR faltante: impide acreditar el curso") + '">' +
        ico(x.comar ? "check" : "alerta") + "COMAR" + (x.comar ? "" : " falta") + "</span>");
    } else {
      l.push('<span class="doc-l na" title="La constancia COMAR solo aplica a personas extranjeras">' +
        ico("info") + "COMAR n/a</span>");
    }
    return '<div class="docs">' + l.join("") + "</div>";
  }

  function celdaAsis(g, x) {
    if (!g.sesion) {
      return '<span class="asis-cel" style="color:var(--gris-claro);font-weight:400">Sin iniciar</span>';
    }
    var a = asis(g, x);
    var cls = a.est === "perdida" ? " perdida" : (a.est === "riesgo" ? " riesgo" : "");
    var nota = a.est === "perdida"
      ? "ya no alcanza " + a.minimo + " de " + g.sesiones
      : (a.est === "riesgo"
          ? "necesita las " + a.faltan + " que faltan"
          : Math.round(a.pct * 100) + "% de lo impartido");
    return '<span class="asis-cel' + cls + '">' + x.a + " / " + g.sesion + "<small>" + nota + "</small></span>";
  }

  function estadoPersona(g, x) {
    if (x.baja) return '<span class="chip chip-neutro">Baja</span>';
    var a = asis(g, x);
    if (a.est === "perdida") return '<span class="chip chip-guinda">' + ico("alerta") + "No acredita</span>";
    if (!docOk(x))          return '<span class="chip chip-guinda">' + ico("alerta") + "Falta documentación</span>";
    if (a.est === "riesgo") return '<span class="chip chip-rosa">' + ico("reloj") + "Asistencia en riesgo</span>";
    if (g.estado === "concluido") return '<span class="chip chip-jade">' + ico("check") + "Acreditada</span>";
    return '<span class="chip chip-jade">' + ico("check") + "En regla</span>";
  }

  function persona(x) {
    var ini = x.n.split(" ").slice(0, 2).map(function (w) { return w.charAt(0); }).join("");
    return '<div class="persona-celda">' + SIMH.fotoPersona("CAP-" + x.e, x.n, "avatar-mini", ini) +
      '<span><span class="p-nom"><a href="expediente-detalle.html">' + esc(x.n) + "</a>" +
        '<span class="nac" title="' + PAIS[x.nac] + '">' + x.nac + "</span></span>" +
      '<span class="p-folio">MH-2026-' + x.e +
        (x.prev ? " · " + plural(x.prev, "curso previo", "cursos previos") : "") + "</span>" +
      (x.envios && x.envios.length
        ? '<span class="p-env' + (x.envios[x.envios.length - 1].medio ? "" : " no") + '">' +
          (x.envios[x.envios.length - 1].medio
            ? "✓ Constancia enviada · " + x.envios[x.envios.length - 1].mt
            : "✕ Constancia sin enviar: sin medio de contacto") + "</span>"
        : "") +
      "</span></div>";
  }

  function pasaFila(g, x) {
    if (filaFil === "docs") return !x.baja && !docOk(x);
    if (filaFil === "asis") return !x.baja && asis(g, x).est !== "ok";
    if (filaFil === "baja") return !!x.baja;
    return true;
  }

  function barraPase(g) {
    var act = activos(g);
    var marcadas = act.filter(function (x) { return pase[x.e]; }).length;
    return '<div class="tabla-pie">' +
      "<span>" + marcadas + " de " + act.length + " marcadas" +
        (marcadas < act.length ? " · faltan " + (act.length - marcadas) : "") + "</span>" +
      '<span style="display:flex;gap:8px">' +
        '<button class="btn btn-secundario btn-s" type="button" id="btnTodasP">Marcar todas presentes</button>' +
        '<button class="btn btn-primario btn-s" type="button" id="btnGuardaPase"' +
          (marcadas === act.length ? "" : " disabled") + ">" + ico("guardar") + "Guardar la sesión</button>" +
      "</span></div>";
  }

  function tablaParticipantes(g, r) {
    var filas = g.p.filter(function (x) { return pasaFila(g, x); });
    var fils = [
      { id:"todos", t:"Todas",                     n:g.p.length },
      { id:"docs",  t:"Documentación pendiente",   n:r.act.filter(function (x) { return !docOk(x); }).length },
      { id:"asis",  t:"Asistencia por debajo",     n:r.riesgo + r.perdida },
      { id:"baja",  t:"Bajas",                     n:g.p.length - r.n }
    ];

    var cab = modoLista
      ? "<tr><th>Persona</th><th>Asistencia acumulada</th><th>Sesión " + (g.sesion + 1) +
        " · " + fecha(HOY) + "</th></tr>"
      : "<tr><th>Persona</th><th>Documentación</th><th>Asistencia</th><th>Estado</th><th></th></tr>";

    var cuerpo = filas.length ? filas.map(function (x) {
      if (modoLista) {
        var m = pase[x.e] || "";
        return '<tr' + (x.baja ? ' class="dada-baja"' : "") + "><td>" + persona(x) + "</td>" +
          "<td>" + celdaAsis(g, x) + "</td><td>" +
          (x.baja
            ? '<span style="font-size:12px;color:var(--gris-claro)">Dada de baja el ' + fecha(x.baja.f) + "</span>"
            : '<span class="pase" role="group" aria-label="Asistencia de ' + esc(x.n) + '">' +
              '<button type="button" data-pase="' + x.e + '" data-v="P" class="' + (m === "P" ? "on-p" : "") + '">Presente</button>' +
              '<button type="button" data-pase="' + x.e + '" data-v="A" class="' + (m === "A" ? "on-a" : "") + '">Ausente</button>' +
              '<button type="button" data-pase="' + x.e + '" data-v="J" class="' + (m === "J" ? "on-j" : "") + '">Justificada</button>' +
              "</span>") +
          "</td></tr>";
      }
      return '<tr' + (x.baja ? ' class="dada-baja"' : "") + "><td>" + persona(x) + "</td>" +
        "<td>" + celdaDocs(x) + "</td>" +
        "<td>" + celdaAsis(g, x) + "</td>" +
        "<td>" + estadoPersona(g, x) +
          (x.baja ? '<div style="font-size:11px;color:var(--gris);margin-top:4px;line-height:1.35">' +
            esc(x.baja.m) + "</div>" : "") + "</td>" +
        '<td style="text-align:right;white-space:nowrap">' +
          (x.baja ? ""
            : '<a class="btn btn-texto btn-s" href="empleabilidad.html?e=' + x.e + '&tab=vinc" title="Vincular a empleo en el módulo de Empleabilidad" style="color:var(--jade-900);font-weight:700;margin-right:8px">' +
                ico("empleo") + 'Vincular a empleo</a>' +
              (g.estado === "concluido" ? ""
                : '<button class="btn btn-texto btn-s" type="button" data-reenv="' + x.e + '" style="color:var(--gris)">' +
                  (x.envios && x.envios.length ? "Reenviar constancia" : "Enviar constancia") + "</button>" +
                  '<button class="btn btn-texto btn-s" type="button" data-baja="' + x.e +
                  '" style="color:var(--gris)">Registrar baja</button>')) +
        "</td></tr>";
    }).join("")
      : '<tr><td colspan="' + (modoLista ? 3 : 5) + '" style="text-align:center;padding:24px;color:var(--gris)">' +
        (g.p.length ? "Ninguna persona coincide con el filtro."
         : g.estado === "programado" ? "Aún no hay inscritas: la inscripción abre el " + fecha(g.abre) + "."
         : "Aún no hay personas inscritas en este grupo.") + "</td></tr>";

    return '<div class="tarjeta" style="padding:0">' +
      '<div style="padding:15px 16px 12px;border-bottom:1px solid var(--linea)">' +
        '<div class="tarjeta-enc" style="margin-bottom:11px">' +
          '<h3 class="sec-tit">' + (modoLista
            ? "Pase de lista · sesión " + (g.sesion + 1) + " de " + g.sesiones
            : "Participantes del grupo") + "</h3>" +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            (g.estado === "concluido" || g.estado === "conformacion" || g.estado === "programado" ? ""
              : '<button class="btn btn-secundario btn-s" type="button" id="btnModo">' +
                ico(modoLista ? "izq" : "check") +
                (modoLista ? "Salir del pase de lista" : "Pasar lista de hoy") + "</button>") +
            (g.estado === "concluido" || g.estado === "programado" || r.libres === 0 ? ""
              : '<button class="btn btn-primario btn-s" type="button" id="btnAdd">' +
                ico("mas") + "Agregar participante</button>") +
          "</div>" +
        "</div>" +
        (modoLista
          ? '<div style="font-size:12px;color:var(--gris);line-height:1.45">Marca la asistencia de hoy. ' +
            "La sesión no se guarda hasta confirmarla abajo; una vez guardada, solo el instructor del curso " +
            "puede corregirla y la corrección queda en la bitácora.</div>"
          : '<div class="filtros-tabla" id="filFila" role="group" aria-label="Filtrar participantes">' +
            fils.map(function (f) {
              return '<button type="button" class="chip ' + (filaFil === f.id ? "chip-jade" : "chip-neutro") +
                '" data-ff="' + f.id + '" aria-pressed="' + (filaFil === f.id) + '">' +
                f.t + " " + f.n + "</button>";
            }).join("") + "</div>") +
      "</div>" +
      '<div style="overflow-x:auto"><table class="tabla t-part"><thead>' + cab +
        "</thead><tbody>" + cuerpo + "</tbody></table></div>" +
      (modoLista ? barraPase(g)
        : '<div class="tabla-pie">' +
          "<span>Ninguna persona se elimina del grupo: la baja se registra con su motivo y el historial se " +
          "conserva (RNF03).</span><span>" + r.n + " activas · " + (g.p.length - r.n) + " bajas</span></div>") +
      "</div>";
  }

  /* ---------- Alta: la predicción va ANTES de confirmar ----------------- */
  function panelAgregar(g, r) {
    var yaEstan = {};
    g.p.forEach(function (x) { yaEstan[x.e] = 1; });
    var lista = CANDIDATOS.filter(function (c) {
      if (yaEstan[c.e]) return false;
      if (!buscaCand) return true;
      return (c.n + " " + c.e + " " + PAIS[c.nac]).toLowerCase().indexOf(buscaCand.toLowerCase()) >= 0;
    });

    var pred = "";
    if (candSel) {
      var c = null;
      CANDIDATOS.forEach(function (x) { if (x.e === candSel) c = x; });
      if (c) {
        var ext2 = r.ext + (c.ext ? 1 : 0), mex2 = r.mex + (c.ext ? 0 : 1);
        var rompe = !(ext2 > mex2);
        var pct2  = Math.round(ext2 / (r.n + 1) * 100);
        pred = '<div class="pred' + (rompe ? " rompe" : "") + '">' + (rompe ? ico("alerta") + " " : "") +
          "Al inscribir a <b>" + esc(c.n) + "</b> el cupo queda en <b>" + (r.n + 1) + " de " + g.cupo +
          "</b> y la proporción en <b>" + ext2 + " extranjeras / " + mex2 + " mexicanas (" + pct2 + "%)</b>. " +
          (rompe
            ? "Con esa alta el grupo dejaría de cumplir la proporción mayoritaria extranjera y no podría abrirse."
            : "El grupo sigue cumpliendo la proporción mayoritaria extranjera.") +
          (docOk(c) ? ""
            : " Le falta " + (!c.curp ? "la CURP vigente" : "la constancia COMAR") +
              ": puede inscribirse, pero no podrá acreditar si no la presenta antes del " + fecha(g.fin) + ".") +
          (c.prev ? " Ya cursó " + plural(c.prev, "curso", "cursos") +
            "; no hay límite de cursos por persona." : "") +
          "</div>";
      }
    }

    return '<div class="panel-add">' +
      "<h3>Agregar participante al grupo</h3>" +
      '<p style="font-size:12.5px;color:var(--gris);margin:0 0 11px;line-height:1.45">Solo se inscribe a personas ' +
        "con expediente en el SIAMH. La documentación incompleta no impide la inscripción: impide la acreditación.</p>" +
      '<input type="text" id="buscaCand" value="' + esc(buscaCand) +
        '" placeholder="Buscar por nombre, folio o nacionalidad" aria-label="Buscar persona con expediente" ' +
        'style="width:100%;height:36px;border:1px solid var(--linea);border-radius:var(--radio-s);' +
        'padding:0 11px;font-family:var(--f-texto);font-size:13px;background:var(--blanco)">' +
      '<div style="max-height:212px;overflow-y:auto;margin-top:8px">' +
        (lista.length ? lista.map(function (c) {
          return '<div class="cand">' +
            '<input type="radio" name="cand" value="' + c.e + '"' + (candSel === c.e ? " checked" : "") +
              ' style="width:17px;height:17px;accent-color:var(--jade);flex:none" aria-label="' + esc(c.n) + '">' +
            '<span class="c-txt"><span class="c-nom">' + esc(c.n) +
              '<span class="nac">' + c.nac + "</span></span>" +
              '<span class="c-sub">MH-2026-' + c.e + " · " + PAIS[c.nac] +
                (c.prev ? " · " + plural(c.prev, "curso previo", "cursos previos") : " · primer curso") +
              "</span></span>" +
            (docOk(c) ? '<span class="chip chip-jade">' + ico("check") + "Documentada</span>"
                      : '<span class="chip chip-rosa">' + ico("alerta") + "Incompleta</span>") +
            "</div>";
        }).join("")
          : '<div style="padding:18px;font-size:12.5px;color:var(--gris);text-align:center">' +
            'Ninguna persona con expediente coincide. <a href="registro.html">Dar de alta un expediente nuevo</a>.</div>') +
      "</div>" + pred +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button class="btn btn-primario btn-s" type="button" id="btnConfAdd"' + (candSel ? "" : " disabled") +
          ">" + ico("mas") + "Inscribir en el grupo</button>" +
        '<button class="btn btn-secundario btn-s" type="button" id="btnCancAdd">Cancelar</button>' +
      "</div></div>";
  }

  function panelBaja(g) {
    var x = null;
    g.p.forEach(function (q) { if (q.e === bajaDe) x = q; });
    if (!x) return "";
    return '<div class="panel-baja">' +
      "<h3>Registrar baja de " + esc(x.n) + "</h3>" +
      '<p style="font-size:12.5px;color:var(--guinda-900);margin:0 0 12px;line-height:1.45">' +
        "La baja <strong>no elimina</strong> a la persona del grupo ni de su expediente (RNF03): queda registrada " +
        "con su motivo y su asistencia acumulada, y libera un lugar del cupo.</p>" +
      '<div class="campo" style="margin-bottom:12px;max-width:440px">' +
        '<label for="motBaja">Motivo de la baja <span class="req">*</span></label>' +
        '<select id="motBaja"><option value="">Seleccione el motivo</option>' +
        MOTIVOS_BAJA.map(function (m) { return '<option value="' + esc(m) + '">' + esc(m) + "</option>"; }).join("") +
        '<div class="msg-error">Indique el motivo: la baja siempre queda documentada.</div></select></div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn btn-peligro btn-s" type="button" id="btnConfBaja">Registrar la baja</button>' +
        '<button class="btn btn-secundario btn-s" type="button" id="btnCancBaja">Cancelar</button>' +
      "</div></div>";
  }

  /* Temporada propuesta: la que tiene el registro abierto o, si no hay, la
     siguiente programada. */
  var ngTemp = (TEMPORADAS.filter(function (t) { return estTemp(t) === "registro"; })[0] ||
                TEMPORADAS.filter(function (t) { return estTemp(t) === "programada"; })[0] ||
                TEMPORADAS[TEMPORADAS.length - 1]).id;
  function ngFechas() {
    var t = temporada(ngTemp);
    var abre = t.reg[0] < HOY ? HOY : t.reg[0];
    var ini = t.ini < abre ? suma(abre, 7) : t.ini;
    var fin = suma(ini, 45) > t.lim ? t.lim : suma(ini, 45);
    return { abre:abre, cierre:t.reg[1], inicio:ini, fin:fin };
  }

  /* Reglas de fechas de un grupo contra su temporada. Devuelve el primer
     problema en palabras, o null. */
  function validaFechas(t, f) {
    if (!f.abre || !f.cierre || !f.inicio || !f.fin) return "Captura las cuatro fechas del grupo.";
    if (f.cierre < f.abre)  return "La inscripción no puede cerrar antes de abrir.";
    if (f.fin <= f.inicio)  return "La conclusión debe ser posterior al inicio.";
    if (f.abre < t.reg[0] || f.cierre > t.reg[1])
      return "El registro debe caer dentro del periodo de la temporada " + t.t + " (" +
             fecha(t.reg[0]) + " al " + fecha(t.reg[1]) + ").";
    if (f.inicio < t.ini) return "Los cursos de la temporada " + t.t + " arrancan a partir del " + fecha(t.ini) + ".";
    if (f.fin > t.lim)    return "El curso rebasa el límite de atención de la temporada (" + fecha(t.lim) + ").";
    return null;
  }

  function panelNuevoGrupo() {
    return '<div class="tarjeta" id="panelNuevoGrupo" style="margin-bottom:16px;border:1.5px solid var(--jade);background:var(--jade-020)">' +

          '<div class="campo" style="flex:1.5">' +
            '<label for="ngCurso">Nombre del curso o taller <span class="req">*</span></label>' +

          '</div>' +
          '<div class="campo">' +
            '<label for="ngMod">Modalidad</label>' +
            '<select id="ngMod">' +
              '<option value="Presencial">Presencial</option>' +
              '<option value="Taller en campo">Taller en campo</option>' +
              '<option value="Híbrida">Híbrida</option>' +
            '</select>' +
          '</div>' +
          '<div class="campo">' +
            '<label for="ngAula">Aula o Taller</label>' +
            '<input type="text" id="ngAula" value="Taller 1" placeholder="Ej. Taller de alimentos">' +
          '</div>' +
        '</div>' +
        '<div class="fila">' +
          '<div class="campo" style="flex:1.5">' +
            '<label for="ngInst">Instructor(a) <span class="req">*</span></label>' +
            '<input type="text" id="ngInst" placeholder="Nombre completo del instructor(a)">' +
          '</div>' +
          '<div class="campo" style="flex:1">' +
            '<label for="ngCupo">Cupo máximo <span class="req">*</span></label>' +
            '<input type="number" id="ngCupo" min="1" step="1" inputmode="numeric" value="18" placeholder="Número de lugares">' +
          '</div>' +
        '</div>' +
        /* Temporada: propone las fechas de su ventana; se pueden ajustar
           dentro de ella, y el límite de atención no se puede rebasar. */
        '<div class="fila">' +
          '<div class="campo" style="flex:1.5">' +
            '<label for="ngTemp">Temporada de apertura <span class="req">*</span></label>' +
            '<select id="ngTemp">' +
              TEMPORADAS.filter(function (t) { return estTemp(t) !== "concluida"; }).map(function (t) {
                return '<option value="' + t.id + '"' + (t.id === ngTemp ? " selected" : "") + '>' +
                  esc(t.t) + ' · registro ' + fecha(t.reg[0]) + '–' + fecha(t.reg[1]) + '</option>';
              }).join("") +
            '</select>' +
          '</div>' +
          '<div class="campo" style="flex:1">' +

          '</div>' +

          '<div class="campo">' +
            '<label for="ngAbre">Abre la inscripción <span class="req">*</span></label>' +

          '<div class="campo">' +
            '<label for="ngCie">Cierra la inscripción <span class="req">*</span></label>' +

          '<button class="btn btn-secundario btn-s" type="button" id="btnCancelaGrupo">Cancelar</button>' +
        '</div>' +
      '</form>' +
    '</div>';
  }

  /* ======================================================================
     6 bis. Temporadas de apertura
     ================================================================== */
  var panelTemp = false;       /* formulario de nueva temporada abierto */
  var tempAbierto = false;     /* plegable abierto */

  function bloqueTemporadas() {
    var activa = TEMPORADAS.filter(function (t) { return estTemp(t) === "registro"; })[0];
    var filas = TEMPORADAS.map(function (t) {
      var e = EST_TEMP[estTemp(t)];
      var n = GRUPOS.filter(function (g) { return g.temporada === t.id; }).length;

    var form = panelTemp
      ? '<div class="panel-add" style="margin:14px 16px 16px">' +
          "<h3>Programar una temporada</h3>" +

            "en esta temporada solo podrán inscribir dentro del periodo de registro y concluir antes del límite de atención.</p>" +
          '<div class="fila">' +
            '<div class="campo" style="flex:1.4"><label for="ntNom">Nombre <span class="req">*</span></label>' +
              '<input type="text" id="ntNom" placeholder="Ej. Primavera 2027"></div>' +
            '<div class="campo"><label for="ntRegI">Registro desde <span class="req">*</span></label><input type="date" id="ntRegI"></div>' +
            '<div class="campo"><label for="ntRegF">Registro hasta <span class="req">*</span></label><input type="date" id="ntRegF"></div>' +
            '<div class="campo"><label for="ntIni">Inicio de cursos <span class="req">*</span></label><input type="date" id="ntIni"></div>' +
            '<div class="campo"><label for="ntLim">Límite de atención <span class="req">*</span></label><input type="date" id="ntLim"></div>' +
          "</div>" +
          '<div class="aviso aviso-guinda" id="ntError" hidden></div>' +
          '<div style="display:flex;gap:8px;margin-top:4px">' +
            '<button class="btn btn-primario btn-s" type="button" id="btnGuardaTemp">' + ico("guardar") + "Programar temporada</button>" +
            '<button class="btn btn-secundario btn-s" type="button" id="btnCancTemp">Cancelar</button>' +
          "</div></div>"
      : "";

    return '<details class="plegable" id="plegTemp"' + (tempAbierto ? " open" : "") + ">" +
      "<summary>Temporadas de apertura · " +
        (activa ? esc(activa.t) + " con registro abierto hasta el " + fecha(activa.reg[1])
                : "ninguna con registro abierto hoy") + "</summary>" +
      '<div class="cuerpo" style="padding:0">' +
        '<div style="overflow-x:auto"><table class="tabla t-temp"><colgroup>' +
          '<col style="width:24%"><col style="width:22%"><col style="width:14%"><col style="width:14%">' +
          '<col style="width:8%"><col style="width:18%"></colgroup><thead><tr>' +
          "<th>Temporada</th><th>Periodo de registro</th><th>Inicio de cursos</th><th>Límite de atención</th>" +
          '<th class="num">Grupos</th><th>Estado</th></tr></thead><tbody>' + filas + "</tbody></table></div>" +
        form +
        (panelTemp ? "" : '<div class="tabla-pie"><span>Una temporada programada abre su registro sola en la fecha ' +
          "indicada; sus grupos quedan como <b>Programado</b> hasta entonces.</span>" +
          '<button class="btn btn-secundario btn-s" type="button" id="btnNuevaTemp">' + ico("mas") +
          "Programar temporada</button></div>") +
      "</div></details>";
  }

  /* ======================================================================
     6 ter. Constancia de registro al curso (22/09/2026)
     ------------------------------------------------------------------
     Al inscribir, la constancia se envía SOLA al medio de contacto que dio
     la persona (WhatsApp o correo). En el prototipo el envío se simula; los
     enlaces de WhatsApp y correo permiten hacerlo a mano mientras no exista
     la integración (WhatsApp Business / correo institucional).
     ================================================================== */
  var ultimoEnvio = null;      /* { g, e } del último envío, para el panel */
  var consInsc = 120;          /* serie de constancias de inscripción */

  function contacto(x) {
    if (x.medio === "correo" && x.mail) return { medio:"correo", dest:x.mail, t:"correo electrónico" };
    if (x.tel) return { medio:"whatsapp", dest:x.tel, t:"WhatsApp" };
    if (x.mail) return { medio:"correo", dest:x.mail, t:"correo electrónico" };
    return null;
  }

  function mensajeConstancia(g, x, env) {
    return "SIAMH · Secretaría de la Frontera Sur\n" +
      "Constancia de registro " + env.fol + "\n\n" +
      "Hola, " + x.n + ". Quedaste registrada/o en el curso «" + g.curso + "» " +
      "(grupo " + g.id + "), en " + g.sede + ", " + g.aula + ".\n" +
      "Inicia el " + fecha(g.inicio) + " y concluye el " + fecha(g.fin) + ".\n\n" +
      "Esta constancia no es un documento migratorio. Se verifica por folio y sello en la ventanilla.";
  }

  /* La constancia de inscripción en hoja oficial (23/09/2026): la misma
     vista previa a pantalla completa y la misma impresión que el resto de
     los documentos, en vez de imprimir la pantalla entera. */
  function hojaConstancia(g, x, env) {
    return SIMH.hojaSFS({
      encabezado: '<div class="hs-der"><b>Folio ' + esc(env.fol) + "</b><br>" +
        "Tapachula de Córdova y Ordoñez, Chiapas.<br>" + SIMH.fechaLarga(env.t) + ".</div>",
      titulo: "CONSTANCIA DE REGISTRO A CURSO DE CAPACITACIÓN",
      cuerpo: [
        "La Subsecretaría de Movilidad Humana de la Secretaría de la Frontera Sur hace constar que " +
        "<b>" + esc(x.n) + "</b>, con expediente <b>MH-2026-" + esc(x.e) + "</b>, quedó registrada en el curso " +
        "<b>«" + esc(g.curso) + "»</b> (grupo " + esc(g.id) + "), que se imparte en " + esc(g.sede) + ", " +
        esc(g.aula) + ", del " + fecha(g.inicio) + " al " + fecha(g.fin) + ".",
        "Esta constancia <b>no es un documento migratorio</b> ni acredita estancia regular en el país. " +
        "Se verifica por folio y sello en la ventanilla de la Secretaría.",
        "Se extiende la presente para los fines que a la persona interesada convengan."
      ],
      ccp: false
    });
  }

  function enviarConstancia(g, x) {
    var ct = contacto(x);
    consInsc += 1;
    var env = { fol:"CI-" + ("000" + consInsc).slice(-4) + "/2026", t:HOY,
                medio: ct ? ct.medio : null, dest: ct ? ct.dest : null, mt: ct ? ct.t : null };
    x.envios = (x.envios || []).concat(env);
    ultimoEnvio = { g:g.id, e:x.e };
    return env;
  }

  function panelEnvio(g) {
    if (!ultimoEnvio || ultimoEnvio.g !== g.id) return "";
    var x = g.p.filter(function (q) { return q.e === ultimoEnvio.e; })[0];
    if (!x || !x.envios || !x.envios.length) return "";
    var env = x.envios[x.envios.length - 1];
    var msg = mensajeConstancia(g, x, env);
    if (!env.medio) {
      return '<div class="accion tibia" style="margin-bottom:16px">' + ico("alerta") +
        '<div class="a-tx"><span class="a-t">Constancia ' + esc(env.fol) + " sin enviar: " + esc(x.n) +
          " no dejó teléfono ni correo</span>" +
          '<span class="a-n">Entrégasela impresa en la ventanilla, o captura un medio de contacto en su expediente y reenvíala.</span></div>' +
        '<div class="a-acc"><button class="btn btn-secundario btn-s" type="button" id="btnImpCons">' + ico("ojo") +
          "Ver e imprimir constancia</button>" +
          '<button class="btn btn-texto btn-s" type="button" id="btnCierraEnv">Cerrar</button></div></div>';
    }
    var enlace = env.medio === "whatsapp"
      ? "https://wa.me/" + env.dest.replace(/\D/g, "") + "?text=" + encodeURIComponent(msg)
      : "mailto:" + env.dest + "?subject=" + encodeURIComponent("Constancia de registro " + env.fol) +
        "&body=" + encodeURIComponent(msg);
    return '<div class="accion ok" style="margin-bottom:16px">' + ico("check") +
      '<div class="a-tx"><span class="a-t">Constancia ' + esc(env.fol) + " enviada por " + esc(env.mt) +
        " a " + esc(env.dest) + "</span>" +
        '<span class="a-n">Se envió automáticamente al inscribir a ' + esc(x.n) + ". " +
        "<i>Prototipo: el envío se simula; mientras no exista la integración, el enlace abre el mensaje listo para mandarlo a mano.</i></span>" +
        '<pre class="msg-prev">' + esc(msg) + "</pre></div>" +
      '<div class="a-acc"><a class="btn btn-secundario btn-s" target="_blank" rel="noopener" href="' + esc(enlace) + '">' +
        (env.medio === "whatsapp" ? "Abrir en WhatsApp" : "Abrir en el correo") + "</a>" +
        '<button class="btn btn-texto btn-s" type="button" id="btnCierraEnv">Cerrar</button></div></div>';
  }

  function acuse() {
    if (!altas.length) return "";
    return '<div class="aviso aviso-jade">' + ico("check") +
      "<span><strong>" + plural(altas.length, "alta registrada", "altas registradas") +
      " en esta sesión</strong>" + altas.map(esc).join(" · ") + "</span></div>";
  }

  function pintaDetalle() {
    var g = grupo(), r = resumen(g), e = EST[g.estado], pen = pendiente(g);

    var alerta = pen
      ? '<div class="aviso ' + (pen.peso <= 2 ? "aviso-guinda" : "aviso-rosa") + '">' + ico("alerta") +
        "<span><strong>Este grupo requiere acción</strong>" + esc(pen.txt) + ". " +
        (pen.peso === 1
          ? "La proporción se verifica al cerrar la inscripción el " + fecha(g.cierre) +
            "; si no se cumple, el grupo no puede abrirse con presupuesto de atención a personas en movilidad."
          : pen.peso === 2
            ? "Después de esa fecha la documentación ya no puede subsanarse para este grupo."
            : "") + "</span></div>"
      : "";

    var idxActual = GRUPOS.indexOf(g);

    var banner = '<div class="banner-caso-activo">' +
      '<div class="bca-superior">' +
        '<div class="bca-persona">' +
          '<div class="bca-foto">' + ico("capacita") + '</div>' +
          '<div class="bca-datos">' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
              '<span class="bca-nombre">' + esc(g.curso) + '</span>' +
              '<span class="folio-tag">Grupo ' + g.id + '</span>' +
              '<span class="chip ' + e.c + '">' + e.t + '</span>' +
              '<span class="chip chip-neutro">' + esc(g.modalidad) + '</span>' +
            '</div>' +
            '<div class="bca-meta">' +
              '<span>Clave: <b>' + esc(g.clave) + '</b></span>' +
              '<span>·</span>' +
              '<span>Sede: <b>' + esc(g.sede) + '</b> (' + esc(g.aula) + ')</span>' +
              '<span>·</span>' +
              '<span>Municipio: <b>' + esc(g.mun) + '</b></span>' +
              '<span>·</span>' +
              '<span>Instructor: <b>' + esc(g.instructor) + '</b></span>' +
              '<span>·</span>' +
              '<span>Cupo: <b>' + r.n + '/' + g.cupo + ' inscritos</b></span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-8">' +
          '<button class="btn btn-secundario btn-s" type="button" onclick="alert(\'Generando lista de asistencia en formato XLSX...\')">' + ico("excel") + 'Lista de asistencia</button>' +
          '<button class="btn btn-secundario btn-s" type="button" id="btnListaFirma">' + ico("pdf") + 'Lista para firma</button>' +
        '</div>' +
      '</div>' +
      '<div class="bca-controles">' +
        '<div class="bca-nav">' +
          '<button type="button" class="bca-nav-btn" id="btnCasoAnt"' + (idxActual <= 0 ? ' disabled' : '') + '>' +
            ico("izq") + 'Anterior' +
          '</button>' +
          '<span class="bca-nav-pos">Grupo ' + (idxActual + 1) + ' de ' + GRUPOS.length + ' en cartera</span>' +
          '<button type="button" class="bca-nav-btn" id="btnCasoSig"' + (idxActual >= GRUPOS.length - 1 ? ' disabled' : '') + '>' +
            'Siguiente ' + ico("der") +
          '</button>' +
        '</div>' +
        '<button type="button" class="btn-cambiar-caso" id="btnAbrirSelector">' +
          '<svg viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>' +
          'Cambiar grupo / Buscar en cartera <kbd>Ctrl+K</kbd>' +
        '</button>' +
      '</div>' +
    '</div>';

    var cab = '<div class="tarjeta" style="margin-bottom:16px">' +
      '<div class="rejilla g-3">' + bloqueCupo(g, r) + bloqueProp(g, r) + bloquePlazo(g) + "</div>" +
      '<div class="tarjeta-pie">La lista para firma física se imprime con membrete, folio del grupo y espacio de ' +
        "sello. <strong>No lleva código QR</strong>: la validación es por folio y sello.</div></div>";

    $("#detalle").innerHTML = bloqueTemporadas() + banner + acuse() + panelEnvio(g) + alerta + cab +
      (panelNuevo ? panelNuevoGrupo() : "") +
      (panelAdd ? panelAgregar(g, r) : "") +
      '<div style="margin-bottom:16px">' + bloqueRequisitos(g, r) + "</div>" +
      tablaParticipantes(g, r) +
      (bajaDe ? panelBaja(g) : "");

    SIMH.paginar($("#detalle"));
    liga();
  }

  /* ======================================================================
     7. Eventos del detalle (se vuelven a ligar en cada repintado)
     ================================================================== */
  function liga() {
    var g = grupo();

    /* ---------- Temporadas ---------- */
    var pt = $("#plegTemp");
    if (pt) pt.ontoggle = function () { tempAbierto = this.open; };
    var bnt = $("#btnNuevaTemp");
    if (bnt) bnt.onclick = function () { panelTemp = true; tempAbierto = true; pintaDetalle(); $("#ntNom").focus(); };
    var bct = $("#btnCancTemp");
    if (bct) bct.onclick = function () { panelTemp = false; pintaDetalle(); };
    var bgt = $("#btnGuardaTemp");
    if (bgt) bgt.onclick = function () {
      var t = { t:$("#ntNom").value.trim(), reg:[$("#ntRegI").value, $("#ntRegF").value],
                ini:$("#ntIni").value, lim:$("#ntLim").value };
      var err = !t.t || !t.reg[0] || !t.reg[1] || !t.ini || !t.lim ? "Captura el nombre y las cuatro fechas."
              : t.reg[1] < t.reg[0] ? "El registro no puede cerrar antes de abrir."
              : t.ini < t.reg[0]    ? "Los cursos no pueden iniciar antes de que abra el registro."
              : t.lim <= t.ini      ? "El límite de atención debe ser posterior al inicio de cursos."
              : t.reg[1] > t.lim    ? "El registro no puede cerrar después del límite de atención."
              : null;
      if (err) {
        var ne = $("#ntError");
        ne.hidden = false;
        ne.innerHTML = ico("alerta") + "<span><strong>Revisa la temporada</strong>" + esc(err) + "</span>";
        return;
      }
      t.id = "T-" + t.ini.slice(0, 4) + "-" + (TEMPORADAS.length + 1);
      TEMPORADAS.push(t);
      TEMPORADAS.sort(function (a, b) { return a.reg[0] < b.reg[0] ? -1 : 1; });
      panelTemp = false;
      pintaDetalle();
      if (SIMH.toast) SIMH.toast("Temporada " + t.t + " programada: el registro abre el " + fecha(t.reg[0]), "ok");
    };

    /* ---------- Constancia de registro ---------- */
    var bce = $("#btnCierraEnv");
    if (bce) bce.onclick = function () { ultimoEnvio = null; pintaDetalle(); };
    /* Lista para firma física: hoja oficial en el visor común (23/09/2026). */
    var blf = $("#btnListaFirma");
    if (blf) blf.onclick = function () {
      var lista = activos(g);
      SIMH.verDocumento(SIMH.hojaReporte({
        titulo: "LISTA DE ASISTENCIA PARA FIRMA",
        intro: "Curso <b>«" + esc(g.curso) + "»</b>, grupo " + esc(g.id) + ". Sede: " + esc(g.sede) +
          " (" + esc(g.aula) + "), " + esc(g.mun) + ". Instructor: " + esc(g.instructor) + ". Del " +
          fecha(g.inicio) + " al " + fecha(g.fin) + ". Fecha de la sesión: ____________________.",
        secciones: [{ cols: ["#", "Nombre", "Expediente", "Nacionalidad", "Firma o huella"], num: [0],
          anchos: ["6%", "34%", "18%", "15%", "27%"],
          filas: lista.map(function (x, i) { return [i + 1, x.n, "MH-2026-" + x.e, x.nac, " "]; }) }],
        nota: "Firma de la persona instructora: ______________________________"
      }), "Lista para firma · grupo " + g.id);
    };

    var bic = $("#btnImpCons");
    if (bic) bic.onclick = function () {
      var x = g.p.filter(function (q) { return q.e === ultimoEnvio.e; })[0];
      var env = x.envios[x.envios.length - 1];
      SIMH.verDocumento(hojaConstancia(g, x, env), "Constancia de registro " + env.fol + " · " + x.n);
    };
    $$("[data-reenv]").forEach(function (b) {
      b.onclick = function () {
        var e = this.getAttribute("data-reenv");
        var x = g.p.filter(function (q) { return q.e === e; })[0];
        if (!x) return;
        enviarConstancia(g, x);
        pintaDetalle();
        window.scrollTo({ top:0, behavior:"smooth" });
      };
    });

    var bcng = $("#btnCancelaGrupo");
    if (bcng) bcng.onclick = function () { panelNuevo = false; pintaDetalle(); };

    SIMH.activarOtro($("#panelNuevoGrupo"));
    var ngt = $("#ngTemp");
    if (ngt) ngt.onchange = function () {
      ngTemp = this.value;
      var f = ngFechas();
      $("#ngAbre").value = f.abre; $("#ngCie").value = f.cierre;
      $("#ngIni").value = f.inicio; $("#ngFin").value = f.fin;
      $("#ngLim").textContent = fecha(temporada(ngTemp).lim);
      $("#ngError").hidden = true;
    };

    var bgng = $("#btnGuardarGrupo");
    if (bgng) bgng.onclick = function () {
      var curso = $("#ngCurso").value.trim();
      var inst = $("#ngInst").value.trim();
      var vs = SIMH.valorOtro("#ngSede");
      var sede = vs.clave === "OTRO" ? vs.otro : vs.clave;
      var cupo = parseInt($("#ngCupo").value, 10);
      if (!curso || !inst || !sede || !(cupo > 0)) {
        alert("Captura el nombre del curso, la sede, el instructor y un cupo mayor que cero.");
        return;
      }
      var sc = SEDES_CAP.filter(function (x) { return x.t === sede; })[0];
      var t = temporada($("#ngTemp").value);
      var f = { abre:$("#ngAbre").value, cierre:$("#ngCie").value, inicio:$("#ngIni").value, fin:$("#ngFin").value };
      var err = validaFechas(t, f);
      if (err) {
        var ne = $("#ngError");
        ne.hidden = false;
        ne.innerHTML = ico("alerta") + "<span><strong>Revisa las fechas</strong>" + esc(err) + "</span>";
        return;
      }
      var nuevoId = "G-2026-0" + (GRUPOS.length + 20);
      var nuevoG = {
        id: nuevoId,
        curso: curso,
        clave: $("#ngClave").value.trim() || "—",
        sede: sede,
        mun: sc ? sc.mun : (SIMH.sesion().mun || "Tapachula"),
        modalidad: $("#ngMod").value,
        aula: $("#ngAula").value.trim() || "Taller principal",
        instructor: inst,
        temporada: t.id,
        abre: f.abre,
        inicio: f.inicio,
        fin: f.fin,
        cierre: f.cierre,
        sesiones: 16,
        sesion: 0,
        cupo: cupo,
        estado: HOY < f.abre ? "programado" : "conformacion",
        p: []
      };
      GRUPOS.unshift(nuevoG);
      sel = nuevoId;
      panelNuevo = false;
      pintaMunicipios();
      pintaChips();
      pintaLista();
      pintaDetalle();
      if (SIMH.toast) SIMH.toast(nuevoG.estado === "programado"
        ? "Grupo " + nuevoId + " programado: la inscripción abre el " + fecha(f.abre)
        : "Grupo " + nuevoId + " abierto con inscripción hasta el " + fecha(f.cierre), "ok");
    };

    var bm = $("#btnModo");
    if (bm) bm.onclick = function () { modoLista = !modoLista; pase = {}; pintaDetalle(); };

    var ba = $("#btnAdd");
    if (ba) ba.onclick = function () { panelAdd = true; panelNuevo = false; candSel = null; modoLista = false; pintaDetalle(); };

    var bc = $("#btnCancAdd");
    if (bc) bc.onclick = function () { panelAdd = false; candSel = null; buscaCand = ""; pintaDetalle(); };

    var bq = $("#buscaCand");
    if (bq) bq.oninput = function () {
      buscaCand = this.value;
      var pos = this.selectionStart;
      pintaDetalle();
      var n = $("#buscaCand");
      if (n) { n.focus(); n.setSelectionRange(pos, pos); }
    };

    $$("input[name=cand]").forEach(function (i) {
      i.onchange = function () { candSel = this.value; pintaDetalle(); };
    });

    var bf = $("#btnConfAdd");
    if (bf) bf.onclick = function () {
      var c = null;
      CANDIDATOS.forEach(function (x) { if (x.e === candSel) c = x; });
      if (!c) return;
      var nx = { e:c.e, n:c.n, nac:c.nac, ext:c.ext, curp:c.curp, comar:c.comar, a:0, prev:c.prev,
                 tel:c.tel, mail:c.mail, medio:c.medio };
      g.p.push(nx);
      altas.push(c.n + " (MH-2026-" + c.e + ")");
      /* La constancia de registro sale sola al medio que dio la persona. */
      enviarConstancia(g, nx);
      candSel = null; panelAdd = false; buscaCand = "";
      pintaChips(); pintaLista(); pintaDetalle();
      window.scrollTo({ top:0, behavior:"smooth" });
    };

    $$("[data-ff]").forEach(function (b) {
      b.onclick = function () { filaFil = this.getAttribute("data-ff"); pintaDetalle(); };
    });

    var vp = $("#verPend");
    if (vp) vp.onclick = function () {
      filaFil = (grupo().sesion && resumen(grupo()).riesgo + resumen(grupo()).perdida) ? "asis" : "docs";
      modoLista = false;
      pintaDetalle();
      var t = document.querySelector(".t-part");
      if (t) t.scrollIntoView({ behavior:"smooth", block:"center" });
    };

    $$("[data-pase]").forEach(function (b) {
      b.onclick = function () {
        pase[this.getAttribute("data-pase")] = this.getAttribute("data-v");
        pintaDetalle();
      };
    });

    var bt = $("#btnTodasP");
    if (bt) bt.onclick = function () {
      activos(g).forEach(function (x) { pase[x.e] = "P"; });
      pintaDetalle();
    };

    var bg = $("#btnGuardaPase");
    if (bg) bg.onclick = function () {
      g.sesion += 1;
      activos(g).forEach(function (x) { if (pase[x.e] === "P" || pase[x.e] === "J") x.a += 1; });
      if (g.sesion >= g.sesiones) g.estado = "concluido";
      else if (g.sesiones - g.sesion <= 2) g.estado = "porconcluir";
      pase = {}; modoLista = false;
      pintaChips(); pintaLista(); pintaDetalle();
      window.scrollTo({ top:0, behavior:"smooth" });
    };

    $$("[data-baja]").forEach(function (b) {
      b.onclick = function () {
        bajaDe = this.getAttribute("data-baja");
        pintaDetalle();
        var p = document.querySelector(".panel-baja");
        if (p) p.scrollIntoView({ behavior:"smooth", block:"center" });
      };
    });

    var cb = $("#btnCancBaja");
    if (cb) cb.onclick = function () { bajaDe = null; pintaDetalle(); };

    var kb = $("#btnConfBaja");
    if (kb) kb.onclick = function () {
      var s = $("#motBaja");
      if (!s.value) { s.parentNode.classList.add("error"); s.focus(); return; }
      g.p.forEach(function (x) { if (x.e === bajaDe) x.baja = { f:HOY, m:s.value }; });
      bajaDe = null;
      pintaChips(); pintaLista(); pintaDetalle();
    };
  }

  /* ======================================================================
     8. Eventos de la cartera (elementos fijos del HTML)
     ================================================================== */
  function pintaChips() {}
  function pintaLista() {}
  function pintaMunicipios() {}

  var gestor = SIMH.gestorCaso({
    items: GRUPOS,
    indiceInicial: Math.max(0, GRUPOS.findIndex(function(g){ return g.id === sel; })),
    titulo: "Cartera de grupos de capacitación",
    placeholder: "Buscar curso, sede o folio de grupo...",
    filtraItem: function(g, txt) {
      if (!txt) return true;
      var t = (g.curso + " " + g.sede + " " + g.id + " " + g.clave + " " + g.instructor + " " + g.mun).toLowerCase();
      return t.indexOf(txt.toLowerCase()) >= 0;
    },
    renderItem: function(g, esActivo, idx) {
      var r = resumen(g), e = EST[g.estado];
      return '<button type="button" class="drawer-item' + (esActivo ? ' activo' : '') + '" data-idx="' + idx + '">' +
        '<div class="drawer-item-avatar">' + ico("capacita") + '</div>' +
        '<div class="drawer-item-txt">' +
          '<span class="drawer-item-nom">' + esc(g.curso) + '</span>' +
          '<span class="drawer-item-sub">Grupo ' + g.id + ' · ' + esc(g.sede) + ' · ' + r.n + '/' + g.cupo + '</span>' +
        '</div>' +
        '<span class="chip ' + e.c + '">' + e.t + '</span>' +
      '</button>';
    },
    onSelect: function(g, idx) {
      sel = g.id;
      filaFil = "todos"; modoLista = false; panelAdd = false; bajaDe = null;
      pase = {}; candSel = null; buscaCand = "";
      pintaDetalle();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  pintaDetalle();

  /* Eventos de navegación y apertura del selector */
  document.addEventListener("click", function(e) {
    if (e.target.closest("#btnAbrirSelector")) {
      gestor.abrir();
    } else if (e.target.closest("#btnCasoAnt")) {
      gestor.anterior();
    } else if (e.target.closest("#btnCasoSig")) {
      gestor.siguiente();
    }
  });
})();
</script>
</body>
</html>
